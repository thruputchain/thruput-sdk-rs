name: Private sources
description: Authenticate hogd fetches with a job-local read-only App token
inputs:
  client-id:
    description: Component reader GitHub App client ID
    required: true
  private-key:
    description: Component reader GitHub App private key
    required: true
outputs:
  token:
    description: Read-only installation token for hogd
    value: ${{ steps.token.outputs.token }}
runs:
  using: composite
  steps:
    - name: Mint component reader token
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: thruputchain
        repositories: hogd
        permission-contents: read
    - name: Configure job-local Git authentication
      shell: bash
      # The GITHUB_ENV writes are a runner-generated temp path and a literal;
      # no attacker-influenced content, and no dangerous trigger uses this.
      # zizmor flags it because a composite action is audited in isolation.
      env:
        COMPONENT_TOKEN: ${{ steps.token.outputs.token }}
      run: | # zizmor: ignore[github-env]
        set +x
        set -euo pipefail
        umask 077
        config_path="$(mktemp "$RUNNER_TEMP/private-sources.XXXXXX")"
        bash .github/actions/private-sources/git-config.sh "$COMPONENT_TOKEN" "$config_path"
        echo "GIT_CONFIG_GLOBAL=$config_path" >> "$GITHUB_ENV"
        echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
