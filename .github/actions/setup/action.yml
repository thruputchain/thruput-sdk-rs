name: "Prepare Environment"
description: "Prepare the environment for building the SDK"
runs:
  using: "composite"
  steps:
    - name: gcc version check
      run: gcc --version
      shell: bash
    - name: clang version check
      run: clang --version
      shell: bash
    - name: Add Cargo to PATH
      # The github-env audit exists for GITHUB_PATH writes whose *content* an
      # attacker can influence, under a dangerous trigger such as
      # pull_request_target or workflow_run. Neither applies: the value is the
      # literal "$HOME/.cargo/bin", and no workflow in this repo uses a
      # dangerous trigger. zizmor flags it anyway because a composite action
      # is audited in isolation.
      run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH # zizmor: ignore[github-env]
      shell: bash
    - name: path check
      run: echo $PATH
      shell: bash
    - name: cargo version check
      run: cargo --version
      shell: bash
    - name: cargo clean
      run: cargo clean
      shell: bash
    - name: cargo log target dir
      run: cargo metadata --format-version=1 --no-deps | jq -r '.target_directory'
      shell: bash

