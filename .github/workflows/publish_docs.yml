# Manual, idempotent docs (re)generation for a given released version.
#
# Normal releases publish docs automatically via the inline "publish docs"
# steps in publish.yml. Use this workflow to rebuild docs for an
# already-tagged version (e.g. if a publish-time docs build broke). It checks
# out the tag, asserts it, and re-uploads with force, so it's safe to run any
# number of times.
#
# For a standard-interface crate, set packages to just that crate and
# tag_prefix to its tag scheme, e.g. packages=groundhog-erc20-if,
# tag_prefix=groundhog-erc20-if-v, version=0.1.12.
name: Publish docs

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to (re)generate docs for, e.g. 0.14.11'
        required: true
      tag_prefix:
        description: 'Tag prefix; the tag checked out is <tag_prefix><version>'
        required: false
        default: 'v'
      packages:
        description: 'Space-separated package list (default: the published SDK set)'
        required: false
        default: >-
          groundhog-event
          groundhog-storage-cost
          groundhog-contract-util
          groundhog-contract-spec
          groundhog-sys
          groundhog-domain-separator
          groundhog-native-exec
          groundhog-macros
          groundhog-u256
          groundhog-test-vectors
          groundhog-rv32-runtime
          sdk
          groundhog-spec-tool

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  publish-docs:
    runs-on: hog1
    steps:
      - name: Clean up .gitconfig
        run: rm -f /home/hogci/.gitconfig

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.ACTIONS_KEY }}
            ${{ secrets.SDK_TO_ITC }}
            ${{ secrets.SDK_TO_SELF }}

      - name: Checkout at tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag_prefix }}${{ inputs.version }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Configure git to use SSH
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Checkout actions repository
        uses: actions/checkout@v6
        with:
          repository: groundhogchain/actions
          path: actions
          ref: main

      - name: Build and publish docs
        uses: ./actions/cargo-doc
        with:
          packages: ${{ inputs.packages }}
          arch-only-packages: groundhog-rv32-runtime
          version: ${{ inputs.version }}
          registry-name: groundhog
          registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
          toolchain: nightly-2026-07-01
          force: 'true'
          expected-tag: ${{ inputs.tag_prefix }}${{ inputs.version }}
