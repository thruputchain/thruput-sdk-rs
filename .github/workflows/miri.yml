name: Miri

# Miri over the guest runtime's unsafe paths: the hand-rolled rv32
# mem-intrinsic cores and the bump-allocator arithmetic. Deliberately narrow
# -- this is the raw-pointer code where a provenance or aliasing mistake would
# be silent on device, not a general test run. The broad suites live in
# ci.yml / sdk_tests.yml.
#
# What this cannot cover: the allocator's `#[global_allocator]` wrapper binds
# linker-script extern statics (`__heap_base`, `__heap_end`) that Miri has no
# way to model, and the crate `compile_error!`s off-target. The pure cores
# are split out precisely so the logic is reachable from a host test; the
# extern-static derivation itself stays outside Miri's reach.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_THRUPUT_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token

# No job here uses GITHUB_TOKEN; read is all they need.
permissions:
  contents: read

jobs:
  miri:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: namespace-profile-hogd-linux-2604

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      # Dependency sources only, matching ci.yml -- see the note there on why
      # ./target is deliberately not cached.
      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git

      # Resolves against rust-toolchain.toml, so Miri matches the pinned
      # nightly the rest of the workspace builds with.
      - name: Install Miri
        run: |
          rustup component add miri
          cargo miri --version

      # `--lib` is required, not stylistic: a bare `cargo test -p ...` also
      # builds the plain (non-test) lib target, where `cfg(test)` is false and
      # the crate's `compile_error!` fires on a host build. `--lib` builds only
      # the test harness.
      - name: Miri - rv32 runtime (mem intrinsics, dispatch, bump allocator)
        run: cargo miri test -p groundhog-rv32-runtime --lib

      # `knuth_d` keeps its division scratch buffers as `MaybeUninit` and
      # initialises only part of each, so its soundness is a claim about
      # indices -- exactly what Miri checks. `tests/knuth_shapes.rs` is built
      # for this: it visits every `(nn, dn)` shape both instantiations admit
      # instead of sampling operands, which makes it exhaustive where it
      # matters and cheap enough to interpret (~1 min, against hours for the
      # sampling suites in `differential.rs`).
      #
      # Verified to be load-bearing rather than vacuous: dropping the `un[nn]`
      # write makes this step fail with "constructing invalid value of type
      # u32: encountered uninitialized memory".
      - name: Miri - u256 division scratch buffers (MaybeUninit soundness)
        run: cargo miri test -p groundhog-u256 --test knuth_shapes
