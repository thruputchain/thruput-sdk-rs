name: Native Exec Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:
  schedule:
    # Weekly: the latest-nightly job below is an early-warning canary for std
    # changes; without a schedule it would only fire when someone pushes.
    - cron: "17 6 * * 1"

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

# No job here uses GITHUB_TOKEN; read is all they need.
permissions:
  contents: read

jobs:
  test-linux-arm64:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: namespace-profile-hogd-linux-arm64
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: rust
          path: ~/.cargo/cooldown-check

      # Before anything builds dependency code.
      - uses: ./.github/actions/cooldown-check
        with:
          directories: .

      - name: Build and test thruput-native-exec
        run: cargo test -p thruput-native-exec -- --show-output

  test-macos-arm64:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: namespace-profile-hogd-arm64-macos
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: rust
          path: ~/.cargo/cooldown-check

      # Before anything builds dependency code.
      - uses: ./.github/actions/cooldown-check
        with:
          directories: .

      - name: Build and test thruput-native-exec
        run: cargo test -p thruput-native-exec -- --show-output

  # Early-warning canary: run the same suite on the latest nightly, ahead of
  # the workspace's pinned toolchain. The dev runtime's panic interception
  # leans on std panic-machinery details, and std changes there SIGABRT every
  # scaffolded project's `cargo test` (rust-lang/rust#158369 did exactly that
  # by making the old resume_unwind-in-the-hook conversion abort). This job
  # breaks first, before users' nightlies move past the change.
  test-latest-nightly:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: namespace-profile-hogd-linux-arm64
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: rust
          path: ~/.cargo/cooldown-check

      # Before anything builds dependency code.
      - uses: ./.github/actions/cooldown-check
        with:
          directories: .

      - name: Install latest nightly
        run: rustup toolchain install nightly --profile minimal

      - name: Build and test thruput-native-exec on latest nightly
        run: cargo +nightly test -p thruput-native-exec -- --show-output
