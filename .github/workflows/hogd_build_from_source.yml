name: Build FFI from Source check

# Expensive (full C++ FFI build from source) and the from-source path rarely
# changes, so run it on merges to main (and on demand) rather than on every PR
# commit. The prebuilt FFI is what every other job uses; this just guards the
# from-source path against bitrot.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Default for every job. `build` does not use GITHUB_TOKEN; `notify` widens
# its own token to manage the tracking issue.
permissions:
  contents: read

jobs:
  build:
    runs-on: namespace-profile-hogd-linux-2604
    env:
      HOGD_FFI_BUILD: "1"
      # hogd's C++ is a clang codebase; the runner defaults to gcc, which
      # rejects it (-fpermissive template errors). Build C/C++ with clang.
      CC: clang
      CXX: clang++
      # Persisted compiler cache (see the cache step). build.rs already sets
      # CMAKE_{C,CXX}_COMPILER_LAUNCHER=ccache, so the C++ recompile is cached
      # across runs by content — without caching ./target, which would let the
      # build reuse a stale .so and make this check vacuous.
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8
        with:
          persist-credentials: false

      # The source build clones a hogd release tag and its submodules, all
      # public. Tags up to test-ffi-v0.43.0 (and the thruput-go commit they
      # pin) use SSH submodule URLs, which need a key even for public
      # repositories. Fetch them anonymously over HTTPS instead.
      - name: Fetch GitHub sources over HTTPS
        run: |
          git config --global --add url.https://github.com/.insteadOf git@github.com:
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/

      # Deliberately NOT caching ./target: a cached target lets cargo reuse the
      # previously-built hogd .so and skip the cmake build entirely, so the
      # check goes green in seconds without actually rebuilding from source
      # (and the cross-invocation cache could even reuse another branch's
      # artifact). Cache only the dependency sources and the ccache compiler
      # cache, so every run does a real from-source build that stays fast.
      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/.ccache

      # The hogd C++ source build drives Rust via corrosion, which requires the
      # exact toolchain hogd pins (1.93.0). The Namespace profile only ships the
      # SDK's own toolchains, so install it explicitly.
      - name: Install hogd's pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --no-self-update

      - name: Install clang
        run: |
          if ! command -v clang >/dev/null; then
            sudo apt-get update && sudo apt-get install -y clang
          fi
          clang --version

      # build.rs drives the C++ compile through ccache; make sure it's present
      # and report cache stats before/after so the cross-run hit rate is visible.
      - name: Prepare ccache
        run: |
          if ! command -v ccache >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ccache
          fi
          ccache --version | head -1
          ccache --zero-stats

      - name: Build FFI from source
        run: cargo build -p thruput-sys --features source-build

      - name: ccache stats
        if: always()
        run: ccache --show-stats

  # Tracks this check's health on main in one issue labelled `ci-failure`. A
  # failed run opens the issue, or comments on the open one. The next passing
  # run closes it. Scheduled agents pick up open `ci-failure` issues, so the
  # body names the failed job, step, and reproduce command.
  notify:
    name: Track main failures in an issue
    needs: build
    # always() so this also runs when build fails. The script ignores a
    # cancelled or skipped build.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read # list the run's failed jobs and steps
      issues: write # open, comment on, and close the issue; create the label
    # One at a time, so two failing runs cannot both open an issue.
    concurrency:
      group: ${{ github.workflow }}-ci-failure-issue
      cancel-in-progress: false
    # The script is inline under `shell: python` so that actionlint's pyflakes
    # integration analyses it.
    steps:
      - name: Open, update, or close the tracking issue
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPRODUCE: >-
            HOGD_FFI_BUILD=1 CC=clang CXX=clang++
            cargo build -p thruput-sys --features source-build
        run: |
          import json
          import os
          import urllib.error
          import urllib.request

          LABEL = "ci-failure"
          PER_PAGE = 100
          PAGE_CAP = 20

          API = os.environ["GITHUB_API_URL"].rstrip("/")
          SERVER = os.environ["GITHUB_SERVER_URL"]
          REPO = os.environ["GITHUB_REPOSITORY"]
          TOKEN = os.environ["GH_TOKEN"]
          RUN_ID = os.environ["GITHUB_RUN_ID"]
          ATTEMPT = os.environ["GITHUB_RUN_ATTEMPT"]
          SHA = os.environ["GITHUB_SHA"]
          RESULT = os.environ["BUILD_RESULT"]
          WORKFLOW = os.environ["WORKFLOW_NAME"]
          TITLE = "{} failing on main".format(WORKFLOW)

          RUN_URL = "{}/{}/actions/runs/{}".format(SERVER, REPO, RUN_ID)
          COMMIT_URL = "{}/{}/commit/{}".format(SERVER, REPO, SHA)

          def call(path, data=None, method=None):
              if method is None:
                  method = "GET" if data is None else "POST"
              request = urllib.request.Request(
                  "{}/repos/{}/{}".format(API, REPO, path),
                  data=None if data is None else json.dumps(data).encode(),
                  headers={
                      "Authorization": "Bearer " + TOKEN,
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                  },
                  method=method,
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          def find_open_issue():
              # The label filter keeps this to one page in practice. The title
              # match lets other workflows share the label. The endpoint also
              # returns pull requests.
              for page in range(1, PAGE_CAP + 1):
                  batch = call(
                      "issues?state=open&labels={}&per_page={}&page={}".format(
                          LABEL, PER_PAGE, page
                      )
                  )
                  for issue in batch:
                      if "pull_request" not in issue and issue["title"] == TITLE:
                          return issue["number"]
                  if len(batch) < PER_PAGE:
                      return None
              print("::warning::gave up after {} pages; may open a duplicate".format(PAGE_CAP))
              return None

          def ensure_label():
              try:
                  call("labels/" + LABEL)
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  call("labels", {
                      "name": LABEL,
                      "color": "b60205",
                      "description": "A CI workflow is failing on main",
                  })

          def failed_jobs():
              jobs = call(
                  "actions/runs/{}/attempts/{}/jobs?per_page={}".format(
                      RUN_ID, ATTEMPT, PER_PAGE
                  )
              )["jobs"]
              lines = []
              for job in jobs:
                  if job["conclusion"] != "failure":
                      continue
                  steps = [
                      "`{}`".format(step["name"])
                      for step in job.get("steps") or []
                      if step["conclusion"] == "failure"
                  ]
                  lines.append("- [{}]({}): {}".format(
                      job["name"], job["html_url"],
                      ", ".join(steps) or "no failed step reported",
                  ))
              return lines or ["- none reported"]

          existing = find_open_issue()

          if RESULT == "success":
              if existing is None:
                  print("Passing, and no open issue to close")
              else:
                  print("Closing issue #{}".format(existing))
                  call("issues/{}/comments".format(existing), {
                      "body": "Passing again at {} in {}.".format(COMMIT_URL, RUN_URL),
                  })
                  call(
                      "issues/{}".format(existing),
                      {"state": "closed", "state_reason": "completed"},
                      "PATCH",
                  )
          elif RESULT == "failure":
              body = (
                  "`{}` failed on `main` at {}.\n\n"
                  "Run: {} (attempt {})\n\n"
                  "Failed jobs and steps:\n{}\n\n"
                  "Reproduce locally:\n\n"
                  "    {}\n"
              ).format(
                  WORKFLOW, COMMIT_URL, RUN_URL, ATTEMPT,
                  "\n".join(failed_jobs()), os.environ["REPRODUCE"],
              )
              if existing is not None:
                  print("Commenting on existing issue #{}".format(existing))
                  call("issues/{}/comments".format(existing), {"body": body})
              else:
                  print("Opening new issue")
                  ensure_label()
                  body += (
                      "\nThis issue closes when the workflow next passes on `main`.\n"
                  )
                  call("issues", {"title": TITLE, "body": body, "labels": [LABEL]})
          else:
              print("build result is '{}'; nothing to do".format(RESULT))
