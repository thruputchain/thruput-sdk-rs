name: Build FFI from Source check

# Expensive (full C++ FFI build from source) and the from-source path rarely
# changes, so run it on merges to main (and on demand) rather than on every PR
# commit. The prebuilt FFI is what every other job uses; this just guards the
# from-source path against bitrot.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_THRUPUT_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token

# No job here uses GITHUB_TOKEN; read is all they need.
permissions:
  contents: read

jobs:
  build:
    runs-on: namespace-profile-hogd-linux-2604
    env:
      HOGD_FFI_BUILD: "1"
      # hogd's C++ is a clang codebase; the runner defaults to gcc, which
      # rejects it (-fpermissive template errors). Build C/C++ with clang.
      CC: clang
      CXX: clang++
      # Persisted compiler cache (see the cache step). build.rs already sets
      # CMAKE_{C,CXX}_COMPILER_LAUNCHER=ccache, so the C++ recompile is cached
      # across runs by content — without caching ./target, which would let the
      # build reuse a stale .so and make this check vacuous.
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      # persist-credentials: false so the checkout's GITHUB_TOKEN (scoped to
      # this repo only) can't shadow the App token rewrites below.
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8
        with:
          persist-credentials: false

      # The source build clones hogd and its thruputchain submodules.
      # A job-local component-reader App token covers every moved repo, legacy
      # and canonical URLs alike; deploy keys remain only for the cargo git
      # dependencies still in groundhogchain.
      - name: Configure private sources
        uses: ./.github/actions/private-sources
        with:
          app-id: ${{ vars.COMPONENT_READER_APP_ID }}
          private-key: ${{ secrets.COMPONENT_READER_PRIVATE_KEY }}
          ssh-private-key: |
            ${{ secrets.SDK_TO_BCS_KEY }}
            ${{ secrets.SDK_TO_BCS_CPP_KEY }}
            ${{ secrets.SDK_TO_XDR_COMMON_KEY }}
            ${{ secrets.SDK_TO_XDRS_KEY }}
            ${{ secrets.SDK_TO_SERDE_ARRAYS_KEY }}
            ${{ secrets.SDK_TO_METRICS_HISTORY }}
            ${{ secrets.SDK_TO_ABORT_RS }}

      - name: Initialize submodules
        run: git submodule update --init --recursive

      # Deliberately NOT caching ./target: a cached target lets cargo reuse the
      # previously-built hogd .so and skip the cmake build entirely, so the
      # check goes green in seconds without actually rebuilding from source
      # (and the cross-invocation cache could even reuse another branch's
      # artifact). Cache only the dependency sources and the ccache compiler
      # cache, so every run does a real from-source build that stays fast.
      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/.ccache

      # The hogd C++ source build drives Rust via corrosion, which requires the
      # exact toolchain hogd pins (1.93.0). The Namespace profile only ships the
      # SDK's own toolchains, so install it explicitly.
      - name: Install hogd's pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --no-self-update

      - name: Install clang
        run: |
          if ! command -v clang >/dev/null; then
            sudo apt-get update && sudo apt-get install -y clang
          fi
          clang --version

      # build.rs drives the C++ compile through ccache; make sure it's present
      # and report cache stats before/after so the cross-run hit rate is visible.
      - name: Prepare ccache
        run: |
          if ! command -v ccache >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ccache
          fi
          ccache --version | head -1
          ccache --zero-stats

      - name: Build FFI from source
        run: cargo build -p thruput-sys --features source-build

      - name: ccache stats
        if: always()
        run: ccache --show-stats
