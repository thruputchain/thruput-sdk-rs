# Catch advisories filed since we last pushed.
name: Rust dependency audit

on:
  schedule:
    - cron: '30 8 * * *' # Daily at 08:30 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    name: Check dependency policy
    permissions:
      contents: read
    uses: groundhogchain/actions/.github/workflows/rust-dependency-policy.yml@2c5fd2d95a58f11da1e362b08c57a08fb7dfec51
    with:
      runs-on: namespace-profile-hogd-linux-2604
      checks: advisories
      registry-name: groundhog
    secrets:
      registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}

  notify:
    name: Report dependency problem
    needs: scan
    if: failure()
    permissions:
      contents: read
      issues: write
    uses: groundhogchain/actions/.github/workflows/rust-advisory-issue.yml@2c5fd2d95a58f11da1e362b08c57a08fb7dfec51
