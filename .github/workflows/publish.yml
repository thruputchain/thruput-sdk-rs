# Releases every published crate in this repository to crates.io in one
# idempotent pass, with the shared thruputchain/actions release actions.
#
# Publishing runs in dependency order:
#
#   1. the workspace-versioned crates up through `thruput-sdk`
#   2. the standard-interface crates, which caret-depend on `thruput-sdk`
#   3. the crates downstream of the standard interfaces: `thruput-spec-tool`
#      and the `thruput-erc20-*-test` crates
#
# The workspace-versioned crates release under one `v<version>` tag. The
# standard-interface crates version independently of the workspace, each
# under its own `<crate>-v<version>` tag. Every group is checked before
# anything is tagged, so a run that fails a check leaves the repository
# untouched. A new commit needs a workspace version bump. An interface crate
# whose tag sits on an older commit is skipped when crates.io already has
# that version, published from the tag, and the run fails otherwise rather
# than publish content that doesn't match the tag. Publishing skips versions
# crates.io already has from this release, so a run that fails partway is
# resumed by dispatching it again on the tagged commit.
#
# Authentication: crates.io trusted publishing (GitHub OIDC) for existing
# crates; see crates-io-publish's README in thruputchain/actions. Creating a
# crate needs the CRATESIO_CREATE_PACKAGE_TOKEN secret, a crates.io API token
# with the scopes publish-new, trusted-publishing and change-owners. The
# publish steps register this workflow as each new crate's trusted publisher
# and add CRATE_OWNERS as its owners, so remove the secret and revoke the
# token once every crate exists.
#
# The job runs in the `release` environment, and the trusted publishers the
# publish steps register require it, so only runs that environment's
# protection rules admit (required reviewers, deployment branches limited to
# main) can publish. Keep CRATESIO_CREATE_PACKAGE_TOKEN a secret of
# `release`, not of the repository: repository secrets reach every branch.
#
# crates.io lets a token create five crates in a burst, then one every ten
# minutes, and the publish steps wait those limits out: a release that
# creates every crate here takes about four hours.
#
# Dispatch with dry_run for all of the verification and none of the tagging
# or publishing.
name: Release SDK and standard interfaces

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (no tag/publish)'
        required: false
        type: boolean
        default: false

# Two concurrent releases would race on tags and crates.io state; queue them.
concurrency:
  group: publish

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Owners added to each crate a run creates, besides the token's owner.
  CRATE_OWNERS: github:thruputchain:core-maintainers
  # Workspace-versioned crates published under the `v<version>` tag, in
  # dependency order. INTERFACE_DEPENDENT_PACKAGES below is on the same version
  # line but is named separately: those crates publish after the standard
  # interfaces, while these are what the interfaces depend on. Dev-dependencies
  # count toward that order: packaging resolves them too, so `thruput-macros`
  # precedes `thruput-domain-separator`, whose tests use it.
  PRIMARY_PACKAGES: >-
    thruput-event
    thruput-exn
    thruput-storage-cost
    thruput-contract-util
    thruput-contract-spec
    thruput-sys
    thruput-macros
    thruput-domain-separator
    thruput-native-exec
    thruput-u256
    thruput-test-vectors
    thruput-rv32-runtime
    thruput-sdk
  # Standard-interface crates and their implementation components: versioned
  # independently of the workspace, each published under its own
  # `<crate>-v<version>` tag. In dependency order: each implementation
  # component exact-pins its interface crate, so it comes after it.
  INTERFACE_PACKAGES: >-
    thruput-erc20-if
    thruput-erc20-metadata-if
    thruput-erc20-controls-if
    thruput-erc20-pausable-if
    thruput-signed-op-if
    thruput-signed-op
    thruput-erc20-permit-if
    thruput-erc165-if
    thruput-erc721-if
    thruput-sep41
    thruput-access-control-if
    thruput-access-control
  # Published after INTERFACE_PACKAGES, under the same `v<version>` tag as
  # PRIMARY_PACKAGES.
  INTERFACE_DEPENDENT_PACKAGES: >-
    thruput-spec-tool
    thruput-erc20-test
    thruput-erc20-native-test

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write # pushes the release tags
      id-token: write # crates.io trusted publishing
    environment: release
    runs-on: namespace-profile-hogd-linux-2604
    env:
      # Share one FFI download cache across every thruput-sys build instance
      # (and across runs, via the Namespace cache below). The dry runs below
      # package thruput-sys once per feature combination, and each instance
      # would otherwise re-download the prebuilt FFI tarball into its own
      # OUT_DIR. Mirrors ci.yml.
      HOGD_DOWNLOAD_CACHE_DIR: ${{ github.workspace }}/.hogd-ffi-cache

    steps:
      # No SSH keys or submodules: nothing published reads the
      # integration_test/contracts submodule, the workspace has no git
      # dependencies, and tag pushes go over HTTPS with the job token.
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8
        with:
          # Full history and tags: the release checks read the tags, and
          # check out an interface crate's tagged commit to compare it with
          # what crates.io has.
          fetch-depth: 0

      # NB: deliberately NOT caching ./target (no `cache: rust`). The Namespace
      # cross-invocation cache is a network/overlay-backed mount; cargo's
      # many-small-file churn in target/ stalls on it. Cache only the dependency
      # *sources* (read-mostly, few large files) plus the one-shot FFI download.
      # Mirrors ci.yml.
      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/.hogd-ffi-cache

      # The dry runs below drive cargo-hack over each crate's feature
      # powerset, and the runner image does not ship it. It comes from
      # crates.io, so this needs no registry auth, and it is a ~1min compile
      # against a release that takes 15.
      #
      # Pinned exactly, and checked by version rather than by presence, the
      # way ci.sh pins the Thruput CLI: this runs in the release job, so it
      # must build the version that was tested rather than whatever was
      # published since. `--locked` alone would pin cargo-hack's dependencies
      # but not cargo-hack.
      - name: Install cargo-hack
        env:
          CARGO_HACK_VERSION: '0.6.45'
        run: |
          if [ "$(cargo hack --version 2>/dev/null | awk '{print $2}')" \
               != "$CARGO_HACK_VERSION" ]; then
            cargo install cargo-hack --version "=$CARGO_HACK_VERSION" --locked
          fi
          cargo hack --version

      # Tests stay in the repository: [workspace.package] excludes /tests and
      # every published crate inherits it. A crate that sets its own
      # `exclude` replaces the inherited one, so check what each would ship.
      - name: Check published crates leave tests/ out
        run: |
          set -euo pipefail
          status=0
          for package in $PRIMARY_PACKAGES $INTERFACE_PACKAGES $INTERFACE_DEPENDENT_PACKAGES; do
            if cargo package --list --locked --package "$package" | grep '^tests/'; then
              echo "::error::$package would publish its tests/ directory"
              status=1
            fi
          done
          exit "$status"

      - name: Publish dry run
        uses: thruputchain/actions/cargo-publish-dry-run@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          registry-name: crates-io
          packages: ${{ env.PRIMARY_PACKAGES }} ${{ env.INTERFACE_DEPENDENT_PACKAGES }}
          # The interface-dependent crates reach the standard interfaces (and
          # each other) as workspace path deps — `cargo vendor` skips those, so
          # the offline packaging steps need them pre-vendored. Pre-vendoring a
          # crate resolves its deps against vendor/ too, so the crates it
          # depends on come first, in dependency order — dev-dependencies
          # included.
          vendor-workspace-deps:
            thruput-storage-cost
            thruput-event
            thruput-exn
            thruput-contract-util
            thruput-contract-spec
            thruput-sys
            thruput-macros
            thruput-domain-separator
            thruput-native-exec
            thruput-u256
            thruput-rv32-runtime
            thruput-sdk
            thruput-erc20-if
            thruput-erc20-metadata-if
            thruput-erc20-pausable-if
            thruput-erc20-permit-if
            thruput-signed-op-if
            thruput-erc165-if
            thruput-erc721-if
            thruput-access-control-if
            thruput-erc20-test
          # thruput-domain-separator's backends are additive, so most combinations
          # are fine. The exception is a bare `syscall`: it forwards to
          # `thruput-xdr/syscalls`, which has no dispatch path on the host.
          # `syscall-mock` needs no skip -- it supplies that dispatch itself.
          cargo-hack-feature-options: --feature-powerset -F std --ignore-unknown-features --skip syscall
          # On guests, reaching thruput-domain-separator's `sha2` backend is a hard
          # error, so skip it and `default` (which pulls it in via `std`). Its
          # `syscall-mock` is host-only, like thruput-sdk's `mock`, and
          # thruput-sdk's `remote` implies `std`. `-F syscall` keeps the guest
          # backend compiled somewhere. All no-ops for the other packages here.
          cargo-hack-rv32-feature-options: --feature-powerset --skip std --skip mock --skip dev --skip remote --skip sha2 --skip default --skip syscall-mock -F syscall --ignore-unknown-features
          cargo-hack-rv32-packages: thruput-rv32-runtime thruput-sdk thruput-domain-separator
          arch-only-packages: thruput-rv32-runtime

      # The dry-run action leaves its vendor/ dir behind; clear it so the
      # standard-interfaces dry run below re-vendors from scratch.
      - name: Reset vendor dir
        run: rm -rf vendor

      - name: Publish dry run (standard interfaces)
        uses: thruputchain/actions/cargo-publish-dry-run@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        env:
          # The workspace no longer carries rv32 target rustflags (the single
          # rv32 config lives in fixtures/.cargo/config.toml).
          # The rv32-only spec-carrier bin built by the rv32 powerset below
          # only needs to LINK, so it gets the minimal link flags here. NOTE:
          # cargo JOINS env target-rustflags with config-defined ones (measured
          # on 1.95.0-nightly), so this works only because no config discovered
          # from the workspace root defines rv32 rustflags — re-adding a root
          # stanza would duplicate -T fatally. No immediate-abort here: this
          # build uses the prebuilt core (no build-std).
          CARGO_TARGET_RISCV32IM_UNKNOWN_NONE_ELF_RUSTFLAGS: >-
            -C link-arg=-Tthruput-rv32.ld
            -C link-arg=--no-check-sections
            -C link-arg=-static
            -C link-arg=--no-dynamic-linker
            -C link-arg=--gc-sections
            -C panic=abort
            -C relocation-model=static
            -Z trap-unreachable=false
            --deny warnings
        with:
          registry-name: crates-io
          packages: ${{ env.INTERFACE_PACKAGES }}
          # The implementation components exact-pin their interface crates,
          # and the permit and issuer interfaces exact-pin thruput-erc20-if — all
          # workspace path deps here, so their offline packaging needs those
          # pre-vendored (after the primaries they depend on).
          vendor-workspace-deps:
            thruput-storage-cost
            thruput-event
            thruput-exn
            thruput-contract-util
            thruput-contract-spec
            thruput-sys
            thruput-macros
            thruput-domain-separator
            thruput-native-exec
            thruput-u256
            thruput-rv32-runtime
            thruput-sdk
            thruput-erc20-if
            thruput-erc20-metadata-if
            thruput-erc20-controls-if
            thruput-erc165-if
            thruput-signed-op-if
            thruput-access-control-if
          # `entrypoints` selects the rv32-only #![no_main] spec-carrier bin, which
          # cannot link on the host (no `main`); it is verified by the rv32 step below.
          cargo-hack-feature-options: --feature-powerset -F dev --ignore-unknown-features --skip entrypoints
          cargo-hack-rv32-feature-options: --feature-powerset --skip std --skip mock --skip dev
          cargo-hack-rv32-packages: thruput-rv32-runtime ${{ env.INTERFACE_PACKAGES }}

      # Every group's check runs before any tag step, so nothing is tagged
      # until all of them pass. `v<version>` must be free or already on
      # HEAD: a new commit needs a workspace version bump.
      - name: Check workspace release
        id: check-workspace
        uses: thruputchain/actions/crates-io-publish@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          mode: check
          packages: ${{ env.PRIMARY_PACKAGES }} ${{ env.INTERFACE_DEPENDENT_PACKAGES }}
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      # Each interface crate's `<crate>-v<version>` tag legitimately
      # pre-exists at an older commit whenever a release doesn't bump the
      # crate. skip-if-published then reports release=false, which skips the
      # crate's tag and publish steps below, once crates.io shows that
      # version published from the tag; otherwise the check fails (a
      # previous run died between tag push and publish: re-run from the
      # tagged commit, or delete the stale tag).
      - name: Check thruput-erc20-if release
        id: check-erc20-if
        uses: thruputchain/actions/crates-io-publish@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          mode: check
          packages: thruput-erc20-if
          tag-prefix: 'thruput-erc20-if-v'
          on-existing-tag: 'skip-if-published'
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      - name: Check thruput-erc20-metadata-if release
        id: check-erc20-metadata-if
        uses: thruputchain/actions/crates-io-publish@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          mode: check
          packages: thruput-erc20-metadata-if
          tag-prefix: 'thruput-erc20-metadata-if-v'
          on-existing-tag: 'skip-if-published'
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      - name: Check thruput-erc20-controls-if release
        id: check-erc20-controls-if
        uses: thruputchain/actions/crates-io-publish@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          mode: check
          packages: thruput-erc20-controls-if
          tag-prefix: 'thruput-erc20-controls-if-v'
          on-existing-tag: 'skip-if-published'
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      - name: Check thruput-erc20-pausable-if release
        id: check-erc20-pausable-if
        uses: thruputchain/actions/crates-io-publish@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          mode: check
          packages: thruput-erc20-pausable-if
          tag-prefix: 'thruput-erc20-pausable-if-v'
          on-existing-tag: 'skip-if-published'
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      - name: Check thruput-signed-op-if release
        id: check-signed-op-if
        uses: thruputchain/actions/crates-io-publish@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          mode: check
          packages: thruput-signed-op-if
          tag-prefix: 'thruput-signed-op-if-v'
          on-existing-tag: 'skip-if-published'
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      - name: Check thruput-signed-op release
        id: check-signed-op
        uses: thruputchain/actions/crates-io-publish@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          mode: check
          packages: thruput-signed-op
          tag-prefix: 'thruput-signed-op-v'
          on-existing-tag: 'skip-if-published'
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      - name: Check thruput-erc20-permit-if release
        id: check-erc20-permit-if
        uses: thruputchain/actions/crates-io-publish@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          mode: check
          packages: thruput-erc20-permit-if
          tag-prefix: 'thruput-erc20-permit-if-v'
          on-existing-tag: 'skip-if-published'
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      - name: Check thruput-erc165-if release
        id: check-erc165-if
        uses: thruputchain/actions/crates-io-publish@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          mode: check
          packages: thruput-erc165-if
          tag-prefix: 'thruput-erc165-if-v'
          on-existing-tag: 'skip-if-published'
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      - name: Check thruput-erc721-if release
        id: check-erc721-if
        uses: thruputchain/actions/crates-io-publish@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          mode: check
          packages: thruput-erc721-if
          tag-prefix: 'thruput-erc721-if-v'
          on-existing-tag: 'skip-if-published'
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      - name: Check thruput-sep41 release
        id: check-sep41
        uses: thruputchain/actions/crates-io-publish@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          mode: check
          packages: thruput-sep41
          tag-prefix: 'thruput-sep41-v'
          on-existing-tag: 'skip-if-published'
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      - name: Check thruput-access-control-if release
        id: check-access-control-if
        uses: thruputchain/actions/crates-io-publish@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          mode: check
          packages: thruput-access-control-if
          tag-prefix: 'thruput-access-control-if-v'
          on-existing-tag: 'skip-if-published'
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      - name: Check thruput-access-control release
        id: check-access-control
        uses: thruputchain/actions/crates-io-publish@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          mode: check
          packages: thruput-access-control
          tag-prefix: 'thruput-access-control-v'
          on-existing-tag: 'skip-if-published'
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      # Tags HEAD as `v<version>` and pushes. Re-running on the release
      # commit passes (the push is a no-op).
      - name: Tag workspace release
        if: ${{ inputs.dry_run == false && steps.check-workspace.outputs.release == 'true' }}
        id: tag-workspace
        uses: thruputchain/actions/cargo-release-tag@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          packages: ${{ env.PRIMARY_PACKAGES }} ${{ env.INTERFACE_DEPENDENT_PACKAGES }}
          github-token: ${{ github.token }}

      - name: Tag thruput-erc20-if
        if: ${{ inputs.dry_run == false && steps.check-erc20-if.outputs.release == 'true' }}
        id: tag-erc20-if
        uses: thruputchain/actions/cargo-release-tag@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          packages: thruput-erc20-if
          tag-prefix: 'thruput-erc20-if-v'
          github-token: ${{ github.token }}

      - name: Tag thruput-erc20-metadata-if
        if: ${{ inputs.dry_run == false && steps.check-erc20-metadata-if.outputs.release == 'true' }}
        id: tag-erc20-metadata-if
        uses: thruputchain/actions/cargo-release-tag@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          packages: thruput-erc20-metadata-if
          tag-prefix: 'thruput-erc20-metadata-if-v'
          github-token: ${{ github.token }}

      - name: Tag thruput-erc20-controls-if
        if: ${{ inputs.dry_run == false && steps.check-erc20-controls-if.outputs.release == 'true' }}
        id: tag-erc20-controls-if
        uses: thruputchain/actions/cargo-release-tag@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          packages: thruput-erc20-controls-if
          tag-prefix: 'thruput-erc20-controls-if-v'
          github-token: ${{ github.token }}

      - name: Tag thruput-erc20-pausable-if
        if: ${{ inputs.dry_run == false && steps.check-erc20-pausable-if.outputs.release == 'true' }}
        id: tag-erc20-pausable-if
        uses: thruputchain/actions/cargo-release-tag@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          packages: thruput-erc20-pausable-if
          tag-prefix: 'thruput-erc20-pausable-if-v'
          github-token: ${{ github.token }}

      - name: Tag thruput-signed-op-if
        if: ${{ inputs.dry_run == false && steps.check-signed-op-if.outputs.release == 'true' }}
        id: tag-signed-op-if
        uses: thruputchain/actions/cargo-release-tag@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          packages: thruput-signed-op-if
          tag-prefix: 'thruput-signed-op-if-v'
          github-token: ${{ github.token }}

      - name: Tag thruput-signed-op
        if: ${{ inputs.dry_run == false && steps.check-signed-op.outputs.release == 'true' }}
        id: tag-signed-op
        uses: thruputchain/actions/cargo-release-tag@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          packages: thruput-signed-op
          tag-prefix: 'thruput-signed-op-v'
          github-token: ${{ github.token }}

      - name: Tag thruput-erc20-permit-if
        if: ${{ inputs.dry_run == false && steps.check-erc20-permit-if.outputs.release == 'true' }}
        id: tag-erc20-permit-if
        uses: thruputchain/actions/cargo-release-tag@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          packages: thruput-erc20-permit-if
          tag-prefix: 'thruput-erc20-permit-if-v'
          github-token: ${{ github.token }}

      - name: Tag thruput-erc165-if
        if: ${{ inputs.dry_run == false && steps.check-erc165-if.outputs.release == 'true' }}
        id: tag-erc165-if
        uses: thruputchain/actions/cargo-release-tag@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          packages: thruput-erc165-if
          tag-prefix: 'thruput-erc165-if-v'
          github-token: ${{ github.token }}

      - name: Tag thruput-erc721-if
        if: ${{ inputs.dry_run == false && steps.check-erc721-if.outputs.release == 'true' }}
        id: tag-erc721-if
        uses: thruputchain/actions/cargo-release-tag@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          packages: thruput-erc721-if
          tag-prefix: 'thruput-erc721-if-v'
          github-token: ${{ github.token }}

      - name: Tag thruput-sep41
        if: ${{ inputs.dry_run == false && steps.check-sep41.outputs.release == 'true' }}
        id: tag-sep41
        uses: thruputchain/actions/cargo-release-tag@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          packages: thruput-sep41
          tag-prefix: 'thruput-sep41-v'
          github-token: ${{ github.token }}

      - name: Tag thruput-access-control-if
        if: ${{ inputs.dry_run == false && steps.check-access-control-if.outputs.release == 'true' }}
        id: tag-access-control-if
        uses: thruputchain/actions/cargo-release-tag@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          packages: thruput-access-control-if
          tag-prefix: 'thruput-access-control-if-v'
          github-token: ${{ github.token }}

      - name: Tag thruput-access-control
        if: ${{ inputs.dry_run == false && steps.check-access-control.outputs.release == 'true' }}
        id: tag-access-control
        uses: thruputchain/actions/cargo-release-tag@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          packages: thruput-access-control
          tag-prefix: 'thruput-access-control-v'
          github-token: ${{ github.token }}

