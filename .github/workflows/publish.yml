name: Release SDK and related primary packages

on:
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  PUBLISH_PACKAGES: >-
    # Note: Changes here should usually be mirrored in
    #   publish_standard_interfaces.yml
    groundhog-event
    groundhog-storage-cost
    groundhog-contract-util
    groundhog-contract-spec
    groundhog-sys
    groundhog-domain-separator
    groundhog-native-exec
    groundhog-macros
    groundhog-test-vectors
    groundhog-rv32-runtime
    groundhog-wasm-runtime
    sdk
    groundhog-spec-tool

jobs:
  publish:
    permissions:
      contents: write
    runs-on: hog1

    steps:
      - name: Clean up .gitconfig
        run: |
            echo "Cleaning up .gitconfig"
            rm -f /home/hogci/.gitconfig
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.ACTIONS_KEY }}
            ${{ secrets.SDK_TO_ITC }}
            ${{ secrets.SDK_TO_SELF }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure git to use SSH
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Checkout actions repository
        uses: actions/checkout@v6
        with:
          repository: groundhogchain/actions
          path: actions
          ref: main

      - name: publish dry run
        uses: ./actions/cargo-publish-dry-run
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}
          # groundhog-domain-separator's backends are additive, so most combinations
          # are fine. The exception is a bare `syscall`: it forwards to
          # `groundhog-xdr/syscalls`, which has no dispatch path on the host.
          # `syscall-mock` needs no skip -- it supplies that dispatch itself.
          cargo-hack-feature-options: --feature-powerset -F std --ignore-unknown-features --skip syscall
          # On guests, reaching groundhog-domain-separator's `sha2` backend is a hard
          # error, so skip it and `default` (which pulls it in via `std`). Its
          # `syscall-mock` is host-only, like sdk's `mock`. `-F syscall` keeps the
          # guest backend compiled somewhere. All no-ops for the other packages here.
          cargo-hack-wasm32-feature-options: --feature-powerset --skip std --skip mock --skip dev --skip sha2 --skip default --skip syscall-mock -F syscall --ignore-unknown-features
          cargo-hack-wasm32-packages: groundhog-wasm-runtime sdk groundhog-domain-separator
          cargo-hack-rv32-feature-options: --feature-powerset --skip std --skip mock --skip dev --skip sha2 --skip default --skip syscall-mock -F syscall --ignore-unknown-features
          cargo-hack-rv32-packages: groundhog-rv32-runtime sdk groundhog-domain-separator
          arch-only-packages: groundhog-wasm-runtime groundhog-rv32-runtime

      - name: tag commit with version
        id: publish-tag
        uses: ./actions/cargo-version-tag
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}
      
      - name: push tag
        run: |
          git remote set-url origin https://${{ github.actor }}:${{ github.token }}@github.com/${{ github.repository }}.git
          git push origin ${{ steps.publish-tag.outputs.tag }}
          git remote set-url origin git@github.com:${{ github.repository }}.git
          
      - name: publish
        uses: ./actions/cargo-publish
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}
          git-tag: ${{ steps.publish-tag.outputs.tag }}
          registry-name: groundhog
          registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
          # Verification is done in the dry-run job above; the host verify-build
          # here would fail for the architecture-only runtime crates.
          no-verify: 'true'
          # These crates only build for their non-host target, so the publish
          # action's host doc-validation must skip them (covered by the per-target
          # verify in the dry-run job).
          arch-only-packages: groundhog-wasm-runtime groundhog-rv32-runtime

      # Build and upload rustdoc to groundhog.dev/docs, after the crates publish.
      # HEAD is the freshly-tagged commit, so expected-tag validates cleanly.
      # arch-only crates can't build docs on the host, so they're skipped (same
      # as the publish step above).
      - name: publish docs
        uses: ./actions/cargo-doc
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}
          arch-only-packages: groundhog-wasm-runtime groundhog-rv32-runtime
          version: ${{ steps.publish-tag.outputs.version }}
          registry-name: groundhog
          registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
          toolchain: nightly-2026-01-30
          force: 'true'
          expected-tag: ${{ steps.publish-tag.outputs.tag }}
