name: Publish standard interface crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (no tag/publish)'
        required: false
        type: boolean
        default: false

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  publish:
    permissions:
      contents: write
    runs-on: hog1
    strategy:
      fail-fast: false
      matrix:
        crate:
          - groundhog-erc20-if
          - groundhog-erc1271-if
          - groundhog-erc20-metadata-if

    steps:
      - name: Clean up .gitconfig
        run: |
          echo "Cleaning up .gitconfig"
          rm -f /home/hogci/.gitconfig

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.ACTIONS_KEY }}
            ${{ secrets.SDK_TO_ITC }}
            ${{ secrets.SDK_TO_SELF }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure git to use SSH
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Checkout actions repository
        uses: actions/checkout@v6
        with:
          repository: groundhogchain/actions
          path: actions
          ref: main

      - name: Publish dry run
        uses: ./actions/cargo-publish-dry-run
        env:
          # The workspace no longer carries rv32 target rustflags (the single
          # rv32 config lives in example-contracts/.cargo/config.toml; see
          # docs/superpowers/specs/2026-07-09-rv32-build-config-ci-design.md).
          # The rv32-only spec-carrier bin built by the rv32 powerset below
          # only needs to LINK, so it gets the minimal link flags here. NOTE:
          # cargo JOINS env target-rustflags with config-defined ones (measured
          # on 1.95.0-nightly), so this works only because no config discovered
          # from the workspace root defines rv32 rustflags — re-adding a root
          # stanza would duplicate -T fatally. No immediate-abort here: this
          # build uses the prebuilt core (no build-std).
          CARGO_TARGET_RISCV32IM_UNKNOWN_NONE_ELF_RUSTFLAGS: >-
            -C link-arg=-Tgroundhog-rv32.ld
            -C link-arg=--no-check-sections
            -C link-arg=-static
            -C link-arg=--no-dynamic-linker
            -C link-arg=--gc-sections
            -C panic=abort
            -C relocation-model=static
            -Z trap-unreachable=false
            --deny warnings
        with:
          packages: ${{ matrix.crate }}
          vendor-workspace-deps:
            groundhog-storage-cost
            groundhog-event
            groundhog-contract-util
            groundhog-contract-spec
            groundhog-sys
            groundhog-domain-separator
            groundhog-native-exec
            groundhog-macros
            groundhog-u256
            groundhog-rv32-runtime
            sdk
          # `entrypoints` selects the rv32-only #![no_main] spec-carrier bin, which
          # cannot link on the host (no `main`); it is verified by the rv32 step below.
          cargo-hack-feature-options: --feature-powerset -F dev --ignore-unknown-features --skip entrypoints
          cargo-hack-rv32-feature-options: --feature-powerset --skip std --skip mock --skip dev
          cargo-hack-rv32-packages: groundhog-rv32-runtime ${{ matrix.crate }}

      - name: Tag commit with version
        if: ${{ inputs.dry_run == false }}
        id: publish-tag
        uses: ./actions/cargo-version-tag
        with:
          packages: ${{ matrix.crate }}
          tag-prefix: '${{ matrix.crate }}-v'
          fail-if-exists: 'false'

      - name: Push tag
        if: ${{ inputs.dry_run == false }}
        run: |
          TAG="${{ steps.publish-tag.outputs.tag }}"
          git remote set-url origin https://${{ github.actor }}:${{ github.token }}@github.com/${{ github.repository }}.git
          git push origin "$TAG" 2>&1 || echo "Tag $TAG already exists on remote, skipping"
          git remote set-url origin git@github.com:${{ github.repository }}.git

      - name: Publish
        if: ${{ inputs.dry_run == false }}
        uses: ./actions/cargo-publish
        with:
          packages: ${{ matrix.crate }}
          git-tag: ${{ steps.publish-tag.outputs.tag }}
          tag-prefix: '${{ matrix.crate }}-v'
          registry-name: groundhog
          registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
          # Verification is done by the dry-run step above; the publish-time
          # verify build runs with --all-features, which enables `entrypoints`
          # and tries to link the rv32-only spec-carrier bin on the host.
          no-verify: 'true'

      # Build and upload rustdoc to groundhog.dev/docs, after the crate
      # publishes (same as publish.yml). HEAD is the freshly-tagged commit, so
      # expected-tag validates cleanly. The doc build enables --all-features
      # (incl. `entrypoints`), which is fine on the host: rustdoc doesn't link,
      # and cargo skips the spec-carrier bin since it shares the lib's name.
      - name: Publish docs
        if: ${{ inputs.dry_run == false }}
        uses: ./actions/cargo-doc
        with:
          packages: ${{ matrix.crate }}
          version: ${{ steps.publish-tag.outputs.version }}
          registry-name: groundhog
          registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
          toolchain: nightly-2026-07-01
          force: 'true'
          expected-tag: ${{ steps.publish-tag.outputs.tag }}
