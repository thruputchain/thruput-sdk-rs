name: SDK CI

on:
  push:
    branches: [ "main" ]  
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Clean up .gitconfig
      run: |
        echo "Cleaning up .gitconfig"
        rm -f /home/hogci/.gitconfig
    - uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: |
          ${{ secrets.HOGD_ACCESS_KEY }}
          ${{ secrets.SDK_TO_PROTOCOL_RS }}
          ${{ secrets.SDK_TO_BCS_KEY }}
          ${{ secrets.SDK_TO_ITC }}
          ${{ secrets.SDK_TO_PROTOCOL_KEY }}
          ${{ secrets.SDK_TO_BCS_CPP_KEY }}
          ${{ secrets.SDK_TO_XDR_COMMON_KEY }}
          ${{ secrets.SDK_TO_XDRS_KEY }}
          ${{ secrets.SDK_TO_SERDE_ARRAYS_KEY }}
          ${{ secrets.SDK_TO_CHUCKD_KEY }}
          ${{ secrets.SDK_TO_PROTOCOL_GO_KEY }}
          ${{ secrets.SDK_TO_METRICS_HISTORY }}
          ${{ secrets.SDK_TO_GROUNDHOG_GO}}
          ${{ secrets.SDK_TO_LIBGO }}
  
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup
    - name: check
      run: CARGO_NET_GIT_FETCH_WITH_CLI=true ./scripts/ci.sh
    - name: log metrics
      if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      # Hogd runs metrics in a separate workflow because the hogd metrics are nontrivially
      # time-consuming to run.  We can swap the SDK metrics to that style if we add long-to-compute
      # stats to track; for now, however, we are just tracking contract sizes,
      # which are already built in the ci workflow, so the CI overhead of logging the metrics is minimal.
      run: ./scripts/metrics.sh

