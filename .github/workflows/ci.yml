name: SDK CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token

jobs:
  dependency-policy:
    name: Dependency policy (${{ matrix.check }})
    runs-on: namespace-profile-hogd-linux-2604
    strategy:
      fail-fast: false
      matrix:
        check:
          - advisories
          - licenses
          - bans
          - sources
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        env:
          # 1.85.0 is the Rust already baked into the pinned cargo-deny-action
          # image (FROM rust:1.85.0-alpine3.20). Setting it stops rustup from
          # honouring rust-toolchain.toml and pulling other things just to run
          # `cargo metadata`.
          RUSTUP_TOOLCHAIN: "1.85.0"
        with:
          arguments: --all-features --locked
          command: check ${{ matrix.check }}

  # Lints the workflow files themselves. actionlint covers correctness
  # (schema, expression types, cron syntax) and runs shellcheck over `run:`
  # blocks plus pyflakes over inline Python. zizmor covers security posture.
  workflow-lint:
    name: Workflow lint
    runs-on: namespace-profile-hogd-linux-2604
    permissions:
      contents: read
    env:
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: "" # we don't need registry access here
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      ZIZMOR_VERSION: "1.30.1"
      # zizmor publishes no checksum file; this is the hash of the v1.30.1
      # linux-gnu tarball as first fetched. It pins us against later
      # tampering with that asset, but is trust-on-first-use, not provenance.
      ZIZMOR_SHA256: "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a"
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      # actionlint shells out to these
      - name: Install shellcheck and pyflakes
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            # A broken third-party list in the runner image must not fail the
            # whole update; the version checks below are the real guard.
            sudo apt-get update || true
            sudo apt-get install -y shellcheck python3-pyflakes
          fi
          shellcheck --version | head -2

      - name: Install actionlint and zizmor
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          bin="$HOME/.local/bin"
          mkdir -p "$bin"

          curl -fsSL -o "$tmp/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/actionlint.tar.gz" -C "$tmp" actionlint

          curl -fsSL -o "$tmp/zizmor.tar.gz" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  $tmp/zizmor.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/zizmor.tar.gz" -C "$tmp" zizmor

          install -m755 "$tmp/actionlint" "$tmp/zizmor" "$bin/"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/actionlint" --version
          "$bin/zizmor" --version

      # Covers correctness (schema, expression types, cron syntax). Runs
      # shellcheck and pyflakes over inline code.
      - name: actionlint
        run: |
          set -euo pipefail
          pyflakes_bin="$(command -v pyflakes || command -v pyflakes3 || true)"
          if [ -n "$pyflakes_bin" ]; then
            actionlint -color -pyflakes "$pyflakes_bin"
          else
            echo "::warning::pyflakes not found; inline Python will not be checked"
            actionlint -color
          fi

      # Blocking. GH_TOKEN lets zizmor run impostor-commit and
      # known-vulnerable-actions.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .github/workflows/ .github/actions/

      # Advisory only. The pedantic persona adds stale-action-refs and
      # ref-version-mismatch, which flag SHA pins that no longer point at a tag
      # and version comments that disagree with the pinned SHA. Not a reason to
      # block a PR, so failures are reported and ignored.
      - name: zizmor (pedantic, advisory)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress --persona=pedantic .github/workflows/ .github/actions/

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # rv32 example builds + spec-artifact checks + embedded-string
          # scan + native example tests.
          - name: examples-test
            submodules: false
            skips: >-
              SKIP_SDK_TESTS=1 SKIP_DOCS=1 SKIP_BOTTLE_EXAMPLES=1
              SKIP_DOMAIN_COLLISION=1 SKIP_DUP_ENTRYPOINT=1
              SKIP_REGISTRY_STRIPPED=1
              SKIP_INTEGRATION=1 SKIP_LOGGING=1
              SKIP_QUALITY=1 SKIP_MACROS_GUEST=1 SKIP_SDK_RV32=1
          # Bottle tests + domain-collision + registry-stripped. The bottle
          # tests build their own rv32 artifact pair per contract, so this
          # job needs no example build of its own.
          - name: examples-bottle
            submodules: false
            skips: >-
              SKIP_SDK_TESTS=1 SKIP_DOCS=1 SKIP_RV32_EXAMPLES=1
              SKIP_TEST_EXAMPLES=1 SKIP_INTEGRATION=1 SKIP_LOGGING=1
              SKIP_QUALITY=1 SKIP_MACROS_GUEST=1 SKIP_SDK_RV32=1
          # Guest build of sdk + docs + full integration block + logging
          # build + lint/fmt/xxx. Carries the rv32 sdk build for the matrix:
          # the examples jobs compile sdk for rv32 through their contract
          # sweeps anyway, so running it there too would just repeat the work.
          # Only entry needing the integration_test/contracts submodule
          # (hence the SSH keys).
          - name: checks
            submodules: true
            skips: >-
              SKIP_SDK_TESTS=1 SKIP_EXAMPLES=1
    runs-on: namespace-profile-hogd-linux-2604
    env:
      # Every matrix entry sets SKIP_SDK_TESTS=1: SDK unit tests run in the
      # separate `sdk-tests` job (sdk_tests.yml).
      # Share one FFI download cache across every groundhog-sys build instance
      # (and across runs, via the Namespace cache below). Without this the cache
      # defaults to each instance's OUT_DIR, so every workspace/feature variant
      # re-downloads the prebuilt FFI tarball.
      HOGD_DOWNLOAD_CACHE_DIR: ${{ github.workspace }}/.hogd-ffi-cache
      # Namespace-cached CLI install root: ci.sh installs the pinned groundhog
      # CLI here once per version bump instead of recompiling it every run.
      GROUNDHOG_CLI_ROOT: ${{ github.workspace }}/.groundhog-cli

    steps:
      # Loaded before checkout so the recursive submodule fetch (which uses
      # SSH remotes) can authenticate. Only the entry that initializes
      # submodules needs it.
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        if: matrix.submodules
        with:
          ssh-private-key: |
            ${{ secrets.HOGD_ACCESS_KEY }}
            ${{ secrets.SDK_TO_PROTOCOL_RS }}
            ${{ secrets.SDK_TO_BCS_KEY }}
            ${{ secrets.SDK_TO_ITC }}
            ${{ secrets.SDK_TO_PROTOCOL_KEY }}
            ${{ secrets.SDK_TO_BCS_CPP_KEY }}
            ${{ secrets.SDK_TO_XDR_COMMON_KEY }}
            ${{ secrets.SDK_TO_XDRS_KEY }}
            ${{ secrets.SDK_TO_SERDE_ARRAYS_KEY }}
            ${{ secrets.SDK_TO_CHUCKD_KEY }}
            ${{ secrets.SDK_TO_PROTOCOL_GO_KEY }}
            ${{ secrets.SDK_TO_METRICS_HISTORY }}
            ${{ secrets.SDK_TO_GROUNDHOG_GO}}
            ${{ secrets.SDK_TO_LIBGO }}
            ${{ secrets.SDK_TO_SELF }}
            ${{ secrets.SDK_TO_ABORT_RS }}
            ${{ secrets.SDK_TO_HOGX_KEY }}
            ${{ secrets.SDK_TO_SCP_KEY }}

      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - name: Initialize submodules
        if: matrix.submodules
        run: git submodule update --init --recursive

      # NB: deliberately NOT caching ./target. The Namespace cross-invocation
      # cache is a network/overlay-backed mount; cargo's many-small-file churn
      # in target/ stalls on it (the runner sits at ~0-5% CPU on 32 cores —
      # I/O-wait, not compute). Building target/ on the runner's local disk and
      # eating a cold compile is faster than an I/O-starved "incremental" build.
      # We still cache the dependency *sources* (read-mostly, few large files)
      # so we don't re-fetch every crate from the registry, plus the one-shot
      # FFI download and the compiled groundhog CLI.
      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/.hogd-ffi-cache
            ${{ github.workspace }}/.groundhog-cli

      # dev.sh hard-requires ripgrep (spec checks + lint use ripgrep-specific
      # features like --ignore-file); the runner image doesn't ship it.
      - name: Install ripgrep
        run: |
          if ! command -v rg >/dev/null; then
            # A broken third-party list in the runner image (google-chrome
            # has served a mismatched index) must not fail the whole update:
            # ripgrep comes from an Ubuntu index, and `rg --version` below is
            # the real guard.
            sudo apt-get update || true
            sudo apt-get install -y ripgrep
          fi
          rg --version

      - name: Run CI
        run: env ${{ matrix.skips }} ./scripts/ci.sh

  # Main pushes only, off the PR critical path. Self-contained: rebuilds the
  # rv32 example artifacts and the full integration block (metrics.sh's
  # sdk_perf_gas re-runs example AND integration bottle tests, and the codesize
  # metrics read the rv32 release ELFs and target/groundhog).
  metrics:
    if: github.ref == 'refs/heads/main'
    runs-on: namespace-profile-hogd-linux-2604
    env:
      HOGD_DOWNLOAD_CACHE_DIR: ${{ github.workspace }}/.hogd-ffi-cache
      GROUNDHOG_CLI_ROOT: ${{ github.workspace }}/.groundhog-cli

    steps:
      # Needed both for the submodule fetch and for metrics.sh's push to
      # metrics_history (SDK_TO_METRICS_HISTORY).
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.HOGD_ACCESS_KEY }}
            ${{ secrets.SDK_TO_PROTOCOL_RS }}
            ${{ secrets.SDK_TO_BCS_KEY }}
            ${{ secrets.SDK_TO_ITC }}
            ${{ secrets.SDK_TO_PROTOCOL_KEY }}
            ${{ secrets.SDK_TO_BCS_CPP_KEY }}
            ${{ secrets.SDK_TO_XDR_COMMON_KEY }}
            ${{ secrets.SDK_TO_XDRS_KEY }}
            ${{ secrets.SDK_TO_SERDE_ARRAYS_KEY }}
            ${{ secrets.SDK_TO_CHUCKD_KEY }}
            ${{ secrets.SDK_TO_PROTOCOL_GO_KEY }}
            ${{ secrets.SDK_TO_METRICS_HISTORY }}
            ${{ secrets.SDK_TO_GROUNDHOG_GO}}
            ${{ secrets.SDK_TO_LIBGO }}
            ${{ secrets.SDK_TO_SELF }}
            ${{ secrets.SDK_TO_ABORT_RS }}
            ${{ secrets.SDK_TO_HOGX_KEY }}
            ${{ secrets.SDK_TO_SCP_KEY }}

      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/.hogd-ffi-cache
            ${{ github.workspace }}/.groundhog-cli

      - name: Install ripgrep
        run: |
          if ! command -v rg >/dev/null; then
            # A broken third-party list in the runner image (google-chrome
            # has served a mismatched index) must not fail the whole update:
            # ripgrep comes from an Ubuntu index, and `rg --version` below is
            # the real guard.
            sudo apt-get update || true
            sudo apt-get install -y ripgrep
          fi
          rg --version

      - name: Build metrics inputs
        run: >-
          env SKIP_SDK_TESTS=1 SKIP_DOCS=1 SKIP_TEST_EXAMPLES=1
          SKIP_BOTTLE_EXAMPLES=1 SKIP_DOMAIN_COLLISION=1
          SKIP_DUP_ENTRYPOINT=1
          SKIP_REGISTRY_STRIPPED=1 SKIP_LOGGING=1
          SKIP_QUALITY=1 ./scripts/ci.sh

      - name: Log metrics
        env:
          # Detached HEAD on CI checkout would make metrics.sh derive "HEAD";
          # pass the real branch (matches the old hog `git_branch`).
          GIT_BRANCH: ${{ github.ref_name }}
        run: |
          # ci.sh's PATH export doesn't survive into this step; re-expose the
          # cached CLI in case bottle re-runs ever shell out to it.
          export PATH="${GROUNDHOG_CLI_ROOT}/bin:${PATH}"
          ./scripts/metrics.sh
