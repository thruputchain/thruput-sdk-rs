name: SDK CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:

# A newer push to a pull request supersedes the running checks. Runs on main
# are never cancelled: each one records metrics for its commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Share one FFI download cache across every thruput-sys build instance
  # (and across runs, via the Namespace cache). Without this the cache
  # defaults to each instance's OUT_DIR, so every workspace/feature variant
  # re-downloads the prebuilt FFI tarball.
  HOGD_DOWNLOAD_CACHE_DIR: ${{ github.workspace }}/.hogd-ffi-cache
  # Namespace-cached CLI install root: `gnaw setup` installs the pinned
  # Thruput CLI here once per version bump instead of recompiling it every run.
  THRUPUT_CLI_ROOT: ${{ github.workspace }}/.thruput-cli

permissions:
  contents: read

# Each job runs one gnaw group; `cargo gnaw list --groups` shows what they
# contain. --keep-going reports every failure in a job, not just the first.
jobs:
  dependency-policy:
    permissions:
      contents: read
    # No registry credentials: deny.toml admits crates.io only.
    uses: thruputchain/actions/.github/workflows/rust-dependency-policy.yml@6693fac8133585728ad3a4ca14e3441073b6def8
    with:
      runs-on: namespace-profile-hogd-linux-2604

  workflow-lint:
    permissions:
      contents: read
    uses: thruputchain/actions/.github/workflows/workflow-lint.yml@f1b1a2cb8c69bab5f24f5f9976d50b6a9ab548fc
    with:
      lint-app-id: ${{ vars.PROTOCOL_SYNCHRONIZER_APP_ID }}
      runs-on: ubuntu-24.04
    secrets:
      lint-app-private-key: ${{ secrets.PROTOCOL_SYNCHRONIZER_SECRET_KEY }}

  # Formatting, annotations, version pins, and SDK clippy
  quick:
    needs: dependency-policy # check deps before building anything
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: namespace-profile-hogd-linux-2604
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - uses: ./.github/actions/gnaw-setup

      - name: Run quick checks
        run: gnaw run quick --strict --keep-going

  # SDK tests, guest builds of the SDK and macro fixtures, and documentation.
  sdk:
    needs: dependency-policy
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: namespace-profile-hogd-linux-2604
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - uses: ./.github/actions/gnaw-setup

      - name: Run SDK checks
        run: gnaw run sdk --strict --keep-going

  # rv32 fixture builds and their artifact and spec checks, fixture tests,
  # negative fixtures, and fixture clippy.
  fixtures:
    needs: dependency-policy
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: namespace-profile-hogd-linux-2604
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      # Covers a source-pinned Thruput CLI (scripts/thruput-cli-version.sh).
      - name: Authenticate pinned CLI source
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SDK_TO_GROUNDHOG_RPC }}

      - uses: ./.github/actions/gnaw-setup
        with:
          thruput-cli: "true"

      - name: Run fixture checks
        run: gnaw run fixtures --strict --keep-going

      # Executable bits do not survive an artifact upload, and
      # scripts/metrics/sdk_codesizes_rv32.sh requires them, hence the tarball.
      - name: Pack rv32 artifacts for metrics
        if: github.ref == 'refs/heads/main'
        run: |
          find target/riscv32im-unknown-none-elf/release -maxdepth 1 -type f -print0 |
            tar --null -czf rv32-fixtures.tgz -T - target/thruput \
              target/gnaw/rv32-packages/fixtures.txt

      - name: Upload rv32 artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rv32-fixtures
          path: rv32-fixtures.tgz
          retention-days: 1
          if-no-files-found: error

  # The integration contracts: the only job that needs the submodule.
  integration:
    needs: dependency-policy
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: namespace-profile-hogd-linux-2604
    steps:
      # Loaded before checkout so the submodule fetch (an SSH remote) can
      # authenticate. The submodule has no submodules of its own. The CLI
      # source key covers a source-pinned Thruput CLI.
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.SDK_TO_GROUNDHOG_RPC }}
            ${{ secrets.SDK_TO_ITC }}

      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - uses: ./.github/actions/gnaw-setup
        with:
          thruput-cli: "true"

      - name: Run integration checks
        run: gnaw run integration --strict --keep-going

      - name: Pack rv32 artifacts for metrics
        if: github.ref == 'refs/heads/main'
        run: |
          find target/riscv32im-unknown-none-elf/release -maxdepth 1 -type f -print0 |
            tar --null -czf rv32-integration.tgz -T - target/thruput \
              target/gnaw/rv32-packages/integration.txt

      - name: Upload rv32 artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rv32-integration
          path: rv32-integration.tgz
          retention-days: 1
          if-no-files-found: error

  # Main only. Builds nothing: records codesize metrics from the rv32
  # artifacts the fixtures and integration jobs built.
  metrics:
    needs: [fixtures, integration]
    if: github.ref == 'refs/heads/main'
    runs-on: namespace-profile-hogd-linux-2604
    steps:
      # metrics.sh pushes to metrics_history.
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.SDK_TO_METRICS_HISTORY }}

      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8

      # Each tarball holds the build task's package list, which tells the
      # metric scripts which artifacts to read.
      - name: Download rv32 artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rv32-*
          merge-multiple: true

      - name: Unpack rv32 artifacts
        run: |
          tar -xzf rv32-fixtures.tgz
          tar -xzf rv32-integration.tgz

      - name: Log metrics
        env:
          # Detached HEAD on CI checkout would make metrics.sh derive "HEAD";
          # pass the real branch.
          GIT_BRANCH: ${{ github.ref_name }}
        run: ./scripts/metrics.sh
