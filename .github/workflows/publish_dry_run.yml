name: Release dry run checks

on:
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:

 publish:
    runs-on: hog1

    steps:
      - name: Clean up .gitconfig
        run: |
            echo "Cleaning up .gitconfig"
            rm -f /home/hogci/.gitconfig
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.ACTIONS_KEY }}
            ${{ secrets.SDK_TO_ITC }}
            ${{ secrets.SDK_TO_SELF }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure git to use SSH
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Checkout actions repository
        uses: actions/checkout@v4
        with:
          repository: groundhogchain/actions
          path: actions
          ref: main

      - name: publish dry run
        uses: ./actions/cargo-publish-dry-run
        with:
          packages: groundhog-contract-util groundhog-sys native_exec groundhog-codegen groundhog-macros sdk
          cargo-hack-feature-options: |
            --feature-powerset -F std --ignore-unknown-features
            --feature-powerset --skip std --skip mock --target=wasm32-unknown-unknown
