name: Release dry run checks

on:
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  PUBLISH_PACKAGES: >-
    groundhog-event
    groundhog-storage-cost
    groundhog-contract-util
    groundhog-contract-spec
    groundhog-sys
    groundhog-native-exec
    groundhog-macros
    groundhog-test-vectors
    groundhog-rv32-runtime
    groundhog-wasm-runtime
    sdk
    groundhog-spec-tool

jobs:

 publish:
    runs-on: hog1

    steps:
      - name: Clean up .gitconfig
        run: |
            echo "Cleaning up .gitconfig"
            rm -f /home/hogci/.gitconfig
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.ACTIONS_KEY }}
            ${{ secrets.SDK_TO_ITC }}
            ${{ secrets.SDK_TO_SELF }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure git to use SSH
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Checkout actions repository
        uses: actions/checkout@v6
        with:
          repository: groundhogchain/actions
          path: actions
          ref: main

      - name: publish dry run
        uses: ./actions/cargo-publish-dry-run
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}
          cargo-hack-feature-options: --feature-powerset -F std --ignore-unknown-features
          cargo-hack-wasm32-feature-options: --feature-powerset --skip std --skip mock --skip dev
          cargo-hack-wasm32-packages: groundhog-wasm-runtime sdk
