name: Release dry run checks

on:
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  PUBLISH_PACKAGES: >-
    groundhog-event
    groundhog-storage-cost
    groundhog-contract-util
    groundhog-contract-spec
    groundhog-sys
    groundhog-domain-separator
    groundhog-native-exec
    groundhog-macros
    groundhog-test-vectors
    groundhog-rv32-runtime
    groundhog-wasm-runtime
    sdk
    groundhog-spec-tool

jobs:

 publish:
    runs-on: hog1

    steps:
      - name: Clean up .gitconfig
        run: |
            echo "Cleaning up .gitconfig"
            rm -f /home/hogci/.gitconfig
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.ACTIONS_KEY }}
            ${{ secrets.SDK_TO_ITC }}
            ${{ secrets.SDK_TO_SELF }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure git to use SSH
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Checkout actions repository
        uses: actions/checkout@v6
        with:
          repository: groundhogchain/actions
          path: actions
          ref: main

      - name: publish dry run
        uses: ./actions/cargo-publish-dry-run
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}
          # `syscall` selects groundhog-domain-separator's guest SHA-256 backend,
          # which forwards to `groundhog-xdr/syscalls` (wasm32/riscv32 only) and is
          # mutually exclusive with the `sha2` backend that `-F std` forces on.
          cargo-hack-feature-options: --feature-powerset -F std --ignore-unknown-features --skip syscall
          # groundhog-domain-separator needs exactly one SHA-256 backend: force its
          # guest `syscall` one on and skip the host `sha2` one (and `default`, which
          # pulls in `sha2` via `std`). Both are no-ops for the other packages here.
          cargo-hack-wasm32-feature-options: --feature-powerset --skip std --skip mock --skip dev --skip sha2 --skip default -F syscall --ignore-unknown-features
          cargo-hack-wasm32-packages: groundhog-wasm-runtime sdk groundhog-domain-separator
          cargo-hack-rv32-feature-options: --feature-powerset --skip std --skip mock --skip dev --skip sha2 --skip default -F syscall --ignore-unknown-features
          cargo-hack-rv32-packages: groundhog-rv32-runtime sdk groundhog-domain-separator
          arch-only-packages: groundhog-wasm-runtime groundhog-rv32-runtime
