name: Release dry run checks

on:
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  PUBLISH_PACKAGES: >-
    groundhog-event
    groundhog-storage-cost
    groundhog-contract-util
    groundhog-contract-spec
    groundhog-sys
    groundhog-domain-separator
    groundhog-native-exec
    groundhog-macros
    groundhog-u256
    groundhog-test-vectors
    groundhog-rv32-runtime
    groundhog-wasm-runtime
    sdk
    groundhog-spec-tool

jobs:

 publish:
    runs-on: hog1

    steps:
      - name: Clean up .gitconfig
        run: |
            echo "Cleaning up .gitconfig"
            rm -f /home/hogci/.gitconfig
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.ACTIONS_KEY }}
            ${{ secrets.SDK_TO_ITC }}
            ${{ secrets.SDK_TO_SELF }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure git to use SSH
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Checkout actions repository
        uses: actions/checkout@v6
        with:
          repository: groundhogchain/actions
          path: actions
          ref: main

      - name: publish dry run
        uses: ./actions/cargo-publish-dry-run
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}
          # groundhog-spec-tool exact-pins the standard-interface crates, which
          # are workspace path deps here — `cargo vendor` skips those, so the
          # offline packaging steps need them pre-vendored. Pre-vendoring an
          # interface crate resolves its deps against vendor/ too, so the
          # primaries it depends on come first, in dependency order (same list
          # as publish_standard_interfaces.yml).
          vendor-workspace-deps:
            groundhog-storage-cost
            groundhog-event
            groundhog-contract-util
            groundhog-contract-spec
            groundhog-sys
            groundhog-domain-separator
            groundhog-native-exec
            groundhog-macros
            groundhog-u256
            groundhog-rv32-runtime
            groundhog-wasm-runtime
            sdk
            groundhog-erc20-if
            groundhog-erc1271-if
          # groundhog-domain-separator's backends are additive, so most combinations
          # are fine. The exception is a bare `syscall`: it forwards to
          # `groundhog-xdr/syscalls`, which has no dispatch path on the host.
          # `syscall-mock` needs no skip -- it supplies that dispatch itself.
          cargo-hack-feature-options: --feature-powerset -F std --ignore-unknown-features --skip syscall
          # On guests, reaching groundhog-domain-separator's `sha2` backend is a hard
          # error, so skip it and `default` (which pulls it in via `std`). Its
          # `syscall-mock` is host-only, like sdk's `mock`. `-F syscall` keeps the
          # guest backend compiled somewhere. All no-ops for the other packages here.
          cargo-hack-wasm32-feature-options: --feature-powerset --skip std --skip mock --skip dev --skip sha2 --skip default --skip syscall-mock -F syscall --ignore-unknown-features
          cargo-hack-wasm32-packages: groundhog-wasm-runtime sdk groundhog-domain-separator
          cargo-hack-rv32-feature-options: --feature-powerset --skip std --skip mock --skip dev --skip sha2 --skip default --skip syscall-mock -F syscall --ignore-unknown-features
          cargo-hack-rv32-packages: groundhog-rv32-runtime sdk groundhog-domain-separator
          arch-only-packages: groundhog-wasm-runtime groundhog-rv32-runtime
