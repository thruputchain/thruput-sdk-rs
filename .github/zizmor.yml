# zizmor configuration. https://docs.zizmor.sh/configuration/
#
# `unpinned-uses` default: hash-pinning for every referenced action

rules:
  # Checkout steps that do not set `persist-credentials: false`.
  artipacked:
    ignore:
      - publish.yml

  # Jobs running with default (write) permissions.
  excessive-permissions:
    ignore:
      - ci.yml
      - hogd_build_from_source.yml
      - miri.yml
      - native_exec_tests.yml
      - scaffold_smoke.yml
      - sdk_tests.yml

  # Style: prefers '$/...' over './...' for same-repo composite actions,
  # but that offends actionlint.
  self-repository:
    ignore:
      - publish.yml
      - yank.yml

  # These checks must read referenced repos, and groundhogchain/actions is
  # private.
  impostor-commit:
    disable: true
  stale-action-refs:
    disable: true
  ref-version-mismatch:
    disable: true
