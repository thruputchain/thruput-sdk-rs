[package]
name = "gen"
version = "0.1.0"
edition = "2024"

[dependencies]
darling = "0.20.10"
proc-macro2 = "1.0.92"
quote = "1.0.38"
syn = { version = "2.0.93" , features = [ "full" , "extra-traits", "visit", "printing" ] }
xdrs = { workspace = true, features = ["derive", "alloc"] }
groundhog_xdr = { workspace = true, features = ["std", "xdrs"] }
sha2 = { workspace = true }

[features]
default = [
#    "optsize",
    "calldata_static",
    ]
spec = ["alloc", "groundhog_xdr/spec", "xdrs/repr"]
alloc = []
logging = []
# Inline *_internal methods directly into their exported entrypoints
#   (recommended except when debugging)
optsize = []
# Fetch calldata into a static buffer instead of allocating
#   (recommended unless get_calldata() fails due to static buffer too small)
calldata_static = []
