[package]
name = "gen"
version = "0.1.0"
edition = "2024"

[dependencies]
darling = "0.20.10"
proc-macro2 = "1.0.92"
quote = "1.0.38"
syn = { version = "2.0.93" , features = [ "full" , "extra-traits", "visit", "printing" ] }
xdrs = { workspace = true, features = ["derive", "alloc"] }
groundhog_xdr = { workspace = true, features = ["std", "xdrs"] }
sha2 = { workspace = true }

[features]
default = []
spec = ["alloc", "groundhog_xdr/spec", "xdrs/repr"]
# Allow features that require liballoc
alloc = []
logging = []

# Don't inline `*_internal` methods directly into their exported entrypoints.
# (Not recommended except when decompiling, where method names are inscrutable.)
no_inline_methods = []

# Fetch calldata into a dynamically-allocated buffer instead of a static buffer.
# (Not recommended unless get_calldata() fails due to static buffer too small.)
# Requires feature "alloc"; this is checked at compile time.
dynamic_calldata = []
