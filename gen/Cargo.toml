[package]
name = "gen"
version = "0.1.0"
edition = "2024"

[dependencies]
darling = "0.20.10"
proc-macro2 = "1.0.92"
quote = "1.0.38"
syn = { version = "2.0.93" , features = [ "full" , "extra-traits", "visit", "printing", "fold" ] }
xdrs = { workspace = true, features = ["derive", "alloc"] }
groundhog-xdr = { workspace = true, features = ["std", "xdrs"] }
sha2 = { workspace = true }
contract-util = { workspace = true }

[features]
# Allow features that require liballoc
alloc = []

# Include routines for generating interface specs
spec = ["alloc", "groundhog-xdr/spec", "xdrs/repr"]

# Print traces of method calls to stdout when testing
logging = []

# Track contract calls for giving backtraces on abort
call_tracking = []

# Don't inline `*_internal` methods directly into their exported entrypoints.
# (Not recommended except when decompiling, where method names are inscrutable.)
no_inline_methods = []

[lints.clippy]
collapsible_if = "allow"
