[package]
name = "simple_wallet_old"
description = "A simple wallet app"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
dev = ["erc20/dev", "sdk/dev", "groundhog-erc20-if/dev"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[dependencies]
sdk = { workspace = true, features = ["storage"] }
erc20 = { package = "erc20_low_level", path = "../erc20_low_level/" }
groundhog-erc20-if = { workspace = true }

[dev-dependencies]
simple_wallet_old = { path = ".", features = ["dev"] }
