[package]
name = "sep41"
description = "Reference SEP-41-style token for Groundhog"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev", "groundhog-sep41-if/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "sep41"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
sdk.workspace = true
groundhog-sep41-if.workspace = true

[dev-dependencies]
groundhog-erc20-if = { workspace = true, features = ["dev"] }
sep41 = { path = ".", features = ["dev"] }
