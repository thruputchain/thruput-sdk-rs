[build]
target-dir = "../target" # use SDK target-dir
rustflags = [
    "--deny", "warnings",
    "--check-cfg", "cfg(groundhog_primary_crate, values(any()))",
    ]

[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "panic=immediate-abort",
    "-C", "link-args=-zstack-size=30000",
    "-Z", "unstable-options",
    "--deny", "warnings",
    ]

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1

[profile.bottle_test]
inherits = "release"

