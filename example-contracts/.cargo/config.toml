[build]
target-dir = "../target" # use SDK target-dir
rustflags = [
    "--deny", "warnings",
    ]

# The CANONICAL [target.riscv32im-unknown-none-elf] rustflags.
# integration_test/.cargo/config.toml and negative-contracts/.cargo/config.toml
# carry synced copies (edit all three).
# NEVER add this section to the workspace-root .cargo/config.toml or any
# other config on the same discovery chain: cargo JOINS target-rustflags
# arrays across the chain (cwd upward), and a duplicated
# -Tthruput-rv32.ld redefines the linker script's MEMORY regions
# ("region 'CODE' already defined"). Sibling leaf workspaces like
# integration_test/ are separate chains, so their copy can never join
# with this one.
#
# Flag set matches hogd/built_contracts/.cargo/config.toml (the production
# rv32 build) plus `+relax`, `--icf=all`, and `--relax-gp` (measured wins;
# see docs/superpowers/specs/2026-07-09-rv32-build-config-ci-design.md).
#
# Requires -Zbuild-std=core,alloc on the command line (scripts/dev.sh
# passes it, like hogd's build_risc.sh): panic=immediate-abort and the
# target features below are incompatible with the prebuilt core. A bare
# `cargo build --target riscv32im-unknown-none-elf` from this directory
# will therefore error; build via `scripts/dev.sh build-examples-rv32`.
# ([unstable] build-std must NOT go in this file: it would also apply to
# host `cargo test` runs from this cwd, which fail without --target.)
[target.riscv32im-unknown-none-elf]
rustflags = [
    # The hogd rv32 VM permits unaligned data loads/stores, so let LLVM emit
    # them directly instead of byte-wise expansions. `relax` emits
    # R_RISCV_RELAX relocations so lld folds auipc+jalr call pairs into
    # single `jal` (smaller code AND one fewer executed instruction per
    # relaxed call). Output stays pure RV32IM.
    "-C", "target-feature=+unaligned-scalar-mem,+relax",
    "-C", "link-arg=-Tthruput-rv32.ld",
    "-C", "link-arg=-static",
    "-C", "link-arg=--no-dynamic-linker",
    "-C", "link-arg=--gc-sections",
    # The thruput-rv32 linker script deliberately overlaps the CODE and
    # DATA VMAs (modified-Harvard: separate VM address spaces) so DATA
    # starts near 0 and the stored image carries no code-sized zero shadow.
    # Tell lld the overlap is intentional.
    "-C", "link-arg=--no-check-sections",
    # Identical-code folding: merge byte-identical sections at link time.
    # Safe here — nothing compares function pointers for identity (the
    # dispatch-table wrappers are only ever called).
    "-C", "link-arg=--icf=all",
    # gp relaxation: with the __global_pointer$ anchor in thruput-rv32.ld
    # and the gp init in rv32-runtime _start, lld folds static-address
    # lui+addi pairs into single gp-relative accesses for statics within
    # +/-2 KiB of the anchor. lld needs this explicit opt-in (GNU ld
    # relaxes gp by default; lld deliberately doesn't).
    "-C", "link-arg=--relax-gp",
    # The hogd rv32 VM admits the canonical `unimp` trap (0xc0001073), so use
    # immediate-abort: panic sites compile straight to the trap instruction
    # instead of routing through the SDK ebreak panic handler, stripping the
    # panic-formatting machinery by construction. Requires unstable-options.
    "-Z", "unstable-options",
    "-C", "panic=immediate-abort",
    "-C", "relocation-model=static",
    "-Z", "trap-unreachable=false",
    "--deny", "warnings",
    ]

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1
