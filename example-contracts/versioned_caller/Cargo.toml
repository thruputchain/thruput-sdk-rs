[package]
name = "versioned_caller"
description = "A stateless contract that cross-calls a versioned callee"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
dev = ["sdk/dev", "versioned_callee/dev"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[dependencies]
sdk = { workspace = true }
versioned_callee = { path = "../versioned_callee" }

[dev-dependencies]
versioned_caller = { path = ".", features = ["dev"] }
