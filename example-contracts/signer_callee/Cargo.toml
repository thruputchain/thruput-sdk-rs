[package]
name = "signer_callee"
description = "A contract that accepts a Signer<T> parameter"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
default = ["alloc"]
# The guest build needs alloc: `sdk::signer::mint_auth_token` is alloc-gated,
# and `thruput build` passes --no-default-features, so `default` does not
# reach it. State the requirement on the feature the CLI does enable.
entrypoints = ["alloc"]
alloc = ["sdk/alloc"]
dev = ["sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. `thruput build -p signer_callee` derives
# `--bin signer_callee` from the package name, so the name here must stay the
# underscored package name. `required-features` keeps it out of host builds.
[[bin]]
name = "signer_callee"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
sdk = { workspace = true }

[dev-dependencies]
signer_callee = { path = ".", features = ["dev"] }
