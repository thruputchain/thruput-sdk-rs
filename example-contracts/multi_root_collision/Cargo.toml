[package]
name = "multi_root_collision"
description = "Workspace-excluded fixture: two roots sharing a domain to exercise collision detection"
version = "0.4.0"
authors = ["Groundhog Team"]
license = "Apache-2.0"
publish = ["groundhog"]
repository = "https://github.com/groundhogchain/example-contracts.git"
homepage = "https://github.com/groundhogchain/example-contracts.git"
keywords = ["groundhog"]
categories = ["blockchain"]
edition = "2024"

# Stand-alone workspace root so `cargo test` inside this directory (or via
# the detection script) resolves without being pulled into the parent workspace.
[workspace]

[features]
entrypoints = []
dev = ["sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "=0.34.0" }

[dev-dependencies]
multi_root_collision = { path = ".", features = ["dev"] }
