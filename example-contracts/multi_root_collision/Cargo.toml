[package]
name = "multi_root_collision"
description = "Workspace-excluded fixture: two roots sharing a domain to exercise collision detection"
version = "0.4.0"
authors = ["Thruput Team"]
license = "Apache-2.0"
publish = false
repository = "https://github.com/thruputchain/thruput-sdk-rs"
homepage = "https://github.com/thruputchain/thruput-sdk-rs"
keywords = ["thruput"]
categories = ["blockchain"]
edition = "2024"

# Stand-alone workspace root so `cargo test` inside this directory (or via
# the detection script) resolves without being pulled into the parent workspace.
[workspace]

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
thruput-sdk = { path = "../../crates/sdk", version = "=0.58.0" }

[dev-dependencies]
multi_root_collision = { path = ".", features = ["dev"] }

# A deliberate storage-domain collision. Built only by
# scripts/check-domain-collision-detected.sh, where its generated
# storage-domain uniqueness test must fail. It is its own excluded workspace:
# building it with `-F entrypoints` from the example-contracts workspace fails
# ("features for packages outside of workspace").
[package.metadata.gnaw]
kind = "negative"
