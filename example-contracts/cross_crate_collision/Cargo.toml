# Stand-alone workspace: deliberately-colliding fixture, only ever built by
# scripts/check-domain-collision-detected.sh (which asserts its test FAILS).
[workspace]
members = ["alpha", "beta", "wrapper"]
resolver = "2"

[workspace.package]
version = "0.4.0"
authors = ["Groundhog Team"]
license = "Apache-2.0"
publish = false
edition = "2024"

# One pin for the whole fixture: an SDK bump touches this line only, not
# each member manifest.
[workspace.dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "=0.19.4" }
