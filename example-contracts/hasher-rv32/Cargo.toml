[package]
name = "hasher-rv32"
description = "RV32 binary wrapper around the hasher example contract"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = ["hasher/entrypoints"]
# The bottle-test tester artifact: the same contract plus the BottleTest
# entrypoints that drive it. scripts/dev.sh builds this package twice --
# once plain (the target under measurement) and once with this feature (the
# tester) -- and hands both artifacts to `cargo run -p bottle-test`.
bottle-test = ["hasher/bottle-test"]

[[bin]]
name = "hasher_rv32"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
hasher = { path = "../hasher" }
sdk = { workspace = true }
