[package]
name = "erc1271_wallet"
description = "Example ERC1271 wallet that produces opaque auth tokens"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
default = ["alloc"]
entrypoints = []
alloc = ["sdk/alloc"]
dev = ["sdk/dev", "groundhog-erc1271-if/dev"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[dependencies]
sdk = { workspace = true, features = ["storage"] }
groundhog-erc1271-if = { workspace = true }

[dev-dependencies]
erc1271_wallet = { path = ".", features = ["dev"] }
