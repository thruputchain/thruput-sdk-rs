[package]
name = "permit_wallet"
description = "Example wallet authorizing ERC20 bounded transfers and allowance changes"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = [
    "thruput-sdk/dev",
    "dep:thiserror",
    "thruput-signed-op/dev",
    "thruput-erc20-permit-if/dev",
]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "permit_wallet"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
# `alloc`: the mint functions encode the token node into a `Vec`.
thruput-sdk = { workspace = true, features = ["alloc"] }
thruput-signed-op = { workspace = true }
thruput-erc20-permit-if = { workspace = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
permit_wallet = { path = ".", features = ["dev"] }
