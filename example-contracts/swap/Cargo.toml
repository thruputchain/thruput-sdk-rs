[package]
name = "swap"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]
doctest = false
test = false # suppress output from our zero unit-tests

[dependencies]
sdk = { workspace = true, features = ["alloc"] }
groundhog-erc20-if = { workspace = true }
erc20 = { path = "../erc20" }
uint = { version = "0.10.0", default-features = false }
heapless = { workspace = true }

[features]
entrypoints = []
dev = ["sdk/dev", "erc20/dev"]

[dev-dependencies]
swap = { path = ".", features = ["dev"] }
