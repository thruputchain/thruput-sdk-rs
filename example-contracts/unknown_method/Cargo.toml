[package]
name = "unknown_method"
description = "Fixture: calling a method this contract does not define throws LibraryExn::UnknownMethod"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. `thruput build -p unknown_method` derives
# `--bin unknown_method` from the package name, so the name here must stay the
# underscored package name. `required-features` keeps it out of host builds.
[[bin]]
name = "unknown_method"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
sdk = { workspace = true }

[dev-dependencies]
unknown_method = { path = ".", features = ["dev"] }
