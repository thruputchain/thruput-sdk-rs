[package]
name = "erc20_permit"
description = "Example ERC20 accepting off-chain approvals via signed operations"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = [
    "sdk/dev",
    "groundhog-erc20-if/dev",
    "groundhog-erc20-permit-if/dev",
]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. `groundhog build -p erc20_permit` derives
# `--bin erc20_permit` from the package name, so the name here must stay the
# underscored package name. `required-features` keeps it out of host builds.
[[bin]]
name = "erc20_permit"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }
groundhog-erc20-permit-if = { workspace = true }

[dev-dependencies]
erc20_permit = { path = ".", features = ["dev"] }
permit_wallet = { path = "../permit_wallet", features = ["dev"] }
# The token itself never touches a signed operation; the test plays the
# submitter, which takes one to the wallet.
groundhog-signed-op-if = { workspace = true, features = ["dev"] }
# `std` pulls in `alloc` + `sha2`; the host side needs `SignedOp` (alloc-gated)
# to rebuild the preimage a signer covers.
groundhog-domain-separator = { workspace = true, features = ["std"] }
ed25519-dalek = { workspace = true }
