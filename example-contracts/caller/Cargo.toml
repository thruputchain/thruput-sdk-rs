[package]
name = "caller"
description = "A contract exercising cross-calls"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["erc20/dev", "sdk/dev", "groundhog-erc20-if/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. `groundhog build --target rv32 -p caller` derives
# `--bin caller` from the package name, so the name here must stay the
# underscored package name. `required-features` keeps it out of host builds.
[[bin]]
name = "caller"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
sdk = { workspace = true }
erc20 = { path = "../erc20" }
groundhog-erc20-if = { workspace = true }

[dev-dependencies]
caller = { path = ".", features = ["dev"] }
