cargo-features = ["trim-paths"] #unstable

[workspace]
resolver = "3"
members = [
    "caller",
    # "counter",
    "erc20",
    "erc20_no_storage",
    "erc20_low_level",
    "exceptions",
    "genesis_deployer",
    "hasher",
    "rcq_test",
    "simple_wallet_old",
    # "swap",
    "test_bytestring",
]

[workspace.package]
version = "0.2.0"
authors = ["Groundhog Team"]
license = "Apache-2.0"
publish = ["groundhog"]
repository = "https://github.com/groundhogchain/example-contracts.git"
homepage = "https://github.com/groundhogchain/example-contracts.git"
keywords = ["groundhog"]
categories = ["blockchain"]
edition = "2024"

[workspace.dependencies]
sdk = { path = ".." , registry = "groundhog", version = "=0.2.0" }
xdrs = { registry = "groundhog", version = "0.4.0", features = ["int128", "heapless"] }
sha2 = { version = "0.10.8", default-features = false }
thiserror = { version = "2.0.12", default-features = false }
hex-literal = "1.0.0"

# Standard interface crates
groundhog-erc20-if = { path = "../standard-interfaces/groundhog-erc20" }
groundhog-erc1271-if = { path = "../standard-interfaces/groundhog-erc1271" }

# Standard test crates
bottle-test-if = { path = "../standard-tests/bottle-test-if" }
erc20-test = { path = "../standard-tests/erc20-test" }
erc20-bottle-test = { path = "../standard-tests/erc20-bottle-test" }
erc20-native-test = { path = "../standard-tests/erc20-native-test" }

[profile.release]
trim-paths = "all" # unstable

[patch.groundhog] # XXX
xdrs = { git = "ssh://git@github.com/groundhogchain/xdrs.git" }
sdk = { path = ".." }
abort = { git = "ssh://git@github.com/groundhogchain/abort_rs.git" }
