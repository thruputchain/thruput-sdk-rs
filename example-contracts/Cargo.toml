cargo-features = ["trim-paths"] #unstable

[workspace]
resolver = "3"
members = [
    "caller",
    "complex-storage",
    "counter",
    "erc20",
    "erc20_raw_storage",
    "erc20_low_level",
    "exceptions",
    "genesis_deployer",
    "hasher",
    "rcq_test",
    "simple_wallet_old",
    "swap",
    "swap_driver",
    "test_bytestring",
    "rcq_test",
    "swap_request",
    "stateless",
    "codegen_trait_noclient",
    "codegen_trait_client",
    "codegen_hygiene",
    "codegen_impl_noclient",
    "codegen_impl_client",
    "storage_errors",
    "multi_throws",
    "multi_imported_traits",
    "named_interface_callee",
    "named_interface_caller",
    "bare_impl_callee",
    "bare_impl_caller",
    "free_fn_unnamed",
    "spec_named_types",
    "recursive_type",
    "versioned_callee",
    "versioned_caller",
    "imported_error_type",
    "imported_error_callee",
    "imported_error_caller",
    "signer_callee",
    "signer_caller",
    "signer_leaf",
    "signer_middle",
    "signer_minter",
    "signer_tuple_test",
    "erc1271_wallet",
    "erc1271_caller",
    "invoke_flags_test",
    "counter-rv32",
    "multi_root_storage",
    "slot_reorder",
    "velocity_limit",
]

exclude = [
    "multi_root_collision",
    "cross_crate_collision",
]

[workspace.package]
version = "0.4.0"
authors = ["Groundhog Team"]
license = "Apache-2.0"
publish = ["groundhog"]
repository = "https://github.com/groundhogchain/example-contracts.git"
homepage = "https://github.com/groundhogchain/example-contracts.git"
keywords = ["groundhog"]
categories = ["blockchain"]
edition = "2024"

[workspace.dependencies]
sdk = { path = "../crates/sdk", registry = "groundhog", version = "=0.17.6" }
groundhog-contract-util = { path = "../crates/contract-util", registry = "groundhog", version = "=0.17.6" }
groundhog-domain-separator = { path = "../crates/domain-separator", registry = "groundhog", version = "=0.17.6", default-features = false }

groundhog-erc20-if = { path = "../standard-interfaces/groundhog-erc20", registry = "groundhog", version = "=0.1.6" }
groundhog-erc20-metadata-if = { path = "../standard-interfaces/groundhog-erc20-metadata", registry = "groundhog", version = "=0.1.6" }
groundhog-erc1271-if = { path = "../standard-interfaces/groundhog-erc1271", registry = "groundhog", version = "=0.1.6" }

erc20-test = { path = "../standard-tests/erc20-test" }
erc20-bottle-test = { path = "../standard-tests/erc20-bottle-test" }
erc20-native-test = { path = "../standard-tests/erc20-native-test" }
bottle-test-if = { path = "../crates/bottle-test-if" }

# External groundhog dependencies
xdrs = { registry = "groundhog", version = "0.8.2", default-features = false }

# External crates.io dependencies
sha2 = { version = "0.11.0", default-features = false }
thiserror = { version = "2.0.12", default-features = false }
hex-literal = "1.0.0"
heapless = { version = "0.9.2" }

[profile.release]
trim-paths = "all" # unstable
