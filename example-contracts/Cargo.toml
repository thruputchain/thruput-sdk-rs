cargo-features = ["trim-paths"] #unstable

[workspace]
resolver = "3"
members = [
    "caller",
    "complex-storage",
    "counter",
    "erc20",
    "erc20_no_storage",
    "erc20_low_level",
    "exceptions",
    "genesis_deployer",
    "hasher",
    "rcq_test",
    "simple_wallet_old",
    "swap",
    "test_bytestring",
    "rcq_test",
    "swap_request",
    "stateless",
    "codegen_trait_noclient",
    "codegen_trait_client",
    "codegen_impl_noclient",
    "codegen_impl_client",
    "storage_errors",
    "multi_throws",
    "multi_imported_traits",
    "named_interface_callee",
    "named_interface_caller",
    "bare_impl_callee",
    "bare_impl_caller",
    "free_fn_unnamed",
    "spec_named_types",
    "versioned_callee",
    "versioned_caller",
    "imported_error_type",
    "imported_error_callee",
    "imported_error_caller",
]

[workspace.package]
version = "0.3.0"
authors = ["Groundhog Team"]
license = "Apache-2.0"
publish = ["groundhog"]
repository = "https://github.com/groundhogchain/example-contracts.git"
homepage = "https://github.com/groundhogchain/example-contracts.git"
keywords = ["groundhog"]
categories = ["blockchain"]
edition = "2024"

[workspace.dependencies]
sdk = { path = ".." , registry = "groundhog", version = "=0.11.0" }
sha2 = { version = "0.10.8", default-features = false }
thiserror = { version = "2.0.12", default-features = false }
hex-literal = "1.0.0"

# Standard interface crates
groundhog-erc20-if = { path = "../standard-interfaces/groundhog-erc20", registry = "groundhog", version = "=0.1.0" }
groundhog-erc1271-if = { path = "../standard-interfaces/groundhog-erc1271", registry = "groundhog", version = "=0.1.0" }
bottle-test-if = { path = "../standard-interfaces/bottle-test-if", registry = "groundhog", version = "=0.1.0" }
groundhog-contract-util = { path = "../contract-util" , registry = "groundhog", version = "=0.11.0" }

# Standard test crates
erc20-test = { path = "../standard-tests/erc20-test" }
erc20-bottle-test = { path = "../standard-tests/erc20-bottle-test" }
erc20-native-test = { path = "../standard-tests/erc20-native-test" }

[profile.release]
trim-paths = "all" # unstable
