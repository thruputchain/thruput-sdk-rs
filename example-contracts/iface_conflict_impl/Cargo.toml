[package]
name = "iface_conflict_impl"
description = "Negative spec fixture: implements A's Token while linking B's colliding Token, so the anchored-key metadata conflict must fail spec rewrite"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev", "iface_conflict_if_a/dev", "iface_conflict_if_b/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. The directory deliberately lacks a `-rv32` suffix so the
# wrapper glob in scripts/dev.sh never builds it expecting success; the
# negative check builds it by name. Same shape as dup_entrypoint_neg.
[[bin]]
name = "iface_conflict_impl"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
sdk = { workspace = true }
iface_conflict_if_a = { path = "../iface_conflict_if_a" }
iface_conflict_if_b = { path = "../iface_conflict_if_b" }

[dev-dependencies]
iface_conflict_impl = { path = ".", features = ["dev"] }
