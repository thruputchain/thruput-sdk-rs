[package]
name = "iface_conflict_impl"
description = "Spec fixture: implements A's Token while linking B's colliding Token; the spec keeps A's interface and shakes B's"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev", "iface_conflict_if_a/dev", "iface_conflict_if_b/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact, built by the standard rv32 loop in scripts/dev.sh.
[[bin]]
name = "iface_conflict_impl"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
sdk = { workspace = true }
iface_conflict_if_a = { path = "../iface_conflict_if_a" }
iface_conflict_if_b = { path = "../iface_conflict_if_b" }

[dev-dependencies]
iface_conflict_impl = { path = ".", features = ["dev"] }
