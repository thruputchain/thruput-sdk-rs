[package]
name = "typedef_shaking_caller"
description = "Caller linking two versions of a market interface (implementing neither) — typedef-collision shaking e2e"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev", "typedef_shaking_if_v1/dev", "typedef_shaking_if_v2/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. `groundhog build -p typedef_shaking_caller` derives
# `--bin typedef_shaking_caller` from the package name, so the name here must stay the
# underscored package name. `required-features` keeps it out of host builds.
[[bin]]
name = "typedef_shaking_caller"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
sdk = { workspace = true }
typedef_shaking_if_v1 = { path = "../typedef_shaking_if_v1" }
typedef_shaking_if_v2 = { path = "../typedef_shaking_if_v2" }

[dev-dependencies]
typedef_shaking_caller = { path = ".", features = ["dev"] }
