[package]
name = "u256_roundtrip"
description = "Example contract exercising sdk::U256 and sdk::I256 through entrypoints and storage"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev"]
# Adds the `BottleTest` entrypoints that drive this contract from inside
# another guest contract -- see src/bottle_test.rs for what that covers that
# the host-driven tests cannot.
bottle-test = ["dep:bottle-test-if"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. `thruput build -p u256_roundtrip` derives
# `--bin u256_roundtrip` from the package name, so the name here must stay the
# underscored package name. `required-features` keeps it out of host builds.
[[bin]]
name = "u256_roundtrip"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
sdk = { workspace = true }

# Optional
bottle-test-if = { workspace = true, optional = true }

[dev-dependencies]
u256_roundtrip = { path = ".", features = ["dev"] }
