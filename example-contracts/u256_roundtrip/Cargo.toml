[package]
name = "u256_roundtrip"
description = "Example contract exercising thruput_sdk::U256 and thruput_sdk::I256 through entrypoints and storage"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. `thruput build -p u256_roundtrip` derives
# `--bin u256_roundtrip` from the package name, so the name here must stay the
# underscored package name. `required-features` keeps it out of host builds.
[[bin]]
name = "u256_roundtrip"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
thruput-sdk = { workspace = true }

[dev-dependencies]
u256_roundtrip = { path = ".", features = ["dev"] }
