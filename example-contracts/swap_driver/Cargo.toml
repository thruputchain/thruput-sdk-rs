[package]
name = "swap_driver"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false # suppress output from our zero unit-tests

[dependencies]
sdk = { workspace = true, features = ["alloc"] }
groundhog-erc20-if = { workspace = true }
groundhog-erc20-metadata-if = { workspace = true, optional = true }
swap = { path = "../swap" }
erc20 = { path = "../erc20" }
uint = { version = "0.10.0", default-features = false }
heapless = { workspace = true }
thiserror = { workspace = true }

[features]
entrypoints = []
metadata = ["dep:groundhog-erc20-metadata-if", "erc20/metadata"]
dev = ["sdk/dev", "swap/dev", "erc20/dev"]

[dev-dependencies]
swap_driver = { path = ".", features = ["dev"] }
