[package]
name = "signer_minter"
description = "Minter contract that builds a nested auth token tree and passes to middle"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
default = ["alloc"]
entrypoints = []
alloc = ["sdk/alloc"]
dev = ["sdk/dev", "signer_middle/dev", "signer_leaf/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[dependencies]
sdk = { workspace = true }
signer_middle = { path = "../signer_middle" }
signer_leaf = { path = "../signer_leaf" }

[dev-dependencies]
signer_minter = { path = ".", features = ["dev"] }

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"
