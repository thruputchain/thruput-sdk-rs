[package]
name = "event_shaking_subset"
description = "Contract implementing only a subset of imported interface traits (event-shaking e2e)"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["thruput-sdk/dev", "event_shaking_if/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. `thruput build -p event_shaking_subset` derives
# `--bin event_shaking_subset` from the package name, so the name here must stay the
# underscored package name. `required-features` keeps it out of host builds.
[[bin]]
name = "event_shaking_subset"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
thruput-sdk = { workspace = true }
event_shaking_if = { path = "../event_shaking_if" }

[dev-dependencies]
event_shaking_subset = { path = ".", features = ["dev"] }
