[package]
name = "missing_contract_macro"
description = "Negative spec fixture: a contract crate that forgot #[contract] (no entrypoints) — spec rewrite must fail even though linked interface candidates populate the raw section"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev", "iface_conflict_if_a/dev"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[dependencies]
sdk = { workspace = true }
iface_conflict_if_a = { path = "../iface_conflict_if_a" }

[dev-dependencies]
missing_contract_macro = { path = ".", features = ["dev"] }
