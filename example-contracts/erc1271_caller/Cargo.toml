[package]
name = "erc1271_caller"
description = "Example contract that calls an ERC1271 wallet to get opaque auth tokens"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
default = ["alloc"]
entrypoints = []
alloc = ["sdk/alloc"]
dev = ["sdk/dev", "groundhog-erc1271-if/dev", "erc1271_wallet/dev"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[dependencies]
sdk = { workspace = true }
groundhog-erc1271-if = { workspace = true }
erc1271_wallet = { path = "../erc1271_wallet" }

[dev-dependencies]
erc1271_caller = { path = ".", features = ["dev"] }

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"
