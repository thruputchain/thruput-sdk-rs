[package]
name = "erc20_low_level"
description = "Example ERC20 contract for the Thruput blockchain"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. `thruput build -p erc20_low_level` derives
# `--bin erc20_low_level` from the package name, so the name here must stay the
# underscored package name. `required-features` keeps it out of host builds.
[[bin]]
name = "erc20_low_level"
path = "src/main.rs"
required-features = ["entrypoints"]

[features]
entrypoints = []
dev = ["thruput-sdk/dev", "thruput-erc20-if/dev"]

[dependencies]
thruput-sdk = { workspace = true }
thruput-erc20-if = { workspace = true }

[dev-dependencies]
erc20_low_level = { path = ".", features = ["dev"] }
erc20-native-test.workspace = true
