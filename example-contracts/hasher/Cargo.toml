[package]
name = "hasher"
description = "A contract exercising hashing"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev"]
# The bottle harness deploys, stores, and makes cross-contract calls, whose
# buffers are large in the no-alloc guest; build it with alloc so they land on
# the heap instead of the guest stack.
bottle-test = ["dep:bottle-test-if", "sdk/alloc"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[dependencies]
sdk = { workspace = true }

# Optional
bottle-test-if = { workspace = true, optional = true }

[dev-dependencies]
hasher = { path = ".", features = ["dev"] }
