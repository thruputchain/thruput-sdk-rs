[package]
name = "typedef_collision_reachable"
description = "Negative spec fixture: implements MarketV1 while linking if_v2, so the SharedConfig conflict is reachable and spec rewrite must fail"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev", "typedef_shaking_if_v1/dev", "typedef_shaking_if_v2/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. The directory deliberately lacks a `-rv32` suffix so the
# wrapper glob in scripts/dev.sh never builds it expecting success; the
# negative check builds it by name. Same shape as dup_entrypoint_neg.
[[bin]]
name = "typedef_collision_reachable"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
sdk = { workspace = true }
typedef_shaking_if_v1 = { path = "../typedef_shaking_if_v1" }
typedef_shaking_if_v2 = { path = "../typedef_shaking_if_v2" }

[dev-dependencies]
typedef_collision_reachable = { path = ".", features = ["dev"] }
