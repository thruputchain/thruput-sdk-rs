[package]
name = "spec_name_reuse"
description = "Shows the collisions qualified spec ids resolve: two crates' same-named Error and Updated, plus two of this crate's own modules reusing one type ident"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev", "dup_name_if_a/dev", "dup_name_if_b/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "spec_name_reuse"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
sdk = { workspace = true }
dup_name_if_a = { path = "../dup_name_if_a" }
dup_name_if_b = { path = "../dup_name_if_b" }

[dev-dependencies]
spec_name_reuse = { path = ".", features = ["dev"] }
