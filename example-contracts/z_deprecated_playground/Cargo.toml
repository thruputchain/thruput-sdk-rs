[package]
name = "playground"
version = "0.2.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
# get non-standard i128 impls
xdrs = { workspace = true, features = ["int128"]}
thiserror = { workspace = true }

# Optional
bottle-test-if = { workspace = true, optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
client = []
guest = []
mock = ["guest", "sdk/mock"]
logging = ["sdk/logging"]
bottle-test = ["dep:bottle-test-if", "client"]

[dev-dependencies]
playground = { path = ".", features = ["mock", "client"] }
