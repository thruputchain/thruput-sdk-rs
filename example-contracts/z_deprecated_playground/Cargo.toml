[package]
name = "playground"
version = "0.2.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
thiserror = { workspace = true }

# Optional
bottle-test-if = { workspace = true, optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
entrypoints = []
guest = []
mock = ["guest", "sdk/mock"]
logging = ["sdk/logging"]
bottle-test = ["dep:bottle-test-if", "entrypoints"]

[dev-dependencies]
playground = { path = ".", features = ["mock", "entrypoints"] }
