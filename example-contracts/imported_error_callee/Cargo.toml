[package]
name = "imported_error_callee"
description = "A stateless contract that re-exports and throws an imported error type"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. `groundhog build --target rv32 -p imported_error_callee` derives
# `--bin imported_error_callee` from the package name, so the name here must stay the
# underscored package name. `required-features` keeps it out of host builds.
[[bin]]
name = "imported_error_callee"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
sdk = { workspace = true }
imported_error_type = { path = "../imported_error_type" }

[dev-dependencies]
imported_error_callee = { path = ".", features = ["dev"] }
