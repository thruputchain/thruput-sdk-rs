[package]
name = "raw_iface_dep"
description = "Raw contract (hand-written entrypoints) linking an interface crate: shaken candidates must leave no spec section"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev", "iface_conflict_if_a/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. `groundhog build -p raw_iface_dep` derives
# `--bin raw_iface_dep` from the package name, so the name here must stay the
# underscored package name. `required-features` keeps it out of host builds.
[[bin]]
name = "raw_iface_dep"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
sdk = { workspace = true }
iface_conflict_if_a = { path = "../iface_conflict_if_a" }

[dev-dependencies]
raw_iface_dep = { path = ".", features = ["dev"] }
