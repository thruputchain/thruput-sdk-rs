[package]
name = "iface_conflict_caller"
description = "Caller linking two interface crates whose Token traits collide on the interface key (implementing neither) — conflict-shaking e2e"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev", "iface_conflict_if_a/dev", "iface_conflict_if_b/dev"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[dependencies]
sdk = { workspace = true }
iface_conflict_if_a = { path = "../iface_conflict_if_a" }
iface_conflict_if_b = { path = "../iface_conflict_if_b" }

[dev-dependencies]
iface_conflict_caller = { path = ".", features = ["dev"] }
