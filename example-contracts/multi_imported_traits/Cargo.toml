[package]
name = "multi_imported_traits"
description = "A contract implementing multiple imported interface traits"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev", "named_interface_callee/dev", "versioned_callee/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. `groundhog build -p multi_imported_traits` derives
# `--bin multi_imported_traits` from the package name, so the name here must stay the
# underscored package name. `required-features` keeps it out of host builds.
[[bin]]
name = "multi_imported_traits"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
sdk = { workspace = true }
named_interface_callee = { path = "../named_interface_callee" }
versioned_callee = { path = "../versioned_callee" }

[dev-dependencies]
multi_imported_traits = { path = ".", features = ["dev"] }
