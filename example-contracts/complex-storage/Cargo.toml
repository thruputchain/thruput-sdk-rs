[package]
name = "complex-storage"
description = "Example complex storage contract for the Thruput blockchain"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false

# The rv32 artifact. `thruput build -p complex-storage` derives
# `--bin complex_storage` from the package name, so the name here must stay the
# underscored package name. `required-features` keeps it out of host builds.
[[bin]]
name = "complex_storage"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
thruput-sdk = { workspace = true }

[dev-dependencies]
complex-storage = { path = ".", features = ["dev"] }
