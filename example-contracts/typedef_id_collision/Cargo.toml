[package]
name = "typedef_id_collision"
description = "Negative spec fixture: two defs claim one spec id, so canonicalization must still fail"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. The crate carries a `disabled` marker so the rv32 build
# loop never builds it expecting success; the negative check builds it by name.
[[bin]]
name = "typedef_id_collision"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
sdk = { workspace = true }

[dev-dependencies]
typedef_id_collision = { path = ".", features = ["dev"] }
