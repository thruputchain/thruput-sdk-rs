[package]
name = "erc20"
description = "Example ERC20 contract for the Groundhog blockchain"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = [
    "sdk/dev",
    "metadata",
    "groundhog-erc20-if/dev",
    "groundhog-erc20-metadata-if/dev",
    "erc20-native-test/metadata"
    ]
bottle-test = ["dep:erc20-bottle-test", "erc20-bottle-test/entrypoints", "sdk/alloc"]
metadata = ["dep:groundhog-erc20-metadata-if"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }
groundhog-erc20-metadata-if = { workspace = true, optional = true }

# Optional testing dependencies
erc20-bottle-test = { workspace = true, optional = true }

[dev-dependencies]
erc20 = { path = ".", features = ["dev", "metadata"] }
erc20-native-test = { workspace = true, features = ["metadata"] }
sha2.workspace = true
