[package]
name = "scheme_keys"
description = "A contract storing, emitting, hashing and verifying scheme-tagged public keys (Ed25519 and ML-DSA-65)"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. `thruput build -p scheme_keys` derives `--bin scheme_keys`
# from the package name, so the name here must stay the underscored package
# name. `required-features` keeps it out of host builds.
[[bin]]
name = "scheme_keys"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
thruput-sdk = { workspace = true, features = ["alloc"] }

[dev-dependencies]
scheme_keys = { path = ".", features = ["dev"] }
ed25519-dalek = { workspace = true }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"] }
