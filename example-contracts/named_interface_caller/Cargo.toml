[package]
name = "named_interface_caller"
description = "A stateless contract that cross-calls a callee with an explicitly named interface"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev", "named_interface_callee/dev"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[dependencies]
sdk = { workspace = true }
named_interface_callee = { path = "../named_interface_callee" }

[dev-dependencies]
named_interface_caller = { path = ".", features = ["dev"] }
