[package]
name = "recursive_type"
description = "A contract demonstrating recursive #[contract_type] structs"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev"]

# rv32 spec carrier: without a bin to anchor the entrypoint records, this
# contract's spec cannot be extracted at all. `required-features` keeps a
# plain `cargo build`/`test` from building this rv32-only, entry-point-less
# binary, matching every other example contract here.
[[bin]]
name = "recursive_type"
path = "src/main.rs"
required-features = ["entrypoints"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[dependencies]
sdk = { workspace = true, features = ["alloc"] }

[dev-dependencies]
recursive_type = { path = ".", features = ["dev"] }
