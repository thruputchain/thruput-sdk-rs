[package]
name = "versioned_impl"
description = "A 0.2 contract implementing the imported 0.1 Adder interface"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
entrypoints = []
dev = ["sdk/dev", "versioned_interface/dev"]
bottle-test = ["dep:bottle-test-if"]

[lib]
doctest = false
test = false

[[bin]]
name = "versioned_impl"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
sdk = { workspace = true }
versioned_interface = { path = "../versioned_interface" }
bottle-test-if = { workspace = true, optional = true }

[dev-dependencies]
versioned_impl = { path = ".", features = ["dev"] }
