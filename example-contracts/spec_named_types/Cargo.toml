[package]
name = "spec_named_types"
description = "A contract demonstrating #[contract_type] for named type spec generation"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. `thruput build -p spec_named_types` derives
# `--bin spec_named_types` from the package name, so the name here must stay the
# underscored package name. `required-features` keeps it out of host builds.
[[bin]]
name = "spec_named_types"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
sdk = { workspace = true, features = ["alloc"] }
heapless = { workspace = true }

[dev-dependencies]
spec_named_types = { path = ".", features = ["dev"] }
