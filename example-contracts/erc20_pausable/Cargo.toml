[package]
name = "erc20_pausable"
description = "Example pausable ERC20 contract with metadata and role-based access control"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = [
    "sdk/dev",
    "thruput-erc20-if/dev",
    "thruput-erc20-metadata-if/dev",
    "thruput-erc20-pausable-if/dev",
    "thruput-access-control-if/dev",
    "thruput-access-control/dev",
    "thruput-erc165-if/dev",
]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. `thruput build -p erc20_pausable` derives
# `--bin erc20_pausable` from the package name, so the name here must stay the
# underscored package name. `required-features` keeps it out of host builds.
[[bin]]
name = "erc20_pausable"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
sdk = { workspace = true }
thruput-erc20-if = { workspace = true }
thruput-erc20-metadata-if = { workspace = true }
thruput-erc20-pausable-if = { workspace = true }
thruput-access-control-if = { workspace = true }
thruput-access-control = { workspace = true }
thruput-erc165-if = { workspace = true }

[dev-dependencies]
erc20_pausable = { path = ".", features = ["dev"] }
# Only for the ERC-165 negative cases: an interface this token does not
# implement, and a contract that does not implement ERC-165.
thruput-signed-op-if = { workspace = true, features = ["dev"] }
counter = { path = "../counter", features = ["dev"] }
