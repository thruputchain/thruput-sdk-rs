[package]
name = "exceptions"
description = "A contract exercising exceptions"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. `groundhog build --target rv32 -p exceptions` derives
# `--bin exceptions` from the package name, so the name here must stay the
# underscored package name. `required-features` keeps it out of host builds.
[[bin]]
name = "exceptions"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
sdk = { workspace = true, features = ["alloc"] }

[dev-dependencies]
exceptions = { path = ".", features = ["dev"] }
