# cargo-deny configuration: advisory, license, source, and duplicate-version
# policy.
# https://embarkstudios.github.io/cargo-deny/
#
# Advisories are checked both per-PR (ci.yml) and daily (audit.yml). Gating at
# PR time is what blocks a change that *introduces* a vulnerable dependency;
# the daily run is what catches a new advisory filed against an already-frozen
# Cargo.lock, which a push-triggered job never sees. Both are needed.
#
# Every exception added to this file gets a comment naming the dependency
# that needs it and why.

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
# Internal crates (publish = false) carry no license field: the workspace's
# test fixtures and helpers, e.g. version-mismatch-helper. They ship to nobody.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "MIT",
    # bindgen
    "BSD-3-Clause",
    # ryu (dual-licensed Apache-2.0 OR BSL-1.0)
    "BSL-1.0",
    # libloading
    "ISC",
    # unicode-ident is (MIT OR Apache-2.0) AND Unicode-3.0
    "Unicode-3.0",
    # byteorder, memchr (both dual-licensed Unlicense OR MIT)
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies carry no version requirement; every crate here is
# publish = false, so path wildcards are safe. Registry wildcards stay denied.
allow-wildcard-paths = true

# bindgen (thruput-sys's `source-build` feature) takes `syn = ">=2, <4"` and
# `prettyplease = ">=0.2.7, <0.4"` as independent ranges, but the two have to
# agree: prettyplease 0.2 is syn 2 and prettyplease 0.3 is syn 3. syn 2 is
# already in the graph, so cargo reuses it for bindgen rather than adding a
# second syn -- and prettyplease, unconstrained, goes to 0.3. That pairing
# hands bindgen a syn-2 `File` where `prettyplease::unparse` wants a syn-3
# one, and bindgen does not compile. Nothing in the default feature set builds
# bindgen, so it surfaces only in the release dry run's feature powerset --
# keep it a PR-time failure instead.
#
# Lift this once nothing holds syn 2 any more: bindgen would then take syn 3
# and prettyplease 0.3 is what agrees with it. Today the sole holder is
# curve25519-dalek-derive 0.1.1 (`syn = "^2.0.27"`; 0.1.0 and 0.1.1 are its
# only releases, both syn 2), reached through curve25519-dalek 5.0.0 ->
# ed25519-dalek 3.0.0 -> thruput-native-exec [dev-dependencies]. Every
# published curve25519-dalek from 4.1.2 on requires that derive crate
# unconditionally, so there is no upgrade out of it -- only dropping
# ed25519-dalek from native-exec's dev-dependencies.
[[bans.deny]]
name = "prettyplease"
version = ">=0.3"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    # crates.io
    "https://github.com/rust-lang/crates.io-index",
    # private groundhog registry (kellnr); matches .cargo/config.toml.
    # The legacy groundhog.dev registry is deliberately NOT listed: it is
    # being retired, and nothing may re-enter the graph through it.
    "sparse+https://crates.thruput.network/api/v1/crates/",
]
