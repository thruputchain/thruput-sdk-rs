[package]
name = "groundhog-contract-spec"
authors.workspace = true
license.workspace = true
edition.workspace = true
version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Canonical contract spec model for Groundhog contracts"

[lib]
crate-type = ["rlib"]

[features]
default = ["protocol"]
alloc = ["xdrs/alloc"]
protocol = ["alloc", "dep:groundhog-spec"]
serde = ["protocol", "groundhog-spec/serde"]

[dependencies]
groundhog-xdr = { workspace = true }
groundhog-spec = { workspace = true, optional = true }
xdrs = { workspace = true, features = ["heapless", "derive"] }
xdr-common = { workspace = true }
