[package]
name = "groundhog-contract-spec"
authors.workspace = true
license.workspace = true
edition.workspace = true
version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Canonical contract spec model for Groundhog contracts"

[lib]
crate-type = ["rlib"]

[features]
default = ["owned-model"]
alloc = ["xdrs/alloc"]
owned-model = ["alloc", "dep:groundhog-spec"]
serde = ["owned-model", "groundhog-spec/serde"]
syscalls = []

[dependencies]
groundhog-xdr = { workspace = true }
groundhog-spec = { workspace = true, optional = true }
xdrs = { workspace = true, features = ["heapless", "derive"] }
xdr-common = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
groundhog-xdr = { workspace = true, features = ["syscalls_mock"] }

[[test]]
name = "groundhog_xdr_refspec"
required-features = ["syscalls"]
