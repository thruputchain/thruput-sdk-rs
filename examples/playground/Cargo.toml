[package]
name = "playground"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
serde = { workspace = true, features = ["derive"] }
# get non-standard i128 impls
xdrs = { workspace = true, features = ["extras"] }
thiserror.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
client = []
guest = []
mock = ["guest", "sdk/mock"]

[dev-dependencies]
playground = { path = ".", features = ["mock", "client"] }
