[package]
name = "exceptions"
version = "0.1.1"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[features]
dev = ["sdk/dev"]

# these are ignored
guest = []
client = []
mock = []

[dependencies]
sdk = { workspace = true }
xdrs = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
exceptions = { path = ".", features = ["dev"] }
