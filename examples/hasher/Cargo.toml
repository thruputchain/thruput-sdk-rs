[package]
name = "hasher"
version = "0.2.0"
edition = "2024"

[dependencies]
sdk = { workspace = true }
xdrs = { workspace = true }

# Optional
bottle-test-if = { workspace = true, optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[features]
dev = ["sdk/dev"]
bottle-test = ["dep:bottle-test-if", "sdk/storage"]

[dev-dependencies]
hasher = { path = ".", features = ["dev"] }
