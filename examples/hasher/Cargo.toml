[package]
name = "hasher"
version = "0.2.0"
edition = "2024"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
xdrs = { workspace = true }

# Optional
bottle-test-if = { workspace = true, optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[features]
client = []
guest = []
mock = ["guest", "sdk/mock"]
bottle-test = ["dep:bottle-test-if", "client"]

[dev-dependencies]
hasher = { path = ".", features = ["mock", "client"] }
