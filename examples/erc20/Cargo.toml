[package]
name = "erc20"
version = "0.2.1"
edition = "2024"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
groundhog-erc20-if = { workspace = true, features = ["storage"] }
thiserror = { workspace = true }
xdrs = { workspace = true, features = ["derive"] }

# Optional testing dependencies
erc20-bottle-test = { workspace = true, optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[features]
dev = ["sdk/dev", "groundhog-erc20-if/dev"]
bottle-test = ["dep:erc20-bottle-test"]

# ignored
client = []
guest = []
mock = []

[dev-dependencies]
erc20 = { path = ".", features = ["dev"] }
erc20-native-test.workspace = true
groundhog-xdr.workspace = true
sha2.workspace = true
