[package]
name = "erc20"
version = "0.1.2"
edition = "2024"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
groundhog-erc20-if = { workspace = true, features = ["storage"] }
thiserror = { workspace = true }
xdrs = { workspace = true, features = ["derive"] }

# Optional testing dependencies
erc20-bottle-test = { workspace = true, optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[features]
client = []
guest = []
mock = ["guest", "sdk/mock", "groundhog-erc20-if/mock"]
bottle-test = ["dep:erc20-bottle-test"]

[dev-dependencies]
erc20-native-test.workspace = true
sha2.workspace = true
groundhog_xdr.workspace = true
