[package]
name = "erc20"
version = "0.1.2"
edition = "2024"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
serde = { workspace = true, features = ["derive"] }
groundhog-erc20-if = { workspace = true, features = ["storage"] }
thiserror = { workspace = true }
xdrs = { workspace = true, features = ["derive"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
client = []
guest = []
mock = ["guest", "sdk/mock", "groundhog-erc20-if/mock"]
logging = ["sdk/logging"]

[dev-dependencies]
erc20 = { path = ".", features = ["mock", "client"] }
