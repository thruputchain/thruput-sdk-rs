[package]
name = "erc20"
version = "0.1.2"
edition = "2024"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
erc20-if = { workspace = true, features = ["client", "storage"] }
serde = { workspace = true, features = ["derive"] }
xdrs = { workspace = true, features = ["derive"] }
thiserror.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
client = ["erc20-if/client"]
guest = []
alloc = ["sdk/alloc"]
std = ["alloc", "sdk/std", "erc20-if/std"]
mock = ["guest", "std", "sdk/mock"]

[dev-dependencies]
erc20 = { path = ".", features = ["mock", "client"] }
