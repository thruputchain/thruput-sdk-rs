[package]
name = "fibonacci"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
serde = { workspace = true, features = ["derive"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = ["guest"]
client = []
guest = []
mock = ["guest", "sdk/mock"]

[dev-dependencies]
fibonacci = { path = ".", features = ["mock", "client"] }
