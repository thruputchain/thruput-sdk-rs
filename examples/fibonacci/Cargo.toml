cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "fibonacci"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
serde = { workspace = true, features = ["derive"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = ["guest"]
client = []
guest = []
mock = ["guest", "sdk/mock"]

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1
trim-paths = "all" # unstable
# also see rust flags set in .cargo/config.toml

[dev-dependencies]
fibonacci = { path = ".", features = ["mock", "client"] }
