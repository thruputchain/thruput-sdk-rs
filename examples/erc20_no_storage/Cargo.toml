[package]
name = "erc20_no_storage"
version = "0.1.1"
edition = "2024"

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }
thiserror = { workspace = true }
xdrs = { workspace = true, features = ["derive"] }
bottle-test-if = { workspace = true, optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
client = []
guest = []
mock = ["guest", "sdk/mock", "groundhog-erc20-if/mock"]
logging = ["sdk/logging"]
bottle-test = ["dep:bottle-test-if"]

[dev-dependencies]
erc20_no_storage = { path = ".", features = ["mock", "client"] }
