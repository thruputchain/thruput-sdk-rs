[package]
name = "erc20_no_storage"
version = "0.2.0"
edition = "2024"

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }
xdrs = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

# Optional testing dependencies
erc20-bottle-test = { workspace = true, optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
client = []
guest = []
mock = ["guest", "sdk/mock", "groundhog-erc20-if/mock"]
logging = ["sdk/logging"]
bottle-test = ["dep:erc20-bottle-test"]

[dev-dependencies]
erc20_no_storage = { path = ".", features = ["mock", "client"] }
erc20-native-test.workspace = true
