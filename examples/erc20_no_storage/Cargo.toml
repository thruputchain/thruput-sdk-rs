[package]
name = "erc20_no_storage"
version = "0.1.1"
edition = "2024"

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }
thiserror = { workspace = true }
xdrs = { workspace = true, features = ["derive"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
client = []
guest = []
mock = ["guest", "sdk/mock", "groundhog-erc20-if/mock"]
logging = ["sdk/logging"]

[dev-dependencies]
erc20_no_storage = { path = ".", features = ["mock", "client"] }

[[bin]]
name = "perf_test"
path = "bin/perf_test.rs"
required-features = ["mock", "client"]
