[package]
name = "erc20_no_storage"
version = "0.1.1"
edition = "2024"

[dependencies]
sdk = { workspace = true }
erc20-if = { workspace = true }
xdrs = { workspace = true, features = ["derive"] }
thiserror.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
client = []
guest = []
mock = ["guest", "sdk/mock", "erc20-if/mock"]

[dev-dependencies]
erc20_no_storage = { path = ".", features = ["mock", "client"] }
