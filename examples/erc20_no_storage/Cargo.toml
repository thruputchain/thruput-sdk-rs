[package]
name = "erc20_no_storage"
version = "0.3.0"
edition = "2024"

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }
xdrs = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

# Optional testing dependencies
erc20-bottle-test = { workspace = true, optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
dev = ["sdk/dev", "groundhog-erc20-if/dev"]
bottle-test = ["dep:erc20-bottle-test"]

# ignored
guest = []
client = []
mock = []

[dev-dependencies]
erc20_no_storage = { path = ".", features = ["dev"] }
erc20-native-test.workspace = true
