[package]
name = "simple_wallet_old"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
erc20 = { package = "erc20_low_level", path = "../erc20_low_level/", features = ["client"] }
groundhog-erc20-if = { workspace = true }
xdrs = { workspace = true, features = ["alloc"] }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
client = []
guest = []
mock = ["guest", "sdk/mock", "groundhog-erc20-if/mock"]
logging = ["sdk/logging"]

[dev-dependencies]
simple_wallet_old = { path = ".", features = ["mock", "client"] }
