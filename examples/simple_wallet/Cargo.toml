[package]
name = "simple_wallet_disabled"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true }
serde = { workspace = true }
erc20 = { package = "erc20_low_level", path = "../erc20_low_level/", features = ["client"] }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
client = []
guest = []
mock = ["guest", "sdk/mock"]

[dev-dependencies]
simple_wallet_disabled = { path = ".", features = ["mock", "client"] }
