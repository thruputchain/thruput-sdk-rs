[package]
name = "caller"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true }
serde = { workspace = true }
erc20 = { path = "../erc20", features = ["client", "alloc"] }

[lib]
crate-type = ["cdylib"]

[features]
client = []
guest = []
alloc = ["sdk/alloc"]
std = ["alloc", "sdk/std"]
mock = ["guest", "std", "sdk/mock"]

[dev-dependencies]
caller = { path = ".", features = ["mock", "client"] }
