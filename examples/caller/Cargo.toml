[package]
name = "caller"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true }
serde = { workspace = true }
erc20 = { path = "../erc20", features = ["client"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
client = []
guest = []
mock = ["guest", "sdk/mock"]

[dev-dependencies]
erc20 = { path = "../erc20", features = ["mock", "client"] }
caller = { path = ".", features = ["mock", "client"] }
