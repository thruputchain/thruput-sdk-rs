[package]
name = "caller"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
groundhog-erc20-if = { workspace = true, features = ["storage"] }
erc20 = { path = "../erc20" }
thiserror = { workspace = true }
xdrs = { workspace = true, features = ["derive"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
dev = ["erc20/dev", "sdk/dev", "groundhog-erc20-if/dev"]

# ignored
guest = []
mock = []
client = []

[dev-dependencies]
caller = { path = ".", features = ["dev"] }
