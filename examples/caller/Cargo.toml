[package]
name = "caller"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage", "dynamic_bufs"] }
groundhog-erc20-if = { workspace = true, features = ["storage"] }
erc20 = { path = "../erc20" }
thiserror = { workspace = true }
xdrs = { workspace = true, features = ["derive"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
guest = []
mock = ["guest", "sdk/mock", "groundhog-erc20-if/mock"]
logging = ["sdk/logging"]

[dev-dependencies]
caller = { path = ".", features = ["mock"] }
erc20 = { path = "../erc20", features = ["mock"] }
