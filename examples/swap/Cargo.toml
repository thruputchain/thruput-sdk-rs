[package]
name = "swap"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
primitive-types = { version = "0.13.1", default-features = false, features = ["serde_no_std"] }
sdk = { workspace = true, features = ["storage"] }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
# the ERC20 interface should be provided by the SDK
erc20 = { path = "../erc20" }

[features]
client = ["erc20/client"]
guest = ["erc20/guest"]
mock = ["guest", "sdk/mock"]

[dev-dependencies]
swap = { path = ".", features = ["mock", "client"] }
erc20 = { path = "../erc20", features = ["mock", "client"] }
