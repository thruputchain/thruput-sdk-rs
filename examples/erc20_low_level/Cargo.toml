[package]
name = "erc20_low_level"
version = "0.1.1"
edition = "2021"

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }
thiserror.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
client = []
guest = []
mock = ["guest", "sdk/mock", "groundhog-erc20-if/mock"]
logging = ["sdk/logging"]

[dev-dependencies]
erc20_low_level = { path = ".", features = ["mock", "client"] }
