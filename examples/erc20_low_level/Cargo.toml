[package]
name = "erc20_low_level"
version = "0.1.1"
edition = "2021"

[dependencies]
sdk = { workspace = true }
erc20-if = { workspace = true, features = ["client"] }
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
client = []
guest = []
mock = ["guest", "sdk/mock", "std"]
std = ["erc20-if/std"]

[dev-dependencies]
erc20_low_level = { path = ".", features = ["mock"] }
