cargo-features = ["trim-paths"] #unstable

[workspace]
resolver = "3"
members = [
    "contracts/authclaim_test",
    "contracts/calldata_raw",
    "contracts/calldata_wrapper",
    # "contracts/cxs_roundtrip",
    "contracts/default_wallet",
    "contracts/dev_wallet",
    "contracts/delegate_call_test",
    "contracts/deploy_and_transfer",
    "contracts/ed25519_verify_wrapper",
    "contracts/fibonacci",
    "contracts/fibonacci_call",
    "contracts/fibonacci_raw",
    "contracts/hash_bug",
    "contracts/htlc",
    "contracts/genesis_root",
    "contracts/itc_erc20",
    # "contracts/manual_revert_caller",
    # "contracts/manual_revert_test",
    "contracts/no_syscall_test",
    "contracts/nocontract_wallet",
    "contracts/payment_channel",
    "contracts/read_only_test",
    "contracts/return_fault_test",
    "contracts/rv32_smoke_counter",
    "contracts/sha256_raw",
    "contracts/sha256_wrapper",
    "contracts/simple_wallet",
    "contracts/simple_wallet_authclaim",
    "contracts/syscall_misc_tests",
    "contracts/tuple_return",
    # "contracts/txs_roundtrip",
    "contracts/view_gateway_test",
]

[workspace.package]
version = "0.2.0"
authors = ["Thruput Team"]
license = "Apache-2.0"
publish = ["thruput"]
repository = "https://github.com/groundhogchain/sdk_rs"
homepage = "https://github.com/groundhogchain/sdk_rs"
keywords = ["thruput"]
categories = ["blockchain"]
edition = "2024"

[workspace.dependencies]
thruput-sdk = { path = "../crates/sdk" , registry = "thruput", version = "=0.52.0" }
thruput-domain-separator = { path = "../crates/domain-separator", registry = "thruput", version = "=0.52.0", default-features = false }

thruput-erc20-if = { path = "../standard-interfaces/thruput-erc20", registry = "thruput", version = "=0.1.59" }

erc20-test = { path = "../standard-tests/erc20-test", registry = "thruput", version = "=0.52.0" }
erc20-bottle-test = { path = "../standard-tests/erc20-bottle-test", registry = "thruput", version = "=0.52.0" }
erc20-native-test = { path = "../standard-tests/erc20-native-test", registry = "thruput", version = "=0.52.0" }
bottle-test-if = { path = "../crates/bottle-test-if", registry = "thruput", version = "=0.52.0" }

# External groundhog dependencies
thruput-xdr = { registry = "thruput", version = "=0.56.0", features = ["xdrs", "syscalls"] }
thruput-syscall = { registry = "thruput", version = "=0.56.0" }

# External crates.io dependencies
sha2 = { version = "0.11.0", default-features = false }
thiserror = { version = "2.0.12", default-features = false }
hex-literal = "1.0.0"

[profile.release]
trim-paths = "all" # unstable
