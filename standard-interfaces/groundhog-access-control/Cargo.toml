[package]
name = "groundhog-access-control-if"
version = "0.1.40"
edition.workspace = true
publish.workspace = true
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
description = "Role-based access control standard interface for Groundhog smart contracts"
repository = "https://github.com/groundhogchain/sdk_rs"

[features]
dev = ["sdk/dev", "dep:thiserror"]

[dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.40.0" }
thiserror = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.40.0", features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
