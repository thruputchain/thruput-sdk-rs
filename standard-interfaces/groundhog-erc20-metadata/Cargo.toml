[package]
name = "groundhog-erc20-metadata-if"
version = "0.1.4"
edition.workspace = true
publish.workspace = true
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
description = "ERC20 standard interface for Groundhog smart contracts"
repository = "https://github.com/groundhogchain/sdk_rs"

[features]
alloc = ["groundhog-xdr/alloc", "heapless/alloc"]
dev = ["sdk/dev", "dep:thiserror"]

[dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.15.5" }
thiserror = { workspace = true, optional = true }
groundhog-xdr = { workspace = true }
heapless = { workspace = true }

[dev-dependencies]
groundhog-erc20-metadata-if = { path = ".", features = ["alloc"] }

[target.'cfg(all(not(target_family = "wasm"), not(target_arch = "riscv32")))'.dependencies]
sdk = { workspace = true, features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
