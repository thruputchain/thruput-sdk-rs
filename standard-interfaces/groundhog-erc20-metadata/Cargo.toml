[package]
name = "groundhog-erc20-metadata-if"
version = "0.1.50"
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description = "ERC20 metadata (name, symbol, decimals) standard interface for Groundhog smart contracts"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
alloc = ["groundhog-xdr/alloc", "heapless/alloc"]
dev = ["sdk/dev", "dep:thiserror"]

[dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.47.0" }
thiserror = { workspace = true, optional = true }
groundhog-xdr = { workspace = true }
heapless = { workspace = true }

[dev-dependencies]
groundhog-erc20-metadata-if = { path = ".", features = ["alloc"] }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.47.0", features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
