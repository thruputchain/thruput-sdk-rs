[package]
name = "groundhog-erc20-metadata-if"
version = "0.1.31"
edition.workspace = true
publish.workspace = true
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
description = "ERC20 metadata (name, symbol, decimals) standard interface for Groundhog smart contracts"
repository = "https://github.com/groundhogchain/sdk_rs"

[features]
alloc = ["groundhog-xdr/alloc", "heapless/alloc"]
dev = ["sdk/dev", "dep:thiserror"]

[dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.34.4" }
thiserror = { workspace = true, optional = true }
groundhog-xdr = { workspace = true }
heapless = { workspace = true }

[dev-dependencies]
groundhog-erc20-metadata-if = { path = ".", features = ["alloc"] }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.34.4", features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
