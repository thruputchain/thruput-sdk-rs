[package]
name = "thruput-erc20-metadata-if"
version = "0.1.56"
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description = "ERC20 metadata (name, symbol, decimals) standard interface for Thruput smart contracts"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
alloc = ["thruput-xdr/alloc", "heapless/alloc"]
dev = ["sdk/dev", "dep:thiserror"]

[dependencies]
sdk = { path = "../../crates/sdk", registry = "thruput", version = "0.51.1" }
thiserror = { workspace = true, optional = true }
thruput-xdr = { workspace = true }
heapless = { workspace = true }

[dev-dependencies]
thruput-erc20-metadata-if = { path = ".", features = ["alloc"] }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
sdk = { path = "../../crates/sdk", registry = "thruput", version = "0.51.1", features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
