[package]
name = "thruput-erc20-permit-if"
version = "0.1.57"
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description = "Wallet-authorized bounded transfers and signed allowances for Thruput ERC20 tokens"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
dev = ["thruput-sdk/dev", "dep:thiserror", "thruput-erc20-if/dev"]

[dependencies]
thruput-sdk = { path = "../../crates/sdk", registry = "thruput", version = "0.51.2" }
thruput-erc20-if = { path = "../thruput-erc20", registry = "thruput", version = "=0.1.57" }
thiserror = { workspace = true, optional = true }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
