[package]
name = "groundhog-sep41-if"
version = "0.1.42"
edition.workspace = true
publish.workspace = true
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
description = "SEP-41 token semantics for Groundhog contracts"
repository = "https://github.com/groundhogchain/sdk_rs"

[features]
entrypoints = []
dev = ["sdk/dev", "dep:thiserror", "groundhog-erc20-if/dev"]

[dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.41.0" }
groundhog-erc20-if.workspace = true
groundhog-erc20-metadata-if.workspace = true
thiserror = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.41.0", features = ["std"] }

[lib]
doctest = false

[[bin]]
name = "groundhog-sep41-if"
path = "src/main.rs"
required-features = ["entrypoints"]
