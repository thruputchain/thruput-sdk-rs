[package]
name = "bottle-test-if"
version = "0.1.0"
edition.workspace = true
publish = ["groundhog"]
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
description = "Bottle-test interface"
repository = "https://github.com/groundhogchain/sdk_rs"

[dependencies]
sdk = { path = "../..", registry = "groundhog", version = "=0.10.2" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
sdk = { path = "../..", registry = "groundhog", version = "=0.10.2", features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
dev = ["sdk/dev"]
