[package]
name = "groundhog-erc1271-if"
version = "0.1.0"
edition.workspace = true
publish = ["groundhog"]
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
description = "ERC1271 standard interface for Groundhog smart contracts"
repository = "https://github.com/groundhogchain/sdk_rs"

[features]
dev = ["sdk/dev"]

[dependencies]
sdk = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
sdk = { workspace = true, features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
