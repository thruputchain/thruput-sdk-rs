[package]
name = "groundhog-erc1271-if"
version = "0.1.4"
edition.workspace = true
publish.workspace = true
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
description = "ERC1271 standard interface for Groundhog smart contracts"
repository = "https://github.com/groundhogchain/sdk_rs"

[features]
dev = ["sdk/dev"]

[dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.16.0", features = ["alloc"] }
thiserror = { workspace = true }

[target.'cfg(all(not(target_family = "wasm"), not(target_arch = "riscv32")))'.dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.16.0", features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
