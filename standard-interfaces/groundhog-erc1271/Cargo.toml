[package]
name = "groundhog-erc1271-if"
version = "0.1.0"
edition.workspace = true
publish = ["groundhog"]
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
description = "ERC1271 standard interface for Groundhog smart contracts"
repository = "https://github.com/groundhogchain/sdk_rs"


[features]
dev = ["std", "sdk/dev"]
std = ["sdk/std"]
spec = ["sdk/spec", "std"]

[dependencies]
sdk = { workspace = true, registry = "groundhog", version = "=0.3.1" }
xdrs = { workspace = true, features = ["derive", "alloc"] }
thiserror = { workspace = true }

[[bin]]
name = "show_spec"
required-features = ["spec"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false
