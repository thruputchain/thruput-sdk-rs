[package]
name = "groundhog-erc1271-if"
version = "0.1.3"
edition.workspace = true
publish.workspace = true
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
description = "ERC1271 standard interface for Groundhog smart contracts"
repository = "https://github.com/groundhogchain/sdk_rs"

[features]
# Per-crate switch read by the #[contract] macro via cfg!(feature = "entrypoints").
entrypoints = []
dev = ["sdk/dev"]

[dependencies]
sdk = { workspace = true, features = ["alloc"] }
thiserror = { workspace = true }

[target.'cfg(all(not(target_family = "wasm"), not(target_arch = "riscv32")))'.dependencies]
sdk = { workspace = true, features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
