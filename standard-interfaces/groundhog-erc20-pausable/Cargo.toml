[package]
name = "groundhog-erc20-pausable-if"
version = "0.1.46"
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description = "ERC20 pausable-extension standard interface for Groundhog smart contracts"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
dev = ["sdk/dev", "dep:thiserror"]

[dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.44.0" }
thiserror = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.44.0", features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
