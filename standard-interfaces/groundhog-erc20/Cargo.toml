[package]
name = "groundhog-erc20-if"
version = "0.1.24"
edition.workspace = true
publish.workspace = true
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
description = "ERC20 standard interface for Groundhog smart contracts"
repository = "https://github.com/groundhogchain/sdk_rs"

[features]
# Selects the rv32 spec-carrier bin target (below). The trait's spec is
# target-gated and needs no feature; this only gates the carrier bin, built
# with `-F entrypoints` like every other contract's spec build. A plain
# `cargo build`/`test` skips the entry-point-less bin without it.
entrypoints = []
dev = ["sdk/dev", "dep:thiserror"]

[dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.31.0" }
thiserror = { workspace = true, optional = true }
groundhog-xdr = { workspace = true }

[dev-dependencies]
groundhog-erc20-if = { path = ".", features = ["dev"] }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.31.0", features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# rv32 spec carrier: builds the ERC20 interface on its own for spec extraction.
# `required-features` keeps a plain `cargo build`/`test` from building this
# rv32-only, entry-point-less binary.
[[bin]]
name = "groundhog-erc20-if"
path = "src/main.rs"
required-features = ["entrypoints"]
