[package]
name = "groundhog-erc20-if"
version = "0.1.3"
edition.workspace = true
publish.workspace = true
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
description = "ERC20 standard interface for Groundhog smart contracts"
repository = "https://github.com/groundhogchain/sdk_rs"

[features]
# Empty per-crate switch read by the #[contract] macro via
# cfg!(feature = "entrypoints"). Mirrors example-contracts/erc20. Must NOT be
# enabled by dependents' entrypoints features.
entrypoints = []
dev = ["sdk/dev", "dep:thiserror"]

[dependencies]
sdk = { workspace = true }
thiserror = { workspace = true, optional = true }
groundhog-xdr = { workspace = true }

[dev-dependencies]
groundhog-erc20-if = { path = ".", features = ["dev"] }
tempfile = "3"
groundhog-spec-tool = { workspace = true }

[target.'cfg(all(not(target_family = "wasm"), not(target_arch = "riscv32")))'.dependencies]
sdk = { workspace = true, features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "groundhog-erc20-if"
path = "src/main.rs"
required-features = ["entrypoints"]

