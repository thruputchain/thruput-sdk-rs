[package]
name = "groundhog-erc20-if"
version = "0.1.0"
edition.workspace = true
publish = ["groundhog"]
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
description = "ERC20 standard interface for Groundhog smart contracts"
repository = "https://github.com/groundhogchain/sdk_rs"

[features]
dev = ["sdk/dev"]
spec = ["sdk/spec"]
# Needs storage feature for error conversion from StorageError
storage = ["sdk/storage"]

[dependencies]
sdk = { path = "../..", registry = "groundhog", version = "=0.6.0" }
xdrs = { workspace = true, features = ["derive", "int128"] }
thiserror = { workspace = true }
groundhog-xdr = { workspace = true }

[dev-dependencies]
groundhog-erc20-if = { path = ".", features = ["dev"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
sdk = { path = "../..", registry = "groundhog", version = "=0.6.0", features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "generate_erc20_spec"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[[bin]]
name = "show_spec"
required-features = ["spec"]
