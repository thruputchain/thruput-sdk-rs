[package]
name = "groundhog-erc20-if"
version = "0.1.3"
edition.workspace = true
publish.workspace = true
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
description = "ERC20 standard interface for Groundhog smart contracts"
repository = "https://github.com/groundhogchain/sdk_rs"

[features]
# Selects the rv32 spec-carrier bin target (below); gates nothing else. A
# plain `cargo build`/`test` skips the entry-point-less bin without it.
carrier = []
dev = ["sdk/dev", "dep:thiserror"]

[dependencies]
sdk = { workspace = true }
thiserror = { workspace = true, optional = true }
groundhog-xdr = { workspace = true }

[dev-dependencies]
groundhog-erc20-if = { path = ".", features = ["dev"] }

[target.'cfg(all(not(target_family = "wasm"), not(target_arch = "riscv32")))'.dependencies]
sdk = { workspace = true, features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# rv32 spec carrier: builds the ERC20 interface on its own for spec extraction.
# `required-features` keeps a plain `cargo build`/`test` from building this
# rv32-only, entry-point-less binary.
[[bin]]
name = "groundhog-erc20-if"
path = "src/main.rs"
required-features = ["carrier"]

