[package]
name = "groundhog-erc20-if"
version = "0.1.0"
edition = "2021"
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
description = "ERC20 standard interface for Groundhog smart contracts"
repository = "https://github.com/groundhogchain/sdk_rs"


[features]
mock = ["std", "sdk/mock"]
std = ["sdk/std"]
spec = ["sdk/spec", "std"]
# Needs storage feature for error conversion from StorageError
storage = ["sdk/storage"]

[dependencies]
sdk = { workspace = true }
serde = { workspace = true, features = ["derive"] }
xdrs = { workspace = true, features = ["derive", "alloc", "extras", "int128_xdr"] }
thiserror = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "generate_erc20_spec"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]
