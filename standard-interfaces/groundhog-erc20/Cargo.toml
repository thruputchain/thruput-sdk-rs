[package]
name = "groundhog-erc20-if"
version.workspace = true
edition.workspace = true
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
description = "ERC20 standard interface for Groundhog smart contracts"
repository = "https://github.com/groundhogchain/sdk_rs"

[features]
mock = ["std", "sdk/mock"]
std = ["sdk/std"]
spec = ["sdk/spec", "std"]
# Needs storage feature for error conversion from StorageError
storage = ["sdk/storage"]

[dependencies]
sdk = { workspace = true }
xdrs = { workspace = true, features = ["derive", "extras", "int128_xdr"] }
thiserror = { workspace = true }

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "generate_erc20_spec"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[[bin]]
name = "show_spec"
required-features = ["spec"]
