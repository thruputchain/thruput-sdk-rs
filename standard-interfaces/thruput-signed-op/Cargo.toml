[package]
name = "thruput-signed-op-if"
version = "0.1.71"
edition.workspace = true
publish.workspace = true
exclude.workspace = true
authors.workspace = true
license.workspace = true
description = "Signed operation (off-chain authorization) standard interface for Thruput smart contracts"
repository.workspace = true
homepage.workspace = true
keywords = ["thruput", "smart-contracts", "signatures", "wallet"]
categories.workspace = true

[features]
# Selects the rv32 spec-carrier bin target (below), built with
# `-F entrypoints` like every other contract's spec build. A plain
# `cargo build`/`test` skips the entry-point-less bin without it.
entrypoints = []
dev = ["thruput-sdk/dev"]

[dependencies]
# No `alloc`: the interface returns one token, not a Vec, so a no-alloc
# contract can call a wallet and receive it. Only the verifying component
# (thruput-signed-op) allocates, to build the preimage.
thruput-sdk = { path = "../../crates/sdk", version = "0.58.0" }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
thruput-sdk = { path = "../../crates/sdk", version = "0.58.0", features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# rv32 spec carrier: builds the SignedOp interface on its own for spec
# extraction. `required-features` keeps a plain `cargo build`/`test` from
# building this rv32-only, entry-point-less binary.
[[bin]]
name = "thruput_signed_op_if"
path = "src/main.rs"
required-features = ["entrypoints"]
