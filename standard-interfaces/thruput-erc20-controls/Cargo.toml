[package]
name = "thruput-erc20-controls-if"
version = "0.1.56"
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description = "Optional issuer controls and holder burns for Thruput ERC20 tokens"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev", "dep:thiserror", "thruput-erc20-if/dev"]

[dependencies]
sdk = { path = "../../crates/sdk", registry = "thruput", version = "0.51.1" }
thruput-erc20-if.workspace = true
thruput-erc20-metadata-if.workspace = true
heapless.workspace = true
thiserror = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
sdk = { path = "../../crates/sdk", registry = "thruput", version = "0.51.1", features = ["std"] }

[lib]
doctest = false

[[bin]]
name = "thruput-erc20-controls-if"
path = "src/main.rs"
required-features = ["entrypoints"]
