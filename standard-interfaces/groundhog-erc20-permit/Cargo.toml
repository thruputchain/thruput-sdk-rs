[package]
name = "groundhog-erc20-permit-if"
version = "0.1.54"
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description = "Wallet-authorized bounded transfers and signed allowances for Groundhog ERC20 tokens"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
dev = ["sdk/dev", "dep:thiserror", "groundhog-erc20-if/dev"]

[dependencies]
sdk = { path = "../../crates/sdk", registry = "thruput", version = "0.50.1" }
groundhog-erc20-if = { path = "../groundhog-erc20", registry = "thruput", version = "=0.1.54" }
thiserror = { workspace = true, optional = true }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
