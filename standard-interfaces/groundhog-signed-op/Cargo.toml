[package]
name = "groundhog-signed-op-if"
version = "0.1.19"
edition.workspace = true
publish.workspace = true
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
description = "Signed operation (off-chain authorization) standard interface for Groundhog smart contracts"
repository = "https://github.com/groundhogchain/sdk_rs"

[features]
dev = ["sdk/dev"]

[dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.27.0", features = ["alloc"] }
groundhog-domain-separator = { path = "../../crates/domain-separator", registry = "groundhog", version = "=0.27.0", default-features = false, features = ["alloc"] }
groundhog-contract-spec = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.27.0", features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
