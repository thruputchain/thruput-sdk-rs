[package]
name = "thruput-access-control-if"
version = "0.1.57"
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description = "Role-based access control standard interface for Thruput smart contracts"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
dev = ["thruput-sdk/dev", "dep:thiserror"]

[dependencies]
thruput-sdk = { path = "../../crates/sdk", registry = "thruput", version = "0.51.2" }
thiserror = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
thruput-sdk = { path = "../../crates/sdk", registry = "thruput", version = "0.51.2", features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
