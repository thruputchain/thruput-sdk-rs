[package]
name = "thruput-access-control-if"
version = "0.1.71"
edition.workspace = true
publish.workspace = true
exclude.workspace = true
authors.workspace = true
license.workspace = true
description = "Role-based access control standard interface for Thruput smart contracts"
repository.workspace = true
homepage.workspace = true
keywords = ["thruput", "smart-contracts", "access-control"]
categories.workspace = true

[features]
dev = ["thruput-sdk/dev", "dep:thiserror"]

[dependencies]
thruput-sdk = { path = "../../crates/sdk", version = "0.58.0" }
thiserror = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
thruput-sdk = { path = "../../crates/sdk", version = "0.58.0", features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
