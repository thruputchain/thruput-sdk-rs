[package]
name = "groundhog-contract-spec"
authors.workspace = true
license.workspace = true
edition.workspace = true
version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Canonical contract spec model for Groundhog contracts"

# Read by the `groundhog` CLI via `cargo metadata` on a contract's resolved
# dependency graph, so build-time version skew is reported before compiling
# rather than as a fragment parse failure afterwards. Must match
# `format::RAW_SPEC_FORMAT`; `manifest_metadata_matches_raw_spec_format` pins
# the two together.
[package.metadata.groundhog]
raw_spec_format = 3

[lib]
crate-type = ["rlib"]

[features]
default = ["owned-model"]
alloc = ["xdrs/alloc"]
owned-model = ["alloc", "dep:groundhog-spec"]
serde = ["owned-model", "groundhog-spec/serde"]

[dependencies]
groundhog-xdr = { workspace = true }
groundhog-spec = { workspace = true, optional = true }
xdrs = { workspace = true, features = ["heapless", "derive"] }
xdr-common = { workspace = true }
heapless = { workspace = true }

[[test]]
name = "groundhog_xdr_refspec"
