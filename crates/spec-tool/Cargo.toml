[package]
name = "thruput-spec-tool"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Tools for reading, writing, and canonicalizing Thruput contract specs"

[lib]
path = "src/lib.rs"

[dependencies]
thruput-contract-spec = { workspace = true, features = ["alloc", "serde"] }
thruput-contract-util = { workspace = true }
thruput-erc20-if = { workspace = true }
thruput-erc20-pausable-if = { workspace = true }
thruput-access-control-if = { workspace = true }
thruput-signed-op-if = { workspace = true }
thruput-erc20-permit-if = { workspace = true }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = { workspace = true }
xdrs = { workspace = true, features = ["alloc"] }
sdk = { workspace = true, features = ["std"] }

[dev-dependencies]
tempfile = "3"
