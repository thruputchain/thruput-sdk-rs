[package]
name = "groundhog-spec-tool"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Tools for reading, writing, and embedding Groundhog contract specs in Wasm modules"

[lib]
path = "src/lib.rs"

[dependencies]
groundhog-contract-spec = { workspace = true, features = ["alloc", "serde"] }
groundhog-contract-util = { workspace = true }
groundhog-erc20-if = { workspace = true }
groundhog-erc1271-if = { workspace = true }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = { workspace = true }
xdrs = { workspace = true, features = ["alloc"] }
wasm-encoder = "0.252.0"
wasmparser = "0.252.0"
sdk = { workspace = true, features = ["std"] }

[dev-dependencies]
tempfile = "3"
