[package]
name = "groundhog-spec-tool"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Tools for reading, writing, and canonicalizing Groundhog contract specs"

[lib]
path = "src/lib.rs"

[dependencies]
groundhog-contract-spec = { workspace = true, features = ["alloc", "serde"] }
groundhog-contract-util = { workspace = true }
groundhog-erc20-if = { workspace = true }
groundhog-erc20-pausable-if = { workspace = true }
groundhog-access-control-if = { workspace = true }
groundhog-signed-op-if = { workspace = true }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = { workspace = true }
xdrs = { workspace = true, features = ["alloc"] }
sdk = { workspace = true, features = ["std"] }

[dev-dependencies]
tempfile = "3"
