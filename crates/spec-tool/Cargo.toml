[package]
name = "thruput-spec-tool"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["thruput", "smart-contracts", "abi"]
categories = ["cryptography::cryptocurrencies", "development-tools"]
description = "Tools for reading, writing, and canonicalizing Thruput contract specs"
# `specx` is a local debugging aid, not part of the published tool.
# Spelled out rather than inherited: a package `exclude` replaces the
# workspace one.
exclude = ["/tests", "src/bin/specx.rs"]

[lib]
path = "src/lib.rs"

[dependencies]
thruput-contract-spec = { workspace = true, features = ["alloc", "serde"] }
thruput-contract-util = { workspace = true }
thruput-erc20-if = { workspace = true }
thruput-erc20-pausable-if = { workspace = true }
thruput-access-control-if = { workspace = true }
thruput-signed-op-if = { workspace = true }
thruput-erc20-permit-if = { workspace = true }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = { workspace = true }
xdrs = { workspace = true, features = ["alloc"] }
thruput-sdk = { workspace = true, features = ["std"] }

[dev-dependencies]
tempfile = "3"
