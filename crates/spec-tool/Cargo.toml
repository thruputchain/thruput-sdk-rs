[package]
name = "groundhog-spec-tool"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Tools for reading, writing, and embedding Groundhog contract specs in Wasm modules"

[lib]
path = "src/lib.rs"

[dependencies]
groundhog-contract-spec = { workspace = true, features = ["alloc", "serde"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = { workspace = true }
xdrs = { workspace = true, features = ["alloc"] }
wasm-encoder = "0.246.2"
wasmparser = "0.246.2"
sdk = { workspace = true, features = ["std"] }
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std"] }

[dev-dependencies]
tempfile = "3"
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std", "write"] }
