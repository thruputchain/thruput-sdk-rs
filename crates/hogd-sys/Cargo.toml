[package]
name = "thruput-sys"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Bindings for the external Thruput test environment"
links = "thruput_test_ffi"

# This crate's checked-in docs bindings (docs-rs/bindings.rs) are
# generated for this target; their layout assertions would fail on docs.rs's
# 32-bit targets.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
crate-type = ["rlib"]

[features]
# Build the FFI library from source (used with HOGD_FFI_BUILD=1). Off by
# default so the prebuilt-download path doesn't carry cmake/bindgen in its
# build-dependency graph.
source-build = ["dep:cmake", "dep:bindgen"]

[dependencies]
thiserror = { version = "2.0.12", default-features = false }

[build-dependencies]
cmake = { version = "0.1", optional = true }
# Use bindgen's default rustfmt formatter; prettyplease 0.3 requires
# syn 3, while bindgen 0.73 uses syn 2.
bindgen = { version = "0.73", optional = true, default-features = false, features = ["logging", "runtime"] }
sha2 = { workspace = true }
fslock = "0.2"
