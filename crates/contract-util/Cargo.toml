[package]
name = "thruput-contract-util"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["thruput", "smart-contracts", "proc-macro"]
categories = ["cryptography::cryptocurrencies", "development-tools::procedural-macro-helpers"]
description = "Utility functions for contract development"

[dependencies]
thruput-xdr = { workspace = true, features = ["std", "xdrs"] }
sha2 = { workspace = true }
xdrs = { workspace = true }
syn = { optional = true, version = "3.0.3" , features = [ "full", "extra-traits", "visit", "printing", "fold" ] }

[features]
syn = ["dep:syn"]
