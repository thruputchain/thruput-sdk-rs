[package]
name = "sdk"
authors.workspace = true
license.workspace = true
edition.workspace = true
version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "SDK"
metadata.docs.rs.features = [
    "std",
]

[lib]
crate-type = ["rlib"]
doctest = true

[dependencies]
# Groundhog dependencies
groundhog-macros = { workspace = true }
groundhog-xdr = { workspace = true }
groundhog-event = { workspace = true }
groundhog-contract-spec = { workspace = true }
hogexec-internal = { workspace = true }
xdrs = { workspace = true, features = ["heapless"] }

# Optional Groundhog dependencies
groundhog-contract-util = { workspace = true, optional = true }
groundhog-storage-cost = { workspace = true, optional = true }
groundhog-native-exec = { workspace = true, optional = true }
groundhog-wasm-meter = { workspace = true, optional = true }

# External dependencies
thiserror = { workspace = true }
sha2 = { workspace = true, default-features = false }
heapless = { workspace = true }
linkme = { workspace = true, optional = true }

[dev-dependencies]
# When running tests, enable recommended development features
sdk = { path = ".", features = ["dev"] }

hex-literal = { workspace = true }
groundhog-contract-util = { workspace = true }
trybuild = "1"
version-mismatch-helper = { path = "tests/version-mismatch-helper" }

[features]
# Enable allocation features
alloc = [
    "groundhog-xdr/alloc",
    "xdrs/alloc",
    "groundhog-contract-spec/alloc",
    "groundhog-wasm-runtime/alloc",
    "groundhog-rv32-runtime/alloc",
]

# Include interfaces requiring std
std = ["alloc", "groundhog-xdr/std", "groundhog-contract-spec/owned-model"]

# Enable recommended development features
dev = [
    "debugging",
    "call_tracking",
    "dep:groundhog-storage-cost",
    "mock",
    ]

# Enable the mock executor for local testing
mock = [
    "std",
    "dep:groundhog-native-exec",
    "dep:groundhog-wasm-meter",
    "dep:groundhog-storage-cost",
    "groundhog-macros/mock",
    "groundhog-xdr/syscalls_mock",
    "dep:linkme",
]

# Forwarded to groundhog-sys (via native-exec): build the FFI library from
# source (HOGD_FFI_BUILD=1) instead of downloading a prebuilt binary.
source-build = ["groundhog-native-exec?/source-build"]

# Diagnostics (can be enabled without mock, alloc and std)
debugging = []
call_tracking = ["debugging"] # contract-call tracking

# Optional diagnostic features (not enabled by "dev")
logging = ["groundhog-macros/logging", "alloc"] # trace contract calls when testing
panic_logging = ["groundhog-wasm-runtime/panic_logging"] # send panic messages to the log() syscall

[[test]]
name = "int128"
required-features = ["std"]

# RV32 and WASM contracts use real syscalls into hogd. Host-native builds use
# the mock syscall implementation linked through native-exec.
[target.'cfg(any(target_family = "wasm", target_arch = "riscv32"))'.dependencies]
groundhog-xdr = { workspace = true, features = ["syscalls"] }

[target.'cfg(all(not(target_family = "wasm"), not(target_arch = "riscv32")))'.dependencies]
groundhog-xdr = { workspace = true, features = ["syscalls_mock"] }

# Guest runtimes: force-linked from lib.rs (`extern crate ... as _`) so
# contracts and the rv32 bin wrapper don't declare them. They are target-specific
# crates, so keep these dependencies target-gated and out of the host/test
# dependency graph.
[target.'cfg(target_arch = "wasm32")'.dependencies]
groundhog-wasm-runtime = { workspace = true }

[target.'cfg(target_arch = "riscv32")'.dependencies]
groundhog-rv32-runtime = { workspace = true }
linkme = { workspace = true }

[target.'cfg(not(any(target_family = "wasm", target_arch = "riscv32")))'.dependencies]
linkme = { workspace = true }
