[package]
name = "sdk"
authors.workspace = true
license.workspace = true
edition.workspace = true
version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "SDK"
metadata.docs.rs.features = [
    "std",
    "storage",
]

[dependencies]
groundhog-runtime.workspace = true

[lib]
crate-type = ["rlib"]

[features]
alloc         = ["groundhog-runtime/alloc"]
storage       = ["groundhog-runtime/storage"]
std           = ["groundhog-runtime/std"]
dev           = ["groundhog-runtime/dev"]
mock          = ["groundhog-runtime/mock"]
debugging     = ["groundhog-runtime/debugging"]
call_tracking = ["groundhog-runtime/call_tracking"]
logging       = ["groundhog-runtime/logging"]
panic_logging = ["groundhog-runtime/panic_logging"]
spec          = ["groundhog-runtime/spec"]
