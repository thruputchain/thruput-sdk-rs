[package]
name = "thruput-sdk"
authors.workspace = true
license.workspace = true
edition.workspace = true
version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Thruput smart-contract SDK for Rust (rv32 guest runtime and native test harness)"
readme = "../../README.md"

# Document the native test harness too: the crate docs teach it. `dev` pulls
# in thruput-sys, whose checked-in docs bindings are generated for this target.
[package.metadata.docs.rs]
features = ["dev", "remote"]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
crate-type = ["rlib"]
doctest = true

[dependencies]
# Thruput dependencies
thruput-macros = { workspace = true }
thruput-xdr = { workspace = true }
thruput-event = { workspace = true }
thruput-exn = { workspace = true }
thruput-contract-spec = { workspace = true }
thruput-u256 = { workspace = true }
xdrs = { workspace = true, features = ["heapless"] }

# Optional Thruput dependencies
# Host-only: the mock module re-exports its `ffi_enums` (see mock/mod.rs), and
# that is the crate's only use of it. Optional so a guest build does not
# compile it in.
thruput-trace = { workspace = true, optional = true }
thruput-contract-util = { workspace = true, optional = true }
thruput-storage-cost = { workspace = true, optional = true }
thruput-native-exec = { workspace = true, optional = true }

# External dependencies
thiserror = { workspace = true }
# Host-only: every use is behind `mock` or `cfg(test)` -- guests hash through
# the SHA256 syscall (`crypto::sha256`). Optional so a guest build cannot
# compile it in, and so any future non-test `use sha2::` fails loudly here
# rather than silently linking software SHA-256 into every contract.
sha2 = { workspace = true, default-features = false, optional = true }
heapless = { workspace = true }
linkme = { workspace = true, optional = true }

[dev-dependencies]
# When running tests, enable recommended development features
thruput-sdk = { path = ".", features = ["dev"] }

ed25519-dalek = "3"
hex-literal = { workspace = true }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"] }
thruput-contract-util = { workspace = true }
trybuild = "1"
version-mismatch-helper = { path = "tests/version-mismatch-helper" }

[features]
# Enable allocation features
alloc = [
    "thruput-u256/alloc",
    "thruput-xdr/alloc",
    "xdrs/alloc",
    "thruput-contract-spec/alloc",
    "thruput-rv32-runtime/alloc",
]

# Include interfaces requiring std
std = [
    "alloc",
    "thruput-u256/std",
    "thruput-xdr/std",
    "thruput-contract-spec/owned-model",
    "xdrs/detailed-errors",
]

# The mock executor, for testing contracts natively.
#
# This stays a feature, unlike the diagnostics that were folded into target
# gates: it does not change what a contract computes, it decides whether the
# native executor is in the dependency graph at all -- pulling
# `thruput-native-exec` and through it the hogd FFI library. Host crates
# that only read specs (`spec-tool`, `erc20-test`, the `*-if` crates) build
# `thruput-sdk` without it and should not have to fetch a shared object to do
# so.
#
# `syscalls_mock` and `linkme` are not listed: the host target table below
# supplies both unconditionally.
dev = [
    "std",
    "dep:thruput-native-exec",
    "dep:thruput-storage-cost",
    "dep:thruput-trace",
    "thruput-macros/mock",
    "dep:sha2",
]

# Remote proxies for off-chain callers: each `#[contract]` interface also
# generates `<Iface>Remote<I>`, which prepares invocations through a
# `remote::RemoteInvoker` such as a test harness. Host-only.
remote = ["std", "dep:thruput-contract-util", "thruput-macros/remote"]

# Forwarded to thruput-sys (via native-exec): build the FFI library from
# source (HOGD_FFI_BUILD=1) instead of downloading a prebuilt binary.
source-build = ["thruput-native-exec?/source-build"]

# Optional diagnostic features (not enabled by "dev")
logging = ["thruput-macros/logging", "alloc"] # trace contract calls when testing

[[test]]
name = "int128"
required-features = ["std"]

# Mock-executor misuse cases. Gated: without `mock` the APIs under test are
# absent, so the cases would fail to resolve instead of failing on the bound.
[[test]]
name = "remote"
required-features = ["remote"]

[[test]]
name = "compile_fail_mock"
required-features = ["dev"]

# RV32 contracts use real syscalls into hogd. Host-native builds use the mock
# syscall implementation linked through native-exec.
#
# `thruput-u256/nightly` rides the same gate: guest builds always run a
# nightly toolchain, so contracts get the exact `cfg(overflow_checks)` keying,
# while host builds of `thruput-sdk` (the CLI's spec-tool path) stay compilable
# on stable. Resolver v2+ keeps features of an inactive target's dependencies
# out of unification, so this cannot leak into host builds.
#
# The guest runtime is force-linked from lib.rs (`extern crate ... as _`) so
# contracts and the rv32 bin wrapper don't declare it. It is a target-specific
# crate, so it stays target-gated and out of the host/test dependency graph.
[target.'cfg(target_arch = "riscv32")'.dependencies]
thruput-xdr = { workspace = true, features = ["syscalls"] }
thruput-u256 = { workspace = true, features = ["nightly"] }
thruput-rv32-runtime = { workspace = true }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
thruput-xdr = { workspace = true, features = ["syscalls_mock"] }
# Diagnostics are host-only (see `exn::fault` and `diagnostics`): the
# `Display` impls on the exception types and the formatting they need are
# gated on this same target, so a guest never builds either. Keeping the
# features here rather than behind a Cargo feature is what makes that
# guarantee unconditional -- no dependency can turn them on for a contract.
thruput-u256 = { workspace = true, features = ["fmt"] }
# Host-only: backs the storage-domain uniqueness registry (STORAGE_DOMAINS),
# cfg-gated out of guest builds — see storage/domain_registry.rs.
linkme = { workspace = true }
