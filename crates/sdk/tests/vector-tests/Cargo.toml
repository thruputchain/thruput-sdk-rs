[package]
name = "vector-tests"
description = "Test contract exercising Vector storage type"
version.workspace = true
authors.workspace = true
license.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[dependencies]
sdk = { workspace = true }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
sdk = { workspace = true, features = ["std"] }

[dev-dependencies]
vector-tests = { path = ".", features = ["dev"] }
