[package]
name = "groundhog-wasm-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Bare-metal WASM runtime support for Groundhog contracts: panic handler and global allocator"

[lib]
crate-type = ["rlib"]

[features]
default = []
# Format the panic message and send it to the host via the ConsoleLog
# syscall before trapping. Forwarded from `sdk`'s feature of the same name.
panic_logging = []

# The runtime is only ever linked into wasm contracts. Its deps (and all of
# its code) are gated on the wasm target, so the crate is empty — and
# dependency-free — on every other target. This mirrors groundhog-rv32-runtime
# and lets `sdk` depend on it unconditionally.
[target.'cfg(target_family = "wasm")'.dependencies]
groundhog-xdr = { workspace = true, features = ["syscalls"] }
heapless = { workspace = true }
