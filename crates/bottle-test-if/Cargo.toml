[package]
name = "bottle-test-if"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
description = "Bottle-test interface"
repository = "https://github.com/groundhogchain/sdk_rs"

[dependencies]
sdk = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
sdk = { workspace = true, features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
# Per-crate switch read by the #[contract] macro via cfg!(feature = "entrypoints").
entrypoints = []
dev = ["sdk/dev"]
