[package]
name = "groundhog-native-exec"
edition.workspace = true
version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
authors.workspace = true
description = "Native execution environment for testing Groundhog smart contracts"

[lib]
crate-type = ["rlib"]

[features]
# If this feature is enabled, then the groundhog-native-exec crate will be built with
# wasm backtraces enabled.  Those will be largely meaningless unless you also
# build contracts with minimal debug info (line numbers and function names).
# 
# This feature also turns on the logging feature in the contracts that are built in integration_test/contracts
# within hogexec.  The only contract for which that is relevant for the SDK is the initial_token_claim contract,
# in that this feature will change the gas consumption (and hash) of that contract.
#
# Currently is only available with build from source enabled.
wasm_backtraces = ["groundhog-sys/wasm_backtraces"]

# Forwarded to groundhog-sys: build the FFI library from source
# (HOGD_FFI_BUILD=1) instead of downloading a prebuilt binary.
source-build = ["groundhog-sys/source-build"]

[dependencies]
groundhog-event = { workspace = true }
groundhog-xdr = { workspace = true, features = ["std", "xdrs", "syscalls_mock"]}
xdr-common = { workspace = true, features = ["alloc"]}
hogexec-internal = { workspace = true, features = ["std"] }
xdrs = { workspace = true }
sha2 = { version = "0.11.0" }
groundhog-sys = { workspace = true }
groundhog-storage-cost = { workspace = true }
groundhog-trace = { workspace = true }

[dev-dependencies]
ed25519-dalek = { version = "3" }
groundhog-domain-separator = { workspace = true }

[lints.clippy]
let_and_return = "allow"
