[package]
name = "thruput-native-exec"
edition.workspace = true
version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["thruput", "smart-contracts", "testing", "riscv"]
categories = ["cryptography::cryptocurrencies", "development-tools::testing"]
license.workspace = true
authors.workspace = true
description = "Native execution environment for testing Thruput smart contracts"

# thruput-sys's checked-in docs bindings are generated for this
# target; their layout assertions would fail on docs.rs's
# 32-bit targets.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
crate-type = ["rlib"]

[features]
# Forwarded to thruput-sys: build the FFI library from source
# (HOGD_FFI_BUILD=1) instead of downloading a prebuilt binary.
source-build = ["thruput-sys/source-build"]

[dependencies]
thruput-event = { workspace = true }
thruput-exn = { workspace = true }
thruput-xdr = { workspace = true, features = ["std", "xdrs", "syscalls_mock"]}
xdr-common = { workspace = true, features = ["alloc"]}
xdrs = { workspace = true }
sha2 = { version = "0.11.0" }
thruput-sys = { workspace = true }
thruput-storage-cost = { workspace = true }
thruput-trace = { workspace = true, features = ["std"] }

[dev-dependencies]
ed25519-dalek = { version = "3" }
thruput-domain-separator = { workspace = true }

[lints.clippy]
let_and_return = "allow"
