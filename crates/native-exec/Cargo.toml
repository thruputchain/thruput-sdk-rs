[package]
name = "groundhog-native-exec"
edition.workspace = true
version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
authors.workspace = true
description = "Native execution environment for testing Groundhog smart contracts"

[lib]
crate-type = ["rlib"]

[features]
# Forwarded to groundhog-sys: build the FFI library from source
# (HOGD_FFI_BUILD=1) instead of downloading a prebuilt binary.
source-build = ["groundhog-sys/source-build"]

[dependencies]
groundhog-event = { workspace = true }
groundhog-xdr = { workspace = true, features = ["std", "xdrs", "syscalls_mock"]}
xdr-common = { workspace = true, features = ["alloc"]}
hogexec-internal = { workspace = true, features = ["std"] }
xdrs = { workspace = true }
sha2 = { version = "0.11.0" }
groundhog-sys = { workspace = true }
groundhog-storage-cost = { workspace = true }
groundhog-trace = { workspace = true }
# For naming known abort selectors in assertion messages; depending on
# `sdk` or `spec-tool` from here would be a dependency cycle.
groundhog-contract-util = { workspace = true }

[dev-dependencies]
ed25519-dalek = { version = "3" }
groundhog-domain-separator = { workspace = true }

[lints.clippy]
let_and_return = "allow"
