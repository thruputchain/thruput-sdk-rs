[package]
name = "macros-crate-override-guest"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# Deliberately no `sdk`: this package stands in for a crate that sits BELOW
# `sdk` in the dependency graph, which is the whole point of
# `#[contract_type_spec(crate = "...")]`. Same dependency set as
# `crates/macros/tests/crate_override.rs`, which covers the host side.
[dependencies]
groundhog-macros = { workspace = true }
groundhog-contract-spec = { workspace = true }
xdrs = { workspace = true }
