[package]
name = "groundhog-macros"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Macros for smart contract development"

[lib]
proc-macro = true

[dependencies]
groundhog-contract-util = { workspace = true, features = ["syn"] }
darling = "0.24"
proc-macro2 = "1.0.92"
quote = "1.0.38"
sha2 = { workspace = true }
syn = { version = "3.0.3" , features = [ "full" , "extra-traits", "visit", "printing", "fold" ] }
groundhog-xdr = { workspace = true, features = ["std", "xdrs"] }

# `tests/crate_override.rs` stands in for a crate that sits below `sdk` in the
# dependency graph. Deliberately no `sdk` here: that the test compiles at all is
# the proof `#[contract_type_spec(crate = "...")]` breaks the cycle.
[dev-dependencies]
groundhog-contract-spec = { workspace = true }
xdrs = { workspace = true }

[features]
logging = []

# Don't inline `*_internal` methods directly into their exported entrypoints.
# (Not recommended except when decompiling, where method names are inscrutable.)
no_inline_methods = []

# generate test-registration in contract-macro
mock = ["groundhog-xdr/syscalls_mock"]
