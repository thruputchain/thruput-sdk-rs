[package]
name = "groundhog-macros"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Macros for smart contract development"

[lib]
proc-macro = true

[dependencies]
groundhog-contract-util = { workspace = true, features = ["syn"] }
darling = "0.20.10"
proc-macro2 = "1.0.92"
quote = "1.0.38"
sha2 = { workspace = true }
syn = { version = "2.0.93" , features = [ "full" , "extra-traits", "visit", "printing", "fold" ] }
groundhog-xdr = { workspace = true, features = ["std", "xdrs"] }

[features]
logging = []
storage = []

# Don't inline `*_internal` methods directly into their exported entrypoints.
# (Not recommended except when decompiling, where method names are inscrutable.)
no_inline_methods = []

# generate test-registration in contract-macro
mock = ["groundhog-xdr/syscalls_mock"]
