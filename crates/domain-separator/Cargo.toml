[package]
name = "groundhog-domain-separator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Domain-separated hash derivation for Groundhog (pubkey account addresses, etc.)"

[lib]
crate-type = ["rlib"]

[dependencies]
groundhog-xdr = { workspace = true, features = ["xdrs"] }
xdrs = { workspace = true, features = ["derive"] }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
hex-literal = { workspace = true }

[features]
default = ["std"]
std = ["alloc", "sha2", "groundhog-xdr/std"]
alloc = ["xdrs/alloc", "groundhog-xdr/alloc"]
sha2 = ["dep:sha2"]
syscall = ["groundhog-xdr/syscalls"]
# Gives `syscall` a dispatch path on the host, where `groundhog-xdr/syscalls`
# has none. Needed by anything running a contract frame natively (native-exec)
# and by host `--all-features` builds, which enable `syscall` unconditionally.
syscall-mock = ["syscall", "groundhog-xdr/syscalls_mock"]

[lints]
workspace = true
