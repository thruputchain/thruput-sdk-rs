[package]
name = "thruput-domain-separator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Domain-separated hash derivation for Thruput (pubkey account addresses, etc.)"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["rlib"]

[dependencies]
thruput-contract-spec = { workspace = true }
thruput-xdr = { workspace = true, features = ["xdrs"] }
xdrs = { workspace = true, features = ["derive"] }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
thruput-macros = { workspace = true }
hex-literal = { workspace = true }

[features]
default = ["std"]
std = ["alloc", "sha2", "thruput-xdr/std"]
alloc = ["xdrs/alloc", "thruput-xdr/alloc", "thruput-contract-spec/alloc"]
sha2 = ["dep:sha2"]
syscall = ["thruput-xdr/syscalls"]
# Gives `syscall` a dispatch path on the host, where `thruput-xdr/syscalls`
# has none. Needed by anything running a contract frame natively (native-exec)
# and by host `--all-features` builds, which enable `syscall` unconditionally.
syscall-mock = ["syscall", "thruput-xdr/syscalls_mock"]
