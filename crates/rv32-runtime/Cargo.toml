[package]
name = "groundhog-rv32-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Bare-metal RV32 runtime support for Groundhog contracts: _start, panic handler, allocator, linker script"

# Build script publishes link args to bin crates that depend on us, and
# re-runs when the linker script changes.
build = "build.rs"

[lib]
crate-type = ["rlib"]

[features]
default = []
# Install the bump `#[global_allocator]`. Forwarded from `sdk`'s `alloc`
# feature so contracts that don't allocate don't carry an allocator.
alloc = []

[dependencies]
# Intentionally minimal. The runtime is target-specific glue; we want to
# keep its dep graph small so it builds fast and is easy to audit.

# Guest dispatch registry: each #[contract] method self-registers into a
# distributed_slice the `_start` dispatcher scans. This exact pin
# (default features) was spike-verified to link on bare-metal rv32 with
# --gc-sections + strip + LTO. Do not trim features without re-spiking.
#
# Section-name coupling: link/groundhog-rv32.ld places linkme's
# `linkme_*`/`linkm2_*` input sections (an internal naming scheme, not a
# documented linkme API) into .rodata via explicit __start_/__stop_ symbols.
# A linkme bump that renames those sections would silently drop the dispatch
# table. Cargo.lock pins the exact patch; scripts/check-rv32-dispatch.sh
# guards against a silently-empty table. Re-spike on any linkme version bump.
[target.'cfg(target_arch = "riscv32")'.dependencies]
linkme = "0.3"
