[package]
name = "thruput-rv32-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["thruput", "smart-contracts", "riscv", "runtime"]
categories = ["cryptography::cryptocurrencies", "embedded", "no-std::no-alloc"]
description = "Bare-metal RV32 runtime support for Thruput contracts: _start, panic handler, allocator, linker script"

# Build script publishes link args to bin crates that depend on us, and
# re-runs when the linker script changes.
build = "build.rs"

# The entry point, panic handler and allocator compile only for the guest
# target.
[package.metadata.docs.rs]
default-target = "riscv32im-unknown-none-elf"
targets = ["riscv32im-unknown-none-elf"]

[lib]
crate-type = ["rlib"]

[features]
default = []
# Install the bump `#[global_allocator]`. Forwarded from `thruput-sdk`'s
# `alloc` feature so contracts that don't allocate don't carry an allocator.
alloc = []

[dependencies]
# Intentionally minimal. The runtime is target-specific glue; we want to
# keep its dep graph small so it builds fast and is easy to audit.
