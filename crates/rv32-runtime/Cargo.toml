[package]
name = "thruput-rv32-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Bare-metal RV32 runtime support for Thruput contracts: _start, panic handler, allocator, linker script"

# Build script publishes link args to bin crates that depend on us, and
# re-runs when the linker script changes.
build = "build.rs"

[lib]
crate-type = ["rlib"]

[features]
default = []
# Install the bump `#[global_allocator]`. Forwarded from `sdk`'s `alloc`
# feature so contracts that don't allocate don't carry an allocator.
alloc = []

[dependencies]
# Intentionally minimal. The runtime is target-specific glue; we want to
# keep its dep graph small so it builds fast and is easy to audit.
