[package]
name = "groundhog-u256"
authors.workspace = true
license.workspace = true
edition.workspace = true
version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "256-bit unsigned integer for Groundhog contracts, with a 32-bit-native representation"

[lib]
crate-type = ["rlib"]

[dependencies]
groundhog-contract-spec = { workspace = true }
# Used only for `#[derive(ContractTypeSpec)]`, via its `crate = "..."` override
# (PR #337). Depending on `sdk` for the same derive would be a cycle, since
# `sdk` depends on this crate.
groundhog-macros = { workspace = true }
xdrs = { workspace = true }

[dev-dependencies]
# Self-dependency, to turn features on for tests only. The crate defaults to
# `no_std` (see `[features]`), but the differential tests exercise `Display`
# and `FromStr`, so a plain `cargo test` has to build with `std` and `fmt`.
# Gating those tests on the features instead would let them silently stop
# running.
#
# Side effect: feature unification means every `cargo test -p groundhog-u256`
# builds the lib with `std` + `fmt`, and `--no-default-features` is silently a
# no-op for tests -- the no-feature guest config is only ever *compiled*, never
# tested. `test_package` in scripts/dev.sh keeps a
# `cargo check --no-default-features` alongside the tests so that config
# cannot rot unnoticed.
groundhog-u256 = { path = ".", features = ["std", "fmt"] }
# Oracle only. Parity's `uint` is the implementation this crate replaces;
# the differential tests assert we agree with it everywhere. It must never
# become a normal dependency -- its u64 limbs and u128 intermediates are the
# whole reason this crate exists.
uint = { version = "0.10.0", default-features = false }
# Integration tests link dev-dependencies, not the lib's normal dependencies,
# so the XDR round-trip tests need their own handle on xdrs.
xdrs = { workspace = true, features = ["alloc"] }
# Likewise: the ABI-pinning test names spec types directly.
groundhog-contract-spec = { workspace = true }

[features]
# No default features: this crate is built into contracts, and a guest build
# that picks up `std` by accident does not link. Hosts opt in with
# `features = ["std"]`.
default = []
std = ["alloc", "fmt", "groundhog-contract-spec/alloc", "xdrs/alloc"]
alloc = ["xdrs/alloc"]

# Decimal and hex formatting (`Display`, `FromStr`, `LowerHex`, `UpperHex`).
#
# Off by default in guest builds: `Display`/`FromStr` need a repeated
# decimal-division loop and its rodata, which no release contract should be
# paying for. `Debug` is NOT behind this feature -- see `fmt.rs`.
fmt = []
