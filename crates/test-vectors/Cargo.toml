[package]
name = "thruput-test-vectors"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
exclude.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["thruput", "smart-contracts", "test-vectors"]
categories = ["cryptography::cryptocurrencies", "development-tools::testing"]
description = "Generate cross-language test vectors for Thruput SDK types"

[dependencies]
xdrs = { workspace = true, features = ["derive", "alloc", "int128"] }
thruput-xdr = { workspace = true, features = ["std", "xdrs"] }
thruput-contract-spec = { workspace = true }
thruput-macros = { workspace = true }
thruput-contract-util = { workspace = true }
thruput-domain-separator = { workspace = true }
serde_json = "1"
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"] }
ed25519-dalek = "3"
sha2 = { workspace = true }

[dev-dependencies]
thruput-native-exec = { workspace = true }
