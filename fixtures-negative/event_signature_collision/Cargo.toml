[package]
name = "event_signature_collision"
description = "Negative spec fixture: two events share a signature, so canonicalization must reject them"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact, built by name from gnaw's
# fixtures-negative:event-signature-conflict task.
[[bin]]
name = "event_signature_collision"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
thruput-sdk = { workspace = true }

[dev-dependencies]
event_signature_collision = { path = ".", features = ["dev"] }
