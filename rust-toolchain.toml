[toolchain]
# see doc: https://rust-lang.github.io/rustup/overrides.html

channel = "nightly-2026-07-01"

# x86_64-unknown-linux-gnu: scripts/check-docsrs.sh documents the crates
# whose docs.rs builds are pinned to it, on any host.
targets = ["riscv32im-unknown-none-elf", "x86_64-unknown-linux-gnu"]
# (in addition to host target)

profile = "default"
# "minimal" components: rustc, rust-std, cargo
# "default" components: "minimal" + rust-docs, rustfmt, clippy

components = ["rust-src"] # needed for build-std
# (in addition to components from profile)
