[package]
name = "thruput-access-control"
version = "0.1.71"
edition.workspace = true
publish.workspace = true
exclude.workspace = true
authors.workspace = true
license.workspace = true
description = "Embeddable role-based access control implementation for Thruput smart contracts"
repository.workspace = true
homepage.workspace = true
keywords = ["thruput", "smart-contracts", "access-control"]
categories.workspace = true

[features]
dev = ["thruput-sdk/dev", "thruput-access-control-if/dev"]

[dependencies]
thruput-sdk = { path = "../../crates/sdk", version = "0.58.0" }
thruput-access-control-if = { path = "../../standard-interfaces/thruput-access-control", version = "=0.1.71" }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
thruput-sdk = { path = "../../crates/sdk", version = "0.58.0", features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
