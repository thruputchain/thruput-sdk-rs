[package]
name = "thruput-access-control"
version = "0.1.56"
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description = "Embeddable role-based access control implementation for Thruput smart contracts"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
dev = ["sdk/dev", "thruput-access-control-if/dev"]

[dependencies]
sdk = { path = "../../crates/sdk", registry = "thruput", version = "0.51.1" }
thruput-access-control-if = { path = "../../standard-interfaces/thruput-access-control", registry = "thruput", version = "=0.1.56" }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
sdk = { path = "../../crates/sdk", registry = "thruput", version = "0.51.1", features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
