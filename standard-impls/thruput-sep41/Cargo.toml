[package]
name = "thruput-sep41"
version = "0.1.59"
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description = "SEP-41 token operations as client code over the Thruput ERC20 interfaces"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
dev = ["thruput-sdk/dev", "dep:thiserror", "thruput-erc20-if/dev", "thruput-erc20-controls-if/dev", "thruput-erc165-if/dev"]

[dependencies]
thruput-sdk = { path = "../../crates/sdk", registry = "thruput", version = "0.52.0" }
thruput-erc20-if = { path = "../../standard-interfaces/thruput-erc20", registry = "thruput", version = "=0.1.59" }
thruput-erc20-controls-if = { path = "../../standard-interfaces/thruput-erc20-controls", registry = "thruput", version = "=0.1.59" }
thruput-erc20-metadata-if = { path = "../../standard-interfaces/thruput-erc20-metadata", registry = "thruput", version = "=0.1.59" }
thruput-erc165-if = { path = "../../standard-interfaces/thruput-erc165", registry = "thruput", version = "=0.1.59" }
thiserror = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
thruput-sdk = { path = "../../crates/sdk", registry = "thruput", version = "0.52.0", features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
