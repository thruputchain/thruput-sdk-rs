[package]
name = "thruput-sep41"
version = "0.1.71"
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description = "SEP-41 token operations as client code over the Thruput ERC20 interfaces"
repository.workspace = true
homepage.workspace = true
keywords = ["thruput", "smart-contracts", "sep41", "token"]
categories.workspace = true

[features]
dev = ["thruput-sdk/dev", "dep:thiserror", "thruput-erc20-if/dev", "thruput-erc20-controls-if/dev", "thruput-erc165-if/dev"]

[dependencies]
thruput-sdk = { path = "../../crates/sdk", version = "0.58.0" }
thruput-erc20-if = { path = "../../standard-interfaces/thruput-erc20", version = "=0.1.71" }
thruput-erc20-controls-if = { path = "../../standard-interfaces/thruput-erc20-controls", version = "=0.1.71" }
thruput-erc20-metadata-if = { path = "../../standard-interfaces/thruput-erc20-metadata", version = "=0.1.71" }
thruput-erc165-if = { path = "../../standard-interfaces/thruput-erc165", version = "=0.1.71" }
thiserror = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
thruput-sdk = { path = "../../crates/sdk", version = "0.58.0", features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
