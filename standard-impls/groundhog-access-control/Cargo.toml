[package]
name = "groundhog-access-control"
version = "0.1.49"
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description = "Embeddable role-based access control implementation for Groundhog smart contracts"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
dev = ["sdk/dev", "groundhog-access-control-if/dev"]

[dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.46.0" }
groundhog-access-control-if = { path = "../../standard-interfaces/groundhog-access-control", registry = "groundhog", version = "=0.1.49" }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.46.0", features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
