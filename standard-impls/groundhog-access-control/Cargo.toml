[package]
name = "groundhog-access-control"
version = "0.1.42"
edition.workspace = true
publish.workspace = true
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
description = "Embeddable role-based access control implementation for Groundhog smart contracts"
repository = "https://github.com/groundhogchain/sdk_rs"

[features]
dev = ["sdk/dev", "groundhog-access-control-if/dev"]

[dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.41.0" }
groundhog-access-control-if = { path = "../../standard-interfaces/groundhog-access-control", registry = "groundhog", version = "=0.1.42" }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.41.0", features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
