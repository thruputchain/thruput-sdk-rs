[package]
name = "groundhog-sep41"
version = "0.1.45"
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description = "SEP-41 token operations as client code over the Groundhog ERC20 interfaces"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
dev = ["sdk/dev", "dep:thiserror", "groundhog-erc20-if/dev", "groundhog-erc20-controls-if/dev", "groundhog-erc165-if/dev"]

[dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.43.0" }
groundhog-erc20-if = { path = "../../standard-interfaces/groundhog-erc20", registry = "groundhog", version = "=0.1.45" }
groundhog-erc20-controls-if = { path = "../../standard-interfaces/groundhog-erc20-controls", registry = "groundhog", version = "=0.1.45" }
groundhog-erc20-metadata-if = { path = "../../standard-interfaces/groundhog-erc20-metadata", registry = "groundhog", version = "=0.1.45" }
groundhog-erc165-if = { path = "../../standard-interfaces/groundhog-erc165", registry = "groundhog", version = "=0.1.45" }
thiserror = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.43.0", features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
