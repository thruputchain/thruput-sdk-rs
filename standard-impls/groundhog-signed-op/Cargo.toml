[package]
name = "groundhog-signed-op"
version = "0.1.22"
edition.workspace = true
publish.workspace = true
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
description = "Embeddable signed-operation verification and nonce state for Groundhog smart contracts"
repository = "https://github.com/groundhogchain/sdk_rs"

[features]
dev = ["sdk/dev", "groundhog-signed-op-if/dev"]

[dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.30.0", features = ["alloc"] }
groundhog-signed-op-if = { path = "../../standard-interfaces/groundhog-signed-op", registry = "groundhog", version = "=0.1.22" }
groundhog-domain-separator = { path = "../../crates/domain-separator", registry = "groundhog", version = "=0.30.0", default-features = false, features = ["alloc"] }
groundhog-contract-spec = { workspace = true }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.30.0", features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
