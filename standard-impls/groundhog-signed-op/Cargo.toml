[package]
name = "groundhog-signed-op"
version = "0.1.43"
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description = "Embeddable signed-operation verification and nonce state for Groundhog smart contracts"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
dev = ["sdk/dev", "groundhog-signed-op-if/dev"]

[dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.42.0", features = ["alloc"] }
groundhog-signed-op-if = { path = "../../standard-interfaces/groundhog-signed-op", registry = "groundhog", version = "=0.1.43" }
groundhog-domain-separator = { path = "../../crates/domain-separator", registry = "groundhog", version = "0.42.0", default-features = false, features = ["alloc"] }
groundhog-contract-spec = { path = "../../crates/contract-spec", registry = "groundhog", version = "0.42.0", default-features = false }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
sdk = { path = "../../crates/sdk", registry = "groundhog", version = "0.42.0", features = ["std"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false
