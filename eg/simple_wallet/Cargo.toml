[package]
name = "simple_wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true }
serde = { workspace = true }
erc20 = { package = "erc20_low_level", path = "../erc20_low_level/", features = ["client", "alloc"] }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
client = []
guest = []
alloc = ["sdk/alloc"]
std = ["alloc", "sdk/std"]
mock = ["guest", "std", "sdk/mock"]

[dev-dependencies]
simple_wallet = { path = ".", features = ["mock", "client"] }
