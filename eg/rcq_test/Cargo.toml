[package]
name = "rcq_test"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
client = []
guest = []
alloc = ["sdk/alloc"]
std = ["alloc", "sdk/std"]
mock = ["guest", "std", "sdk/mock"]

[dev-dependencies]
rcq_test = { path = ".", features = ["mock", "client"] }
