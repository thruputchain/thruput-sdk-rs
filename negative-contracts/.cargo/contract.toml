# Layered on by `thruput build`, which resolves this path relative to the
# WORKSPACE ROOT — so it belongs here beside config.toml, not in a member's
# own .cargo/. (example-contracts/.cargo/contract.toml serves its members the
# same way. dup_entrypoint_neg keeps its copy inside the package only because
# that package IS its own workspace root, so the two locations coincide there
# — it is not evidence for the package-relative rule.)
#
# Layered on for every contract build, and by a manual
#
#    cargo --config .cargo/contract.toml --release build
#
# This file exists to hold `[unstable] build-std` OUT of .cargo/config.toml:
# that config also applies to host `cargo test` runs from this directory, and
# build-std without --target fails them.
#
# Keep it to `[unstable]`. Cargo JOINS `[target.*]` rustflags across the
# config chain, so a flag repeated here and in .cargo/config.toml is passed
# twice — and a duplicated `-Tthruput-rv32.ld` redefines the linker
# script's MEMORY regions ("region 'CODE' already defined"). The rv32
# rustflags and the release profile live in .cargo/config.toml.
[unstable]
build-std = ["core", "alloc"]
build-std-features = ["std/optimize_for_size"]
