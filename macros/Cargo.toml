[package]
name = "macros"
version = "0.1.0"
edition = "2021"

[lib]
proc-macro = true

[dependencies]
darling = "0.20.10"
proc-macro2 = "1.0.92"
quote = "1.0.38"
sha2 = { workspace = true }
syn = { version = "2.0.93" , features = [ "full" , "extra-traits", "visit", "printing" ] }
serde = { workspace = true, features = ["derive"] }
serde_yaml = "0.9"
groundhog_xdr = { workspace = true }
