[package]
name = "groundhog-macros"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Macros for Groundhog smart contract development"

[lib]
proc-macro = true

[dependencies]
groundhog-codegen = { workspace = true }
groundhog-contract-util = { workspace = true }
darling = "0.20.10"
proc-macro2 = "1.0.92"
quote = "1.0.38"
sha2 = { workspace = true }
syn = { version = "2.0.93" , features = [ "full" , "extra-traits", "visit", "printing" ] }
serde = { version = "1.0.217", default-features = false, features = ["derive"] }
serde_yaml = "0.9"
groundhog-xdr = { workspace = true, features = ["std", "xdrs"] }
xdrs = { workspace = true }

[features]
logging = ["groundhog-codegen/logging"]
call_tracking = ["groundhog-codegen/call_tracking"]
spec = ["groundhog-codegen/spec", "groundhog-xdr/spec"]
storage = []
mock = [] # generate test-registration in contract-macro
