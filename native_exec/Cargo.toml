[package]
name = "native_exec"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
wasm_backtraces = []

[dependencies]
groundhog_xdr = { workspace = true, features = ["std", "xdrs"]}
xdrs = { workspace = true }
sha2 = {version = "0.10"}
thiserror = { version = "2.0.12", default-features = false }

[build-dependencies]
cmake = "0.1"
bindgen = "0.71"
