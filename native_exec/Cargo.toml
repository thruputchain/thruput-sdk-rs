[package]
name = "native_exec"
edition.workspace = true
version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Native execution environment for testing Groundhog smart contracts"

[lib]
crate-type = ["rlib"]

[features]
# If this feature is enabled, then the native_exec crate will be built with
# wasm backtraces enabled.  Those will be largely meaningless unless you also
# build contracts with minimal debug info (line numbers and function names).
# 
# This feature also turns on the logging feature in the contracts that are built in integration_test_contracts
# within hogexec.  The only contract for which that is relevant for the SDK is the initial_token_claim contract,
# in that this feature will change the gas consumption (and hash) of that contract.
#
# Currently is only available with build from source enabled.
wasm_backtraces = ["groundhog-sys/wasm_backtraces"]

[dependencies]
groundhog-xdr = { workspace = true, features = ["std", "xdrs"]}
hogexec-internal = { workspace = true }
xdrs = { workspace = true }
sha2 = {version = "0.10"}
thiserror = { version = "2.0.12", default-features = false }
groundhog-sys = { workspace = true }