[package]
name = "erc20-if"
version = "0.1.0"
edition = "2024"

[features]
storage = ["sdk/storage"]
mock = ["std", "sdk/mock"]
std = ["sdk/std"]

[dependencies]
sdk = { workspace = true }
serde = { workspace = true, features = ["derive"] }
xdrs = { workspace = true, features = ["derive", "alloc"] }
thiserror.workspace = true
xdr-repr = { workspace = true }
xdr-derive = { workspace = true }
gen = { workspace = true }
groundhog_xdr = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
