[workspace]
resolver = "3"
exclude = ["actor"]

[workspace.package]
version = "0.42.1"

[package]
name = "sep41-conformance"
version.workspace = true
edition = "2024"
publish = false
autotests = false

[features]
default = ["dev"]
dev = []
entrypoints = []
runtime = ["dep:groundhog-testkit", "dep:groundhog-json-rpc-client", "dep:tokio", "dep:sep41-runtime-actor"]

[[test]]
name = "traces"
path = "tests/traces.rs"

[[test]]
name = "runtime"
path = "tests/runtime.rs"
required-features = ["runtime"]

[dependencies]
groundhog-testkit = { version = "=0.20.0", registry = "groundhog", optional = true }
groundhog-json-rpc-client = { version = "=0.20.0", registry = "groundhog", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }
sep41-runtime-actor = { path = "actor", features = ["dev"], optional = true }

[dev-dependencies]
sdk = { path = "../../crates/sdk", version = "=0.42.1", features = ["dev"] }
groundhog-erc20-if = { path = "../../standard-interfaces/groundhog-erc20", version = "=0.1.43", features = ["dev"] }
groundhog-erc20-controls-if = { path = "../../standard-interfaces/groundhog-erc20-controls", version = "=0.1.43", features = ["dev"] }
groundhog-sep41 = { path = "../../standard-impls/groundhog-sep41", version = "=0.1.43", features = ["dev"] }
soroban-sdk = { version = "=28.0.0", features = ["testutils"] }
soroban-env-host = "=28.0.2"
