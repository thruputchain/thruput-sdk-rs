[package]
name = "sorhog-native"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone: not a member of the sdk_rs workspace.
[workspace]

[[bin]]
name = "sorhog-native"
path = "src/main.rs"

[dependencies]
sdk = { path = "../../../crates/sdk", features = ["alloc"] }
# `testutils` here only adds native-contract dispatch (ContractFunctionSet) and
# `arbitrary`; soroban-sdk itself stays non-testutils.
soroban-env-host = { version = "=28.0.2", default-features = false, features = ["recording_mode", "testutils", "no-wasm-vm", "no-soroban-metering"] }
soroban-sdk = { version = "=28.0.0", default-features = false, features = ["native-embed"] }
# The Soroban contract, compiled natively to RV32 alongside the host.
soroban-counter = { path = "../soroban-counter" }
getrandom = { version = "0.2", features = ["custom"] }
talc = { version = "4", default-features = false, features = ["lock_api"] }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex", "lock_api"] }

[patch.crates-io]
# build.sh vendors these and applies ../patches/*.patch:
# - host: wall-clock telemetry timer compiled out on zkvm; a recording-mode
#   invoke variant with a pre-invoke setup hook (to register native contracts).
# - sdk: hidden `Env::__from_host` to call native contract fns without testutils.
soroban-env-host = { path = "vendor/soroban-env-host-28.0.2" }
soroban-sdk = { path = "vendor/soroban-sdk-28.0.0" }

[profile.release]
opt-level = "z"
overflow-checks = false
debug = false
strip = "symbols"
panic = "abort"
lto = true
codegen-units = 1
