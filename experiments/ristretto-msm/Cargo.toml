cargo-features = ["trim-paths"]

[workspace]
resolver = "3"

[package]
name = "ristretto-msm"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib"]
doctest = false

[[bin]]
name = "ristretto_msm"
path = "src/main.rs"
required-features = ["entrypoints"]

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]

[dependencies]
thruput-sdk = { path = "../../crates/sdk" }

[dev-dependencies]
ristretto-msm = { path = ".", features = ["dev"] }
curve25519-dalek = "4.1.3"

[profile.release]
trim-paths = "all"

# Experimental host API bindings; keep this family on one commit.
[patch.crates-io]
thruput-xdr = { git = "https://github.com/thruputchain/thruput-protocol-rs", rev = "b37ae645296fdd3860b8031e3f96112cce04b800" }
thruput-xdr-macros = { git = "https://github.com/thruputchain/thruput-protocol-rs", rev = "b37ae645296fdd3860b8031e3f96112cce04b800" }
thruput-syscall = { git = "https://github.com/thruputchain/thruput-protocol-rs", rev = "b37ae645296fdd3860b8031e3f96112cce04b800" }
thruput-spec = { git = "https://github.com/thruputchain/thruput-protocol-rs", rev = "b37ae645296fdd3860b8031e3f96112cce04b800" }
thruput-trace = { git = "https://github.com/thruputchain/thruput-protocol-rs", rev = "b37ae645296fdd3860b8031e3f96112cce04b800" }
