cargo-features = ["trim-paths"] #unstable

[workspace]
members = [
    "macros", 
    "protocol-rs/groundhog_xdr", 
    "protocol-rs/protocol_macros", 
    "native_exec",
    "examples/*"
]

[package]
name = "sdk_rs"
version = "0.0.1"
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
edition = "2021"
autoexamples = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
bcs = { path = "external/bcs", default-features = false }
macros = { workspace = true }
native_exec = { path = "native_exec", optional = true}
groundhog_xdr = { workspace = true }
serde = { workspace = true }
serde_arrays = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
xdrs = { workspace = true, optional = true }

[workspace.dependencies]
macros = { path = "macros" }
groundhog_xdr = { path = "protocol-rs/groundhog_xdr", default-features = false }
sha2 = { version = "0.10.8", default-features = false }
sdk = { package = "sdk_rs", path = "." }
serde = { version = "1.0.217", default-features = false }
serde_arrays = { path = "protocol-rs/external/serde_arrays", default-features = false }
thiserror = { version = "2.0.12", default-features = false }
# xdrs = { git = "ssh://git@github.com/groundhogchain/xdrs.git", default-features = false }
xdrs = { path = "../../xdrs", default-features = false, features = ["alloc"] }

[features]
# can probably remove this by removing the alloc dependency in the `internal` module
default = ["alloc"]
mock = ["std", "dep:native_exec"]
storage = ["alloc"]
alloc = ["serde/alloc", "serde_arrays/alloc", "groundhog_xdr/alloc", "bcs/alloc", "xdrs/alloc"]
std = ["alloc", "serde/std", "bcs/std", "groundhog_xdr/std"]
xdrs = ["dep:xdrs"]

[profile.dev]
opt-level = "z"
overflow-checks = false
debug = false
strip = "debuginfo"
panic = "abort"

[profile.test]
# settings inherited from profile.dev
# opt-level = 0
# overflow-checks = true
# debug = true
# strip = false

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1
trim-paths = "all" # unstable
# also see rust flags set in .cargo/config.toml
