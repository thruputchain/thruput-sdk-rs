# unstable
cargo-features = ["trim-paths", "profile-rustflags"]

[workspace]
members = ["macros", "native_exec", "eg/*"]

[package]
name = "sdk_rs"
version = "0.0.1"
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
protocol = { workspace = true }
macros = { path = "macros" }
bcs = { path = "external/bcs", default-features = false }
native_exec = { path = "native_exec", optional = true }
serde = { workspace = true }
serde_arrays = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }

[workspace.dependencies]
protocol = { path = "../protocol-rs" }
sha2 = { version = "0.10.8", default-features = false }
sdk = { package = "sdk_rs", path = "." }
serde = { version = "1.0.217", default-features = false }
serde_arrays = { path = "external/serde_arrays", default-features = false }
thiserror = { version = "2.0.12", default-features = false }

[features]
# can probably remove this by removing the alloc dependency in the `internal` module
default = ["alloc"]
alloc = ["serde/alloc", "serde_arrays/alloc", "protocol/alloc"]
std = ["alloc", "serde/std", "bcs/std", "protocol/std"]
storage = ["alloc"]
mock = ["std", "dep:native_exec"]

[profile.dev]
opt-level = 0
panic = "abort"

### From rs_contracts/Cargo.toml
# [profile.dev]
# opt-level = "z"
# overflow-checks = false
# debug = false
# strip = "debuginfo"
# panic = "abort"

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1
trim-paths = "all" # unstable
rustflags = [ "-C", "link-args=-zstack-size=64000" ]
