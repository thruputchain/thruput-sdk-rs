[workspace]
resolver = "3"
members = [
    "crates/*",
    "crates/sdk/tests/vector-tests",
    "crates/sdk/tests/version-mismatch-helper",
    "crates/macros/tests/crate-override-guest",
    "standard-interfaces/*",
    "standard-impls/*",
    "standard-tests/*",
]
# The guest runtime crate (crates/rv32-runtime) only compiles for its target —
# a top-level compile_error! rejects every other target. It stays a workspace
# member (for field inheritance, `-p` builds, and publishing via thruput-sdk),
# but is excluded from default-members so host-wide `cargo build/test/doc`
# (which build all default members) skip it. Add new crates/* packages here too
# unless they are target-only runtimes.
default-members = [
    "crates/bigint-bench",
    "crates/bigint-bench-if",
    "crates/bottle-test",
    "crates/bottle-test-if",
    "crates/contract-spec",
    "crates/contract-util",
    "crates/domain-separator",
    "crates/event",
    "crates/exn",
    "crates/hogd-sys",
    "crates/macros",
    "crates/native-exec",
    "crates/sdk",
    "crates/spec-tool",
    "crates/storage-cost",
    "crates/test-vectors",
    "crates/u256",
    "crates/version-check",
    "crates/sdk/tests/vector-tests",
    "crates/sdk/tests/version-mismatch-helper",
    "crates/macros/tests/crate-override-guest",
    "standard-interfaces/*",
    "standard-impls/*",
    "standard-tests/*",
]

[workspace.package]
edition = "2024"
version = "0.52.1"
authors = ["Thruput Team"]
license = "Apache-2.0"
publish = ["thruput"]
repository = "https://github.com/thruputchain/thruput-sdk-rs"
homepage = "https://github.com/thruputchain/thruput-sdk-rs"
keywords = ["thruput"]
categories = ["blockchain"]

[workspace.dependencies]
thruput-erc20-controls-if = { path = "standard-interfaces/thruput-erc20-controls", registry = "thruput", version = "=0.1.60" }
# Thruput crates from local repository
#
# These version numbers need to match the overall workspace package
# version, and must unfortunately be updated manually whenever the
# workspace package version is updated prior to a new release.
#
# Additionally, these independent workspaces need updating to the new
# SDK and interface versions:
#    example-contracts/
#    example-contracts/multi_root_collision/
#    example-contracts/cross_crate_collision/ (3 manifests: alpha, beta, wrapper)
#    integration_test/
#
# When the workspace package version (or thruput-xdr) undergoes a
# *breaking change* (major or minor), the standard-interfaces/ crates
# should be bumped to a new patch version.  (This allows them to be
# published with a dependency on the new SDK version; the
# previously-published versions will be incompatible with the new
# SDK.)
#
thruput-sdk = { path = "crates/sdk", registry = "thruput", version = "=0.52.1" }
thruput-macros = { path = "crates/macros", registry = "thruput", version = "=0.52.1" }
thruput-contract-util = { path = "crates/contract-util" , registry = "thruput", version = "=0.52.1" }
thruput-contract-spec = { path = "crates/contract-spec", registry = "thruput", version = "=0.52.1", default-features = false }
thruput-native-exec = { path = "crates/native-exec" , registry = "thruput", version = "=0.52.1" }
thruput-sys = { path = "crates/hogd-sys" , registry = "thruput", version = "=0.52.1" }
thruput-storage-cost = { path = "crates/storage-cost" , registry = "thruput", version = "=0.52.1" }
thruput-event = { path = "crates/event", registry = "thruput", version = "=0.52.1" }
thruput-exn = { path = "crates/exn", registry = "thruput", version = "=0.52.1" }
thruput-rv32-runtime = { path = "crates/rv32-runtime", registry = "thruput", version = "=0.52.1" }
thruput-spec-tool = { path = "crates/spec-tool", registry = "thruput", version = "=0.52.1" }
thruput-domain-separator = { path = "crates/domain-separator", registry = "thruput", version = "=0.52.1" }
thruput-test-vectors = { path = "crates/test-vectors", registry = "thruput", version = "=0.52.1" }
thruput-u256 = { path = "crates/u256", registry = "thruput", version = "=0.52.1", default-features = false }
# Standard interfaces (also this repository)
thruput-erc165-if = { path = "standard-interfaces/thruput-erc165", registry = "thruput", version = "=0.1.60" }
thruput-erc20-if = { path = "standard-interfaces/thruput-erc20", registry = "thruput", version = "=0.1.60" }
thruput-erc20-metadata-if = { path = "standard-interfaces/thruput-erc20-metadata", registry = "thruput", version = "=0.1.60" }
thruput-erc20-pausable-if = { path = "standard-interfaces/thruput-erc20-pausable", registry = "thruput", version = "=0.1.60" }
thruput-access-control-if = { path = "standard-interfaces/thruput-access-control", registry = "thruput", version = "=0.1.60" }
thruput-signed-op-if = { path = "standard-interfaces/thruput-signed-op", registry = "thruput", version = "=0.1.60" }
thruput-erc20-permit-if = { path = "standard-interfaces/thruput-erc20-permit", registry = "thruput", version = "=0.1.60" }
thruput-erc721-if = { path = "standard-interfaces/thruput-erc721", registry = "thruput", version = "=0.1.60" }
# Standard-interface implementation components (also this repository)
thruput-access-control = { path = "standard-impls/thruput-access-control", registry = "thruput", version = "=0.1.60" }
thruput-signed-op = { path = "standard-impls/thruput-signed-op", registry = "thruput", version = "=0.1.60" }
thruput-sep41 = { path = "standard-impls/thruput-sep41", registry = "thruput", version = "=0.1.60" }
# Test-support crates
erc20-test = { path = "standard-tests/erc20-test", registry = "thruput", version = "=0.52.1" }
erc20-bottle-test = { path = "standard-tests/erc20-bottle-test", registry = "thruput", version = "=0.52.1" }
erc20-native-test = { path = "standard-tests/erc20-native-test", registry = "thruput", version = "=0.52.1" }
bottle-test-if = { path = "crates/bottle-test-if", registry = "thruput", version = "=0.52.1" }
# Unpublished test crates
bigint-bench-if = { path = "crates/bigint-bench-if" }

# Public XDR types must use one qualified dependency family.
# Keep these exact so fresh consumers cannot mix incompatible XDR traits.
# Deps from protocol-rs repo:
thruput-spec = { registry = "thruput", version = "=0.56.2", default-features = false }
thruput-trace = { registry = "thruput", version = "=0.56.2" }
thruput-xdr = { registry = "thruput", version = "=0.56.2", features = ["xdrs"] }
thruput-syscall = { registry = "thruput", version = "=0.56.2" }
hogexec-internal = { registry = "thruput", version = "=0.56.2" }

# Deps from xdrs repo.  Caret rather than exact so an xdrs patch release
# reaches consumers without an SDK release.
xdrs = { registry = "thruput", version = "0.12.0", default-features = false, features = ["int128", "heapless"] }
xdr-common = { registry = "thruput", version = "0.12.0" }

# External crates.io dependencies
thiserror = { version = "2.0.12", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
heapless = { version = "0.9.2" }
hex-literal = "1.0.0"
linkme = "0.3"
