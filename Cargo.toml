# Strip private prefixes of filesystem paths from binaries
cargo-features = ["trim-paths"]

[workspace]
members = [
    "macros",
    "protocol-rs/groundhog_xdr",
    "protocol-rs/protocol_macros",
    "eg/*",
    ]

[package]
name = "sdk_rs"
version = "0.0.1"
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
groundhog_xdr = { workspace = true }
macros = { path = "macros" }
bcs = { path = "external/bcs", default-features = false }
serde = { workspace = true }
serde_arrays = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }

[workspace.dependencies]
groundhog_xdr = { path = "protocol-rs/groundhog_xdr" }
sha2 = { version = "0.10.8", default-features = false }
sdk = { package = "sdk_rs", path = "." }
serde = { version = "1.0.217", default-features = false }
serde_arrays = { path = "external/serde_arrays", default-features = false }
thiserror = { version = "2.0.12", default-features = false }

[features]
# can probably remove this by removing the alloc dependency in the `internal` module
default = ["alloc"]
mock = ["std"]
storage = ["alloc"]
alloc = ["serde/alloc", "serde_arrays/alloc", "groundhog_xdr/alloc"]
std = ["alloc", "serde/std", "bcs/std", "groundhog_xdr/std"]

[profile.dev]
opt-level = 0
panic = "abort"

  ### but rs_contract_sdk/Cargo.toml had this:
  # [profile.dev]
  # opt-level = "z"
  # overflow-checks = false
  # debug = false
  # strip = "debuginfo"
  # panic = "abort"

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1
trim-paths = "all"  # unstable
