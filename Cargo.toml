[workspace]
resolver = "3"
members = [
    "crates/*",
    "crates/runtime/tests/vector-tests",
    "crates/runtime/tests/version-mismatch-helper",
    "standard-interfaces/*",
    "standard-tests/*",
]

[workspace.package]
edition = "2024"
version = "0.14.5"
authors = ["Groundhog Team"]
license = "Apache-2.0"
publish = ["groundhog"]
repository = "https://github.com/groundhogchain/sdk_rs.git"
homepage = "https://github.com/groundhogchain/sdk_rs.git"
keywords = ["groundhog"]
categories = ["blockchain"]

[workspace.dependencies]
# Publishable dependencies from this repository
    #
    # These version numbers need to match the overall workspace package
    # version, and must unfortunately be updated manually whenever the
    # workspace package version is updated prior to a new release.
    #
    # Additionally, these configs for embedded workspaces need updating:
    #    example-contracts/Cargo.toml
    #    integration_test/contracts/Cargo.toml
    #
    # TODO: Do all of these need to be publishable, thus needing a registry and version?
    #
sdk = { path = "crates/sdk", registry = "groundhog", version = "=0.14.5" }
groundhog-runtime = { path = "crates/runtime", registry = "groundhog", version = "=0.14.5" }
groundhog-contract-util = { path = "crates/contract-util" , registry = "groundhog", version = "=0.14.5" }
groundhog-contract-spec = { path = "crates/contract-spec", registry = "groundhog", version = "=0.14.5", default-features = false }
groundhog-native-exec = { path = "crates/native-exec" , registry = "groundhog", version = "=0.14.5" }
groundhog-sys = { path = "crates/hogd-sys" , registry = "groundhog", version = "=0.14.5" }
groundhog-storage-cost = { path = "crates/storage-cost" , registry = "groundhog", version = "=0.14.5" }
groundhog-event = { path = "crates/event", registry = "groundhog", version = "=0.14.5" }
groundhog-spec-tool = { path = "crates/spec-tool", registry = "groundhog", version = "=0.14.5" }
groundhog-test-vectors = { path = "crates/test-vectors", registry = "groundhog", version = "=0.14.5" }

# Standard interfaces
groundhog-erc20-if = { path = "standard-interfaces/groundhog-erc20", registry = "groundhog", version = "=0.1.0" }
groundhog-erc20-metadata-if = { path = "standard-interfaces/groundhog-erc20-metadata", registry = "groundhog", version = "=0.1.0" }
groundhog-erc1271-if = { path = "standard-interfaces/groundhog-erc1271", registry = "groundhog", version = "=0.1.0" }

# Standard tests
erc20-test = { path = "standard-tests/erc20-test" }
erc20-bottle-test = { path = "standard-tests/erc20-bottle-test" }
erc20-native-test = { path = "standard-tests/erc20-native-test" }

# Not-published crates
bottle-test-if = { path = "crates/bottle-test-if" }
runtime-macros = { path = "crates/runtime-macros" }

# Deps from protocol-rs repo:
groundhog-spec = { registry = "groundhog", version = "=0.13.6", default-features = false }
groundhog-trace = { registry = "groundhog", version = "=0.13.6" }
groundhog-xdr = { registry = "groundhog", version = "=0.13.6", features = ["xdrs"] }
hogexec-internal = { registry = "groundhog", version = "=0.13.6" }

# Deps from xdrs repo:
xdrs = { registry = "groundhog", version = "0.7.1", features = ["int128", "heapless"] }
xdr-common = { registry = "groundhog", version = "0.7.1" }

# External groundhog dependencies
groundhog-wasm-meter = { registry = "groundhog", version = "0.3" }

# External crates.io dependencies
thiserror = { version = "2.0.12", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
heapless = { version = "0.9.2" }
hex-literal = "1.0.0"
bitset-core = { version = "0.1.1", default-features = false }
linkme = "0.3"
