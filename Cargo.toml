cargo-features = ["trim-paths"] #unstable

[workspace]
members = [
    "macros", 
    "gen",
    "native_exec",
    "examples/*",
    "integration_test_contracts/*",
    "standard-interfaces/*",
    "standard-tests/*",
    "bottle-test",
    ]
exclude = ["integration_test_contracts/xdr"]

[package]
name = "sdk"
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
edition.workspace = true
version.workspace = true
autoexamples = false

[workspace.package]
edition = "2024"
version = "0.1.0"

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
# Indigenous dependencies
macros = { workspace = true }
groundhog_xdr = { workspace = true }
xdrs = { workspace = true }

# External dependencies
thiserror = { workspace = true }
sha2 = { workspace = true, default-features = false }
bitset-core = { workspace = true }

# Optional dependencies
native_exec = { workspace = true, optional = true }
delegate = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }

[build-dependencies]

[dev-dependencies]
bottle-test-if = { workspace = true }
hex-literal = { workspace = true }

[workspace.dependencies]
sdk = { path = "." }
gen = { path = "gen" }
macros = { path = "macros" }
groundhog_xdr = { git = "ssh://git@github.com/groundhogchain/protocol-rs.git", features = ["xdrs", "syscalls"] }
thiserror = { version = "2.0.12", default-features = false }
xdrs = { git = "ssh://git@github.com/groundhogchain/xdrs.git", features = ["extras", "int128_xdr"] }
xdr_common = { git = "ssh://git@github.com/groundhogchain/xdr_common.git" }
sha2 = { version = "0.10.8", default-features = false }
delegate = { version = "0.13.4" }
native_exec = { path = "native_exec" }
heapless = { version = "0.9.2" }
hex-literal = "1.0.0"
bitset-core = { version = "0.1.1", default-features = false }

# Standard interface crates
groundhog-erc20-if = { path = "standard-interfaces/groundhog-erc20" }
groundhog-erc1271-if = { path = "standard-interfaces/groundhog-erc1271" }

# Standard test crates
bottle-test-if = { path = "standard-tests/bottle-test-if" }
erc20-test = { path = "standard-tests/erc20-test" }
erc20-bottle-test = { path = "standard-tests/erc20-bottle-test" }
erc20-native-test = { path = "standard-tests/erc20-native-test" }

[features]
default = []
mock = ["std", "dep:native_exec", "macros/mock", "groundhog_xdr/syscalls_mock"]
storage = ["alloc", "dep:delegate", "macros/storage"]
alloc = ["macros/alloc", "groundhog_xdr/alloc", "xdrs/alloc"]
std = ["alloc", "groundhog_xdr/std"]
logging = ["macros/logging", "alloc"] # trace contract calls when testing
spec = ["std", "macros/spec", "groundhog_xdr/spec", "xdrs/repr"]
panic_logging = ["dep:heapless"] # send panic messages to the log() syscall

[profile.contract]
inherits = "release"
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1
trim-paths = "all" # unstable
# also see rust flags set in .cargo/config.toml

[[test]]
name = "int128"
required-features = ["std"]

[[test]]
name = "storage"
required-features = ["storage"]

[[test]]
name = "events"

[lints.clippy]
collapsible_if = "allow"
