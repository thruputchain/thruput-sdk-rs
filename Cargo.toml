cargo-features = ["trim-paths"] #unstable

[workspace]
members = [
    "macros", 
    "iface",
    "protocol-rs/groundhog_xdr", 
    "native_exec",
    "examples/*",
    "example-interfaces/*",
    "integration_test_contracts/*", "iface",
    ]

[package]
name = "sdk"
version = "0.0.1"
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
edition = "2021"
autoexamples = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
bcs = { path = "external/bcs", optional = true, default-features = false }
macros = { workspace = true }
native_exec = { path = "native_exec", optional = true}
groundhog_xdr = { workspace = true }
serde = { workspace = true }
serde_arrays = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
xdrs = { workspace = true, optional = true, features = ["strict", "alloc", "cxs", "txs", "xdr_common"] }

[workspace.dependencies]
iface = { path = "iface" }
macros = { path = "macros" }
erc20-if = { path = "example-interfaces/erc20-if" }
groundhog_xdr = { path = "protocol-rs/groundhog_xdr", default-features = false }
sha2 = { version = "0.10.8", default-features = false }
sdk = { path = "." }
serde = { version = "1.0.217", default-features = false }
serde_arrays = { path = "protocol-rs/external/serde_arrays", default-features = false }
thiserror = { version = "2.0.12", default-features = false }
xdrs = { git = "ssh://git@github.com/groundhogchain/xdrs.git"}
xdr_common = { git = "ssh://git@github.com/groundhogchain/xdr_common.git" }

[features]
# can probably remove this by removing the alloc dependency in the `internal` module
default = ["alloc", "groundhog_xdr/xdrs"]
mock = ["macros/mock", "std", "dep:native_exec"]
storage = ["alloc", "dep:bcs"]
alloc = ["macros/alloc", "serde/alloc", "serde_arrays/alloc", "groundhog_xdr/alloc", "bcs/alloc", "xdrs/alloc"]
std = ["alloc", "serde/std", "bcs/std", "groundhog_xdr/std"]
xdrs = ["dep:xdrs"]

[profile.dev]
opt-level = 3
overflow-checks = false
debug = false
strip = "none"
panic = "abort"
lto = true
codegen-units = 1
trim-paths = "all" # unstable

[profile.test]
# settings inherited from profile.dev
opt-level = 0
overflow-checks = true
debug = true
strip = "none"
debug-assertions = true

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1
trim-paths = "all" # unstable
# also see rust flags set in .cargo/config.toml
