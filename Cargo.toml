[workspace]
resolver = "3"
members = [
    "crates/*",
    "crates/sdk/tests/vector-tests",
    "crates/sdk/tests/version-mismatch-helper",
    "crates/macros/tests/crate-override-guest",
    "standard-interfaces/*",
    "standard-impls/*",
    "standard-tests/*",
]
# The guest runtime crate (crates/rv32-runtime) only compiles for its target —
# a top-level compile_error! rejects every other target. It stays a workspace
# member (for field inheritance, `-p` builds, and publishing via sdk), but is
# excluded from default-members so host-wide `cargo build/test/doc` (which
# build all default members) skip it. Add new crates/* packages here too
# unless they are target-only runtimes.
default-members = [
    "crates/bigint-bench",
    "crates/bigint-bench-if",
    "crates/bottle-test",
    "crates/bottle-test-if",
    "crates/contract-spec",
    "crates/contract-util",
    "crates/domain-separator",
    "crates/event",
    "crates/exn",
    "crates/hogd-sys",
    "crates/macros",
    "crates/native-exec",
    "crates/sdk",
    "crates/spec-tool",
    "crates/storage-cost",
    "crates/test-vectors",
    "crates/u256",
    "crates/version-check",
    "crates/sdk/tests/vector-tests",
    "crates/sdk/tests/version-mismatch-helper",
    "crates/macros/tests/crate-override-guest",
    "standard-interfaces/*",
    "standard-impls/*",
    "standard-tests/*",
]

[workspace.package]
edition = "2024"
version = "0.39.2"
authors = ["Groundhog Team"]
license = "Apache-2.0"
publish = ["groundhog"]
repository = "https://github.com/groundhogchain/sdk_rs"
homepage = "https://github.com/groundhogchain/sdk_rs"
keywords = ["groundhog"]
categories = ["blockchain"]

[workspace.dependencies]
# Groundhog crates from local repository
#
# These version numbers need to match the overall workspace package
# version, and must unfortunately be updated manually whenever the
# workspace package version is updated prior to a new release.
#
# Additionally, these independent workspaces need updating to the new
# SDK and interface versions:
#    example-contracts/
#    example_contracts/multi_root_collision/
#    example-contracts/cross_crate_collision/ (3 manifests: alpha, beta, wrapper)
#    integration_test/
#
# When the workspace package version (or groundhog-xdr) undergoes a
# *breaking change* (major or minor), the standard-interfaces/ crates
# should be bumped to a new patch version.  (This allows them to be
# published with a dependency on the new SDK version; the
# previously-published versions will be incompatible with the new
# SDK.)
#
sdk = { path = "crates/sdk", registry = "groundhog", version = "=0.39.2" }
groundhog-macros = { path = "crates/macros", registry = "groundhog", version = "=0.39.2" }
groundhog-contract-util = { path = "crates/contract-util" , registry = "groundhog", version = "=0.39.2" }
groundhog-contract-spec = { path = "crates/contract-spec", registry = "groundhog", version = "=0.39.2", default-features = false }
groundhog-native-exec = { path = "crates/native-exec" , registry = "groundhog", version = "=0.39.2" }
groundhog-sys = { path = "crates/hogd-sys" , registry = "groundhog", version = "=0.39.2" }
groundhog-storage-cost = { path = "crates/storage-cost" , registry = "groundhog", version = "=0.39.2" }
groundhog-event = { path = "crates/event", registry = "groundhog", version = "=0.39.2" }
groundhog-exn = { path = "crates/exn", registry = "groundhog", version = "=0.39.2" }
groundhog-rv32-runtime = { path = "crates/rv32-runtime", registry = "groundhog", version = "=0.39.2" }
groundhog-spec-tool = { path = "crates/spec-tool", registry = "groundhog", version = "=0.39.2" }
groundhog-domain-separator = { path = "crates/domain-separator", registry = "groundhog", version = "=0.39.2" }
groundhog-test-vectors = { path = "crates/test-vectors", registry = "groundhog", version = "=0.39.2" }
groundhog-u256 = { path = "crates/u256", registry = "groundhog", version = "=0.39.2", default-features = false }
# Standard interfaces (also this repository)
groundhog-erc165-if = { path = "standard-interfaces/groundhog-erc165", registry = "groundhog", version = "=0.1.39" }
groundhog-erc20-if = { path = "standard-interfaces/groundhog-erc20", registry = "groundhog", version = "=0.1.39" }
groundhog-erc20-metadata-if = { path = "standard-interfaces/groundhog-erc20-metadata", registry = "groundhog", version = "=0.1.39" }
groundhog-erc20-pausable-if = { path = "standard-interfaces/groundhog-erc20-pausable", registry = "groundhog", version = "=0.1.39" }
groundhog-access-control-if = { path = "standard-interfaces/groundhog-access-control", registry = "groundhog", version = "=0.1.39" }
groundhog-signed-op-if = { path = "standard-interfaces/groundhog-signed-op", registry = "groundhog", version = "=0.1.39" }
groundhog-erc20-permit-if = { path = "standard-interfaces/groundhog-erc20-permit", registry = "groundhog", version = "=0.1.39" }
groundhog-erc721-if = { path = "standard-interfaces/groundhog-erc721", registry = "groundhog", version = "=0.1.39" }
# Standard-interface implementation components (also this repository)
groundhog-access-control = { path = "standard-impls/groundhog-access-control", registry = "groundhog", version = "=0.1.39" }
groundhog-signed-op = { path = "standard-impls/groundhog-signed-op", registry = "groundhog", version = "=0.1.39" }
# Test-support crates
erc20-test = { path = "standard-tests/erc20-test", registry = "groundhog", version = "=0.39.2" }
erc20-bottle-test = { path = "standard-tests/erc20-bottle-test", registry = "groundhog", version = "=0.39.2" }
erc20-native-test = { path = "standard-tests/erc20-native-test", registry = "groundhog", version = "=0.39.2" }
bottle-test-if = { path = "crates/bottle-test-if", registry = "groundhog", version = "=0.39.2" }
# Unpublished test crates
bigint-bench-if = { path = "crates/bigint-bench-if" }

# Public XDR types must use one qualified dependency family.
# Keep these exact so fresh consumers cannot mix incompatible XDR traits.
# Deps from protocol-rs repo:
groundhog-spec = { registry = "groundhog", version = "=0.41.0", default-features = false }
groundhog-trace = { registry = "groundhog", version = "=0.41.0" }
groundhog-xdr = { registry = "groundhog", version = "=0.41.0", features = ["xdrs"] }
groundhog-syscall = { registry = "groundhog", version = "=0.41.0" }
hogexec-internal = { registry = "groundhog", version = "=0.41.0" }

# Deps from xdrs repo:
xdrs = { registry = "groundhog", version = "=0.10.1", default-features = false, features = ["int128", "heapless"] }
xdr-common = { registry = "groundhog", version = "=0.10.1" }

# External crates.io dependencies
thiserror = { version = "2.0.12", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
heapless = { version = "0.9.2" }
hex-literal = "1.0.0"
linkme = "0.3"
