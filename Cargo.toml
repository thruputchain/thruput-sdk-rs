cargo-features = ["trim-paths"] #unstable

[workspace]
members = [
    "macros", 
    "contract-util",
    "gen",
    "native_exec",
    "examples/*",
    "integration_test_contracts/*",
    "standard-interfaces/*",
    "standard-tests/*",
    "bottle-test",
    ]
exclude = ["integration_test_contracts/xdr"]

[package]
name = "sdk"
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
edition.workspace = true
version.workspace = true
autoexamples = false

[workspace.package]
edition = "2024"
version = "0.1.0"

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
# Indigenous dependencies
macros = { workspace = true }
groundhog-xdr = { workspace = true }
hogexec-internal = { workspace = true }
xdrs = { workspace = true }
abort = { workspace = true }

# External dependencies
thiserror = { workspace = true }
sha2 = { workspace = true, default-features = false }
bitset-core = { workspace = true }

# Optional dependencies
native_exec = { workspace = true, optional = true }
delegate = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }

[build-dependencies]

[dev-dependencies]
bottle-test-if = { workspace = true }
hex-literal = { workspace = true }

[workspace.dependencies]
#dependencies from this repository
sdk = { path = "." , registry = "groundhog" }
gen = { path = "gen" , registry = "groundhog" }
contract-util = { path = "contract-util" , registry = "groundhog" }
native_exec = { path = "native_exec" , registry = "groundhog" }
macros = { path = "macros" , registry = "groundhog" }

#external dependencies
groundhog-xdr = { registry = "groundhog", version = "0.1.0", features = ["xdrs", "syscalls"] }
hogexec-internal = { registry = "groundhog", version = "0.1.0" }
thiserror = { version = "2.0.12", default-features = false }
xdrs = { registry = "groundhog", version = "0.3.2", features = ["int128"] }
xdr_common = { registry = "groundhog", version = "0.3.2" }
sha2 = { version = "0.10.8", default-features = false }
delegate = { version = "0.13.4" }

heapless = { version = "0.9.2" }
hex-literal = "1.0.0"
bitset-core = { version = "0.1.1", default-features = false }
abort = { registry = "groundhog", version = "0.1.0" }

# Standard interface crates
groundhog-erc20-if = { path = "standard-interfaces/groundhog-erc20" }
groundhog-erc1271-if = { path = "standard-interfaces/groundhog-erc1271" }

# Standard test crates
bottle-test-if = { path = "standard-tests/bottle-test-if" }
erc20-test = { path = "standard-tests/erc20-test" }
erc20-bottle-test = { path = "standard-tests/erc20-bottle-test" }
erc20-native-test = { path = "standard-tests/erc20-native-test" }

[features]
# Enable allocation features
alloc = ["macros/alloc", "groundhog-xdr/alloc", "xdrs/alloc"]

# Add the "storage" convenience module
storage = ["alloc", "dep:delegate", "macros/storage"]

# Enable the mock executor for testing
mock = ["std", "dep:native_exec", "macros/mock", "groundhog-xdr/syscalls_mock"]
std = ["alloc", "groundhog-xdr/std"]

# Diagnostic features
logging = ["macros/logging", "alloc"] # trace contract calls when testing
panic_logging = ["dep:heapless"] # send panic messages to the log() syscall
call_tracking = ["abort/debug", "macros/call_tracking"] # contract-call backtrace

# Generate specs
spec = ["std", "macros/spec", "groundhog-xdr/spec", "xdrs/repr"]

[profile.contract]
inherits = "release"
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1
trim-paths = "all" # unstable
# also see rust flags set in .cargo/config.toml

[[test]]
name = "int128"
required-features = ["std"]

[[test]]
name = "storage"
required-features = ["storage"]

[[test]]
name = "events"

[lints.clippy]
collapsible_if = "allow"

[target.'cfg(target_family = "wasm")'.dependencies]
abort = { workspace = true, features = ["single-threaded"] }
