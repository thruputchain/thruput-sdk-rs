[workspace]
resolver = "3"
members = [
    "crates/*",
    "crates/sdk/tests/vector-tests",
    "crates/sdk/tests/version-mismatch-helper",
    "crates/macros/tests/crate-override-guest",
    "standard-interfaces/*",
    "standard-impls/*",
    "standard-tests/*",
]
# The guest runtime crate (crates/rv32-runtime) only compiles for its target —
# a top-level compile_error! rejects every other target. It stays a workspace
# member (for field inheritance, `-p` builds, and publishing via thruput-sdk),
# but is excluded from default-members so host-wide `cargo build/test/doc`
# (which build all default members) skip it. Add new crates/* packages here too
# unless they are target-only runtimes.
default-members = [
    "crates/bigint-bench",
    "crates/bigint-bench-if",
    "crates/contract-spec",
    "crates/contract-util",
    "crates/domain-separator",
    "crates/event",
    "crates/exn",
    "crates/thruput-sys",
    "crates/macros",
    "crates/native-exec",
    "crates/sdk",
    "crates/spec-tool",
    "crates/storage-cost",
    "crates/test-vectors",
    "crates/u256",
    "crates/version-check",
    "crates/sdk/tests/vector-tests",
    "crates/sdk/tests/version-mismatch-helper",
    "crates/macros/tests/crate-override-guest",
    "standard-interfaces/*",
    "standard-impls/*",
    "standard-tests/*",
]

[workspace.package]
edition = "2024"
version = "0.58.0"
authors = ["Thruput Team"]
license = "Apache-2.0"
publish = ["crates-io"]
# Tests stay in the repository; published crates carry what consumers build.
# Anchored, so only each package's top-level tests/ goes, not a src/ module.
exclude = ["/tests"]
repository = "https://github.com/thruputchain/thruput-sdk-rs"
homepage = "https://github.com/thruputchain/thruput-sdk-rs"
# crates.io allows five of each. Crates whose role differs override these.
keywords = ["thruput", "smart-contracts", "blockchain"]
categories = ["cryptography::cryptocurrencies", "no-std"]

[workspace.dependencies]
thruput-erc20-controls-if = { path = "standard-interfaces/thruput-erc20-controls", version = "=0.1.71" }
# Thruput crates from local repository
#
# These version numbers need to match the overall workspace package
# version, and must unfortunately be updated manually whenever the
# workspace package version is updated prior to a new release.
#
# Additionally, these independent workspaces need updating to the new
# SDK and interface versions:
#    example-contracts/
#    example-contracts/multi_root_collision/
#    example-contracts/cross_crate_collision/ (3 manifests: alpha, beta, wrapper)
#    integration_test/
#
# When the workspace package version (or thruput-xdr) undergoes a
# *breaking change* (major or minor), the standard-interfaces/ crates
# should be bumped to a new patch version.  (This allows them to be
# published with a dependency on the new SDK version; the
# previously-published versions will be incompatible with the new
# SDK.)
#
thruput-sdk = { path = "crates/sdk", version = "=0.58.0" }
thruput-macros = { path = "crates/macros", version = "=0.58.0" }
thruput-contract-util = { path = "crates/contract-util" , version = "=0.58.0" }
thruput-contract-spec = { path = "crates/contract-spec", version = "=0.58.0", default-features = false }
thruput-native-exec = { path = "crates/native-exec" , version = "=0.58.0" }
thruput-sys = { path = "crates/thruput-sys" , version = "=0.58.0" }
thruput-storage-cost = { path = "crates/storage-cost" , version = "=0.58.0" }
thruput-event = { path = "crates/event", version = "=0.58.0" }
thruput-exn = { path = "crates/exn", version = "=0.58.0" }
thruput-rv32-runtime = { path = "crates/rv32-runtime", version = "=0.58.0" }
thruput-spec-tool = { path = "crates/spec-tool", version = "=0.58.0" }
thruput-domain-separator = { path = "crates/domain-separator", version = "=0.58.0" }
thruput-test-vectors = { path = "crates/test-vectors", version = "=0.58.0" }
thruput-u256 = { path = "crates/u256", version = "=0.58.0", default-features = false }
# Standard interfaces (also this repository)
thruput-erc165-if = { path = "standard-interfaces/thruput-erc165", version = "=0.1.71" }
thruput-erc20-if = { path = "standard-interfaces/thruput-erc20", version = "=0.1.71" }
thruput-erc20-metadata-if = { path = "standard-interfaces/thruput-erc20-metadata", version = "=0.1.71" }
thruput-erc20-pausable-if = { path = "standard-interfaces/thruput-erc20-pausable", version = "=0.1.71" }
thruput-access-control-if = { path = "standard-interfaces/thruput-access-control", version = "=0.1.71" }
thruput-signed-op-if = { path = "standard-interfaces/thruput-signed-op", version = "=0.1.71" }
thruput-erc20-permit-if = { path = "standard-interfaces/thruput-erc20-permit", version = "=0.1.71" }
thruput-erc721-if = { path = "standard-interfaces/thruput-erc721", version = "=0.1.71" }
# Standard-interface implementation components (also this repository)
thruput-access-control = { path = "standard-impls/thruput-access-control", version = "=0.1.71" }
thruput-signed-op = { path = "standard-impls/thruput-signed-op", version = "=0.1.71" }
thruput-sep41 = { path = "standard-impls/thruput-sep41", version = "=0.1.71" }
# Test-support crates
thruput-erc20-test = { path = "standard-tests/erc20-test", version = "=0.58.0" }
thruput-erc20-native-test = { path = "standard-tests/erc20-native-test", version = "=0.58.0" }
# Unpublished test crates
bigint-bench-if = { path = "crates/bigint-bench-if" }

# Public XDR types must use one qualified dependency family.
# Keep these exact so fresh consumers cannot mix incompatible XDR traits.
# Deps from protocol-rs repo, published on crates.io:
thruput-spec = { version = "=0.63.0", default-features = false }
thruput-trace = { version = "=0.63.0" }
thruput-xdr = { version = "=0.63.0", features = ["xdrs"] }
thruput-syscall = { version = "=0.63.0" }

# Deps from xdrs repo, published on crates.io as thruput-*.  Caret rather than
# exact so an xdrs patch release reaches consumers without an SDK release.
xdrs = { package = "thruput-xdrs", version = "0.17.1", default-features = false, features = ["int128", "heapless"] }
xdr-common = { package = "thruput-xdr-common", version = "0.17.1" }

# External crates.io dependencies
thiserror = { version = "2.0.12", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
heapless = { version = "0.9.2" }
hex-literal = "1.0.0"
linkme = "0.3"
