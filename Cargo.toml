cargo-features = ["trim-paths"] #unstable

[workspace]
members = [
    "macros", 
    "gen",
    "native_exec",
    "examples/*",
    "integration_test_contracts/*",
    "standard-interfaces/*",
    ]
exclude = ["integration_test_contracts/xdr"]


[package]
name = "sdk"
version = "0.0.1"
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
edition = "2021"
autoexamples = false

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
macros = { workspace = true }
native_exec = { path = "native_exec", optional = true}
groundhog_xdr = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
xdrs = { workspace = true, optional = true }
delegate = "0.13.4"

[dev-dependencies]
hex-literal = "1.0.0"

[workspace.dependencies]
gen = { path = "gen" }
macros = { path = "macros" }
groundhog_xdr = { git = "ssh://git@github.com/groundhogchain/protocol-rs.git", features = ["xdrs", "syscalls"], rev = "c638910dda4de601f6743bb6aa4dde4709ee553b" }
sha2 = { version = "0.10.8", default-features = false }
sdk = { path = "." }
thiserror = { version = "2.0.12", default-features = false }
xdrs = { git = "ssh://git@github.com/groundhogchain/xdrs.git", features = ["extras", "int128_xdr", "xdr_common", "derive", "ns"] }
xdr_common = { git = "ssh://git@github.com/groundhogchain/xdr_common.git" }

# Standard interface crates
groundhog-erc20-if = { path = "standard-interfaces/groundhog-erc20" }
groundhog-erc1271-if = { path = "standard-interfaces/groundhog-erc1271" }

[features]
# can probably remove this by removing the alloc dependency in the `internal` module
default = ["alloc"]
mock = ["std", "dep:native_exec", "macros/mock", "groundhog_xdr/syscalls_mock"]
storage = ["alloc"]
alloc = ["macros/alloc", "groundhog_xdr/alloc", "xdrs/alloc"]
std = ["alloc", "groundhog_xdr/std"]
logging = ["macros/logging"]
spec = ["std", "macros/spec", "groundhog_xdr/spec", "xdrs/repr"]

[profile.dev]
opt-level = 3
overflow-checks = false
debug = false
strip = "none"
panic = "abort"
lto = true
codegen-units = 1
trim-paths = "all" # unstable

[profile.test]
# settings inherited from profile.dev
opt-level = 0
overflow-checks = true
debug = true
strip = "none"
debug-assertions = true

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "none"
# strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1
trim-paths = "all" # unstable
# also see rust flags set in .cargo/config.toml

[[test]]
name = "int128"
required-features = ["std"]
