[workspace]
resolver = "3"
members = [
    "crates/*",
    "crates/sdk/tests/vector-tests",
    "crates/sdk/tests/version-mismatch-helper",
    "standard-interfaces/*",
    "standard-tests/*",
]
# The guest runtime crates (crates/rv32-runtime, crates/wasm-runtime) only
# compile for their target — a top-level compile_error! rejects every other
# target. They stay workspace members (for field inheritance, `-p` builds, and
# publishing via sdk), but are excluded from default-members so host-wide
# `cargo build/test/doc` (which build all default members) skip them. Add new
# crates/* packages here too unless they are target-only runtimes.
default-members = [
    "crates/bottle-test",
    "crates/bottle-test-if",
    "crates/contract-spec",
    "crates/contract-util",
    "crates/domain-separator",
    "crates/event",
    "crates/hogd-sys",
    "crates/macros",
    "crates/native-exec",
    "crates/sdk",
    "crates/spec-tool",
    "crates/storage-cost",
    "crates/test-vectors",
    "crates/sdk/tests/vector-tests",
    "crates/sdk/tests/version-mismatch-helper",
    "standard-interfaces/*",
    "standard-tests/*",
]

[workspace.package]
edition = "2024"
version = "0.17.3"
authors = ["Groundhog Team"]
license = "Apache-2.0"
publish = ["groundhog"]
repository = "https://github.com/groundhogchain/sdk_rs.git"
homepage = "https://github.com/groundhogchain/sdk_rs.git"
keywords = ["groundhog"]
categories = ["blockchain"]

[workspace.dependencies]
# Groundhog crates from local repository
#
# These version numbers need to match the overall workspace package
# version, and must unfortunately be updated manually whenever the
# workspace package version is updated prior to a new release.
#
# When the workspace package version undergoes a *semver-major change*, the
# standard-interfaces/ crates should be bumped to a new minor version.  (This
# allows them to be published with a dependency on the new SDK major version;
# the previously-published versions will be incompatible with the new SDK.)
#
# Additionally, these configs for independent workspaces need updating for the new
# SDK and interface versions:
#    example-contracts/Cargo.toml
#    integration_test/Cargo.toml
#
# Lastly, these independent workspaces need their sdk version updated
# (they are excluded from the root workspace and carry their own Cargo.lock):
#    example_contracts/multi_root_collision
#    example-contracts/cross_crate_collision  (3 manifests: alpha, beta, wrapper)
#
sdk = { path = "crates/sdk", registry = "groundhog", version = "=0.17.3" }
groundhog-macros = { path = "crates/macros", registry = "groundhog", version = "=0.17.3" }
groundhog-contract-util = { path = "crates/contract-util" , registry = "groundhog", version = "=0.17.3" }
groundhog-contract-spec = { path = "crates/contract-spec", registry = "groundhog", version = "=0.17.3", default-features = false }
groundhog-native-exec = { path = "crates/native-exec" , registry = "groundhog", version = "=0.17.3" }
groundhog-sys = { path = "crates/hogd-sys" , registry = "groundhog", version = "=0.17.3" }
groundhog-storage-cost = { path = "crates/storage-cost" , registry = "groundhog", version = "=0.17.3" }
groundhog-event = { path = "crates/event", registry = "groundhog", version = "=0.17.3" }
groundhog-rv32-runtime = { path = "crates/rv32-runtime", registry = "groundhog", version = "=0.17.3" }
groundhog-wasm-runtime = { path = "crates/wasm-runtime", registry = "groundhog", version = "=0.17.3" }
groundhog-spec-tool = { path = "crates/spec-tool", registry = "groundhog", version = "=0.17.3" }
groundhog-domain-separator = { path = "crates/domain-separator", registry = "groundhog", version = "=0.17.3", default-features = false }
groundhog-test-vectors = { path = "crates/test-vectors", registry = "groundhog", version = "=0.17.3" }
# Standard interfaces (also this repository)
groundhog-erc20-if = { path = "standard-interfaces/groundhog-erc20", registry = "groundhog", version = "=0.1.5" }
groundhog-erc20-metadata-if = { path = "standard-interfaces/groundhog-erc20-metadata", registry = "groundhog", version = "=0.1.5" }
groundhog-erc1271-if = { path = "standard-interfaces/groundhog-erc1271", registry = "groundhog", version = "=0.1.5" }
# Unpublished test crates
erc20-test = { path = "standard-tests/erc20-test" }
erc20-bottle-test = { path = "standard-tests/erc20-bottle-test" }
erc20-native-test = { path = "standard-tests/erc20-native-test" }
bottle-test-if = { path = "crates/bottle-test-if" }

# Deps from protocol-rs repo:
groundhog-spec = { registry = "groundhog", version = "0.19.9", default-features = false }
groundhog-trace = { registry = "groundhog", version = "0.19.9" }
groundhog-xdr = { registry = "groundhog", version = "0.19.9", features = ["xdrs"] }
groundhog-syscall = { registry = "groundhog", version = "0.19.9" }
hogexec-internal = { registry = "groundhog", version = "0.19.9" }

# Deps from xdrs repo:
xdrs = { registry = "groundhog", version = "0.8.2", default-features = false, features = ["int128", "heapless"] }
xdr-common = { registry = "groundhog", version = "0.8.0" }

# Other groundhog deps:
groundhog-wasm-meter = { registry = "groundhog", version = "0.3" }

# External crates.io dependencies
thiserror = { version = "2.0.12", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
heapless = { version = "0.9.2" }
hex-literal = "1.0.0"
linkme = "0.3"
