[workspace]
members = [
    "macros", 
    "contract-util",
    "gen",
    "native_exec",
    "groundhog-sys",
    "storage-cost",
#    "integration_test_contracts/*",
    "standard-interfaces/*",
    "standard-tests/*",
    "bottle-test",
    ]
exclude = ["integration_test_contracts/xdr"]

[workspace.package]
edition = "2024"
version = "0.2.0"
authors = ["Groundhog Team"]
license = "Apache-2.0"
publish = ["groundhog"]
repository = "https://github.com/groundhogchain/sdk_rs.git"
homepage = "https://github.com/groundhogchain/sdk_rs.git"
keywords = ["groundhog"]
categories = ["blockchain"]

[package]
name = "sdk"
authors.workspace = true
license.workspace = true
edition.workspace = true
version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "SDK for contract development on the Groundhog blockchain"

exclude = [
    "rust-toolchain.toml",
    "rustfmt.toml",
    "bench/",
    "integration_test_contracts/",
    "examples/",
    ".github/",
    ".cargo/",
    "scripts/",
    "tests/",
]

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
# Indigenous dependencies
groundhog-macros = { workspace = true }
groundhog-contract-util = { workspace = true, optional = true }
groundhog-xdr = { workspace = true }
groundhog-storage-cost = { workspace = true }

# External dependencies
hogexec-internal = { workspace = true }
xdrs = { workspace = true, features = ["heapless"] }
abort = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true, default-features = false }
bitset-core = { workspace = true }
heapless = { workspace = true }

# Optional dependencies
groundhog-native-exec = { workspace = true, optional = true }
delegate = { workspace = true, optional = true }

[dev-dependencies]
bottle-test-if = { workspace = true }
hex-literal = { workspace = true }

[workspace.dependencies]
# Dependencies from this repository
    # These version numbers need to match the overall workspace package
    # version, and must unfortunately be updated manually whenever the
    # workspace package version is updated prior to a new release.
sdk = { path = "." , registry = "groundhog", version = "=0.2.0" }
groundhog-codegen = { path = "gen" , registry = "groundhog", version = "=0.2.0" }
groundhog-contract-util = { path = "contract-util" , registry = "groundhog", version = "=0.2.0" }
groundhog-native-exec = { path = "native_exec" , registry = "groundhog", version = "=0.2.0" }
groundhog-macros = { path = "macros" , registry = "groundhog", version = "=0.2.0" }
groundhog-sys = { path = "groundhog-sys" , registry = "groundhog", version = "=0.2.0" }
groundhog-storage-cost = { path = "storage-cost" , registry = "groundhog", version = "=0.2.0" }

# Standard interface crates
groundhog-erc20-if = { path = "standard-interfaces/groundhog-erc20" }
groundhog-erc1271-if = { path = "standard-interfaces/groundhog-erc1271" }

# Standard test crates
bottle-test-if = { path = "standard-tests/bottle-test-if" }
erc20-test = { path = "standard-tests/erc20-test" }
erc20-bottle-test = { path = "standard-tests/erc20-bottle-test" }
erc20-native-test = { path = "standard-tests/erc20-native-test" }

# External dependencies
groundhog-trace = { registry = "groundhog", version = "0.3.0" }
groundhog-xdr = { registry = "groundhog", version = "0.3.0", features = ["xdrs", "syscalls"] }
hogexec-internal = { registry = "groundhog", version = "0.3.0" }
thiserror = { version = "2.0.12", default-features = false }
xdrs = { registry = "groundhog", version = "0.4.0", features = ["int128", "heapless"] }
xdr_common = { registry = "groundhog", version = "0.4.0" }
abort = { registry = "groundhog", version = "0.1.0" }
sha2 = { version = "0.10.8", default-features = false }
delegate = { version = "0.13.4" }
heapless = { version = "0.9.2" }
hex-literal = "1.0.0"
bitset-core = { version = "0.1.1", default-features = false }

[features]
default = ["fault_strings"] # XXX

# Enable allocation features
alloc = ["groundhog-xdr/alloc", "xdrs/alloc"]

# Add the "storage" convenience module
storage = ["alloc", "dep:delegate", "groundhog-macros/storage"]

# Enable development features
dev = ["mock", "debugging", "call_tracking"]

# Enable the mock executor for testing
mock = ["std", "dep:groundhog-native-exec", "groundhog-macros/mock", "groundhog-xdr/syscalls_mock"]
std = ["alloc", "groundhog-xdr/std", "abort/std"]

# Diagnostic features
debugging = ["abort/debug", "fault_strings"]
fault_strings = [] # XXX
logging = ["groundhog-macros/logging", "alloc"] # trace contract calls when testing
panic_logging = [] # send panic messages to the log() syscall
call_tracking = ["abort/debug", "groundhog-macros/call_tracking"] # contract-call backtrace

# Generate specs
spec = ["std", "groundhog-macros/spec", "groundhog-xdr/spec", "xdrs/repr", "dep:groundhog-contract-util"]

[[test]]
name = "int128"
required-features = ["std"]

[[test]]
name = "storage"
required-features = ["storage"]

[[test]]
name = "events"

[lints.clippy]
collapsible_if = "allow"

[target.wasm32-unknown-unknown.dependencies]
abort = { workspace = true, features = ["single-threaded"] }

[patch.groundhog] # XXX
xdrs = { git = "ssh://git@github.com/groundhogchain/xdrs.git" }
abort = { git = "ssh://git@github.com/groundhogchain/abort_rs.git" }
