[package]
name = "groundhog-sys"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Bindings for the external Groundhog test environment"


[lib]
crate-type = ["rlib"]

[features]
# If this feature is enabled, then the native_exec crate will be built with
# wasm backtraces enabled.  Those will be largely meaningless unless you also
# build contracts with minimal debug info (line numbers and function names).
# 
# This feature also turns on the logging feature in the contracts that are built in integration_test/contracts
# within hogexec.  The only contract for which that is relevant for the SDK is the initial_token_claim contract,
# in that this feature will change the gas consumption (and hash) of that contract.
#
# Currently is only available with build from source enabled.
wasm_backtraces = []

[dependencies]
thiserror = { version = "2.0.12", default-features = false }

[build-dependencies]
cmake = "0.1"
bindgen = "0.71"
reqwest = { version = "0.12", features = ["blocking"] }
tar = "0.4"
flate2 = "1.0"
sha2 = "0.10"
fslock = "0.2"

