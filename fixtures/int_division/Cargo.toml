[package]
name = "int_division"
description = "A contract that divides 64-bit and 128-bit integers"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. `thruput build -p int_division` derives
# `--bin int_division` from the package name, so the name here must stay
# the underscored package name. `required-features` keeps it out of host
# builds.
[[bin]]
name = "int_division"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
thruput-sdk = { workspace = true }

[dev-dependencies]
int_division = { path = ".", features = ["dev"] }
