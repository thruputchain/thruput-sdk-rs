[package]
name = "genesis_deployer"
description = "Genesis deployer"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. `thruput build -p genesis_deployer` derives
# `--bin genesis_deployer` from the package name, so the name here must stay the
# underscored package name. `required-features` keeps it out of host builds.
[[bin]]
name = "genesis_deployer"
path = "src/main.rs"
required-features = ["entrypoints"]

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]

[dependencies]
thruput-sdk = { workspace = true, features = ["alloc"] }

[dev-dependencies]
genesis_deployer = { path = ".", features = ["dev"] }
