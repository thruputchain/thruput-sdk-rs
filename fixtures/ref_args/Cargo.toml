[package]
name = "ref_args"
description = "Contract methods taking bounded vectors and fixed-size types by reference"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. `thruput build -p ref_args` derives
# `--bin ref_args` from the package name, so the name here must stay the
# underscored package name. `required-features` keeps it out of host builds.
[[bin]]
name = "ref_args"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
thruput-sdk = { workspace = true, features = ["alloc"] }
heapless = { workspace = true }

[dev-dependencies]
ref_args = { path = ".", features = ["dev"] }
