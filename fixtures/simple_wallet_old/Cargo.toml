[package]
name = "simple_wallet_old"
description = "A simple wallet app"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["erc20/dev", "thruput-sdk/dev", "thruput-erc20-if/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[dependencies]
thruput-sdk = { workspace = true }
erc20 = { package = "erc20_low_level", path = "../erc20_low_level/" }
thruput-erc20-if = { workspace = true }

[dev-dependencies]
simple_wallet_old = { path = ".", features = ["dev"] }

[package.metadata.gnaw]
kind = "disabled"
