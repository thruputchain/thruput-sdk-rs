[package]
name = "hasher"
description = "A contract exercising hashing"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. `thruput build -p hasher` derives `--bin hasher` from
# the package name, so the name here must stay the underscored package name.
# `required-features` keeps it out of host builds.
[[bin]]
name = "hasher"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
thruput-sdk = { workspace = true }
thruput-domain-separator = { workspace = true, features = ["syscall"] }
hex-literal = { workspace = true }

[dev-dependencies]
hasher = { path = ".", features = ["dev"] }
# The host side of the backend diff in tests/test.rs. `sha2` is a dev-dependency
# feature on purpose: dev-dependencies are not built for rv32, so this
# cannot leak the host backend into the guest (where it is a compile error).
# `syscall-mock` gives the syscall backend its host dispatch path directly,
# rather than leaning on `thruput-sdk/mock` to enable it.
thruput-domain-separator = { workspace = true, features = [
    "sha2",
    "syscall-mock",
] }
