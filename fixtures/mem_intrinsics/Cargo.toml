[package]
name = "mem_intrinsics"
description = "A contract that reaches the rv32 runtime's memcpy, memmove and memset"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# The rv32 artifact. `thruput build -p mem_intrinsics` derives
# `--bin mem_intrinsics` from the package name, so the name here must stay
# the underscored package name. `required-features` keeps it out of host
# builds.
[[bin]]
name = "mem_intrinsics"
path = "src/main.rs"
required-features = ["entrypoints"]

[dependencies]
thruput-sdk = { workspace = true }

[dev-dependencies]
mem_intrinsics = { path = ".", features = ["dev"] }
