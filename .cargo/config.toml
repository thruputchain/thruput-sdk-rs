[build]
rustflags = [
    "--deny", "warnings",
    "--check-cfg", "cfg(groundhog_primary_crate, values(any()))",
]

[target.'all(cfg(target_os = "macos"), not(target_family = "wasm"))']
rustflags = [ "-C", "link-arg=-lSystem", ]

[registries]
groundhog = { index = "sparse+https://groundhog.dev/crates/api/v1/crates/" }

[source]
groundhog = { registry = "sparse+https://groundhog.dev/crates/api/v1/crates/" }
