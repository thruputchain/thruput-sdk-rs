[build]
rustflags = [ "--deny", "warnings" ]

[target.'cfg(target_os = "macos")']
rustflags = [ "--deny", "warnings", "-C", "link-arg=-lSystem", "-C", "link-arg=-Wl,-rpath,@loader_path" ]

[target.'cfg(target_os = "linux")']
rustflags = [ "--deny", "warnings", "-C", "link-arg=-Wl,-rpath,$ORIGIN" ]

# Keep dev/test builds lean: full debug info in ~150 test binaries (and
# trybuild's nested build, which reads this file but not the workspace
# manifest's profiles) is most of target/'s size. Workspace crates keep line
# tables so backtraces still show file:line. Repo config only; crates built as
# someone else's dependency use that consumer's profile.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# `cargo gnaw run quick`, from the repository root.
[alias]
gnaw = "run --quiet --locked --manifest-path gnaw/Cargo.toml --"

# Keep every repository workspace on the same experimental protocol bindings.
[patch.crates-io]
thruput-xdr = { git = "https://github.com/thruputchain/thruput-protocol-rs", rev = "b37ae645296fdd3860b8031e3f96112cce04b800" }
thruput-xdr-macros = { git = "https://github.com/thruputchain/thruput-protocol-rs", rev = "b37ae645296fdd3860b8031e3f96112cce04b800" }
thruput-syscall = { git = "https://github.com/thruputchain/thruput-protocol-rs", rev = "b37ae645296fdd3860b8031e3f96112cce04b800" }
thruput-spec = { git = "https://github.com/thruputchain/thruput-protocol-rs", rev = "b37ae645296fdd3860b8031e3f96112cce04b800" }
thruput-trace = { git = "https://github.com/thruputchain/thruput-protocol-rs", rev = "b37ae645296fdd3860b8031e3f96112cce04b800" }
