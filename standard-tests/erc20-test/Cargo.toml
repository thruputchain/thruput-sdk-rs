[package]
name = "erc20-test"
edition.workspace = true
version.workspace = true

[lib]
doctest = false
test = false

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }
groundhog-erc20-metadata-if = { workspace = true, optional = true}
thiserror = { workspace = true }

[features]
metadata = ["dep:groundhog-erc20-metadata-if"]
default = ["no_check_aborts"]
# don't check operations expected to cause erc20 abort
no_check_aborts = []
