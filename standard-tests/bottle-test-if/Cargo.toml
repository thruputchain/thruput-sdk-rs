[package]
name = "bottle-test-if"
version.workspace = true
edition.workspace = true
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
description = "Bottle-test interface"
repository = "https://github.com/groundhogchain/sdk_rs"

[dependencies]
sdk = { workspace = true }
xdrs = { workspace = true, features = ["derive", "extras", "int128_xdr"] }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
mock = ["std", "sdk/mock"]
std = ["sdk/std"]
