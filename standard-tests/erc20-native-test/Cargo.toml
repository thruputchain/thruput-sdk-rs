[package]
name = "erc20-native-test"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors = ["Groundhog Team"]
license = "MIT OR Apache-2.0"
description = "Native-execution harness for the ERC20 conformance tests"
repository = "https://github.com/groundhogchain/sdk_rs"

[lib]
doctest = false
test = false

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }
groundhog-xdr = { workspace = true }
thiserror = { workspace = true }
erc20-test = { workspace = true }

[dev-dependencies]
sdk = { workspace = true, features = ["dev"] }

[features]
metadata = ["erc20-test/metadata"]
no_check_aborts = ["erc20-test/no_check_aborts"]
