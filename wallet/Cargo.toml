[package]
name = "wallet"
edition.workspace = true
version.workspace = true

[lib]
test = false

[dependencies]
sdk = { workspace = true, features = ["std"] }
groundhog-contract-util = { workspace = true }
groundhog-nocontract-if = { workspace = true }
groundhog-xdr = { workspace = true }
xdrs = { workspace = true, features = ["alloc", "derive"] }
sha2.workspace = true

[dependencies.ed25519-compact]
version = "2.2.0"
default-features = false
features = ["opt_size", "self-verify"]
