# Config for `cargo cooldown`.
# Keep in sync with .cargo/cooldown.toml and .cargo/cooldown-allowlist.toml

[cooldown]
incompatible-publish-age = "deny"
lockfile-baseline = "ignore"

[registry]
global-min-publish-age = "15 days"

# Security fix for ctutils 0.4.3 and earlier (fixed in 0.4.4).
# (remove this after 2026 Nov 8)
[[allow.exact]]
crate = "ctutils"
version = "0.4.5"

# Grandfathered version (remove this after 2026 Nov 9)
[[allow.exact]]
crate = "smallvec"
version = "1.16.3"

# Exemptions for first-party (thruput-*) crates.
[[allow.package]]
crates = [
    # from thruputchain/xdrs
    "thruput-xdrs",
    "thruput-xdr-common",
    "thruput-xdr-derive",
    "thruput-xdr-repr",
    "thruput-rpc-api",
    "thruput-rpc-driver",

    # from thruputchain/thruput-protocol-rs
    "thruput-spec",
    "thruput-syscall",
    "thruput-trace",
    "thruput-xdr",
    "thruput-xdr-macros",
]
min-publish-age = "0"
