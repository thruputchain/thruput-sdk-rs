[cooldown]
incompatible-publish-age = "deny"
lockfile-baseline = "ignore"

[registry]
global-min-publish-age = "15 days"

# First-party crates that thruputchain/xdrs publishes to crates.io. They were
# exempt while they came from the thruput registry; keep them exempt.
[[allow.package]]
crates = [
    "thruput-xdrs",
    "thruput-xdr-common",
    "thruput-xdr-derive",
    "thruput-xdr-repr",
    "thruput-rpc-api",
    "thruput-rpc-driver",
]
min-publish-age = "0"

# First-party crates that thruputchain/thruput-protocol-rs publishes to
# crates.io. They were exempt while they came from the thruput registry; keep
# them exempt.
[[allow.package]]
crates = [
    "thruput-spec",
    "thruput-syscall",
    "thruput-trace",
    "thruput-xdr",
    "thruput-xdr-macros",
]
min-publish-age = "0"

# Security fix for ctutils 0.4.3 and earlier (fixed in 0.4.4).
[[allow.exact]]
crate = "ctutils"
version = "0.4.5"

# Grandfathered version (remove this after 2026 Nov 9)
[[allow.exact]]
crate = "smallvec"
version = "1.16.3"
